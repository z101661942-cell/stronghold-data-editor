<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫戍协议 · 盟约/数值编辑器</title>
<style>
  /* =====================================================================================
     设计系统：深色、低对比边框、清晰层级。风格参考现代编辑器界面（VS Code 的三段式、
     Linear 的克制配色、GitHub 的表单与焦点态）。所有 class 名保持原样，只换视觉。
     ===================================================================================== */
  :root{
    /* 背景：四级色阶。页面最深、卡片浮起、输入区最亮，保证层级一眼能读出来 */
    --bg:#080b11; --panel:#121722; --panel2:#1a202c; --raised:#202836;
    /* 边框：默认克制，悬停浮现 */
    --line:#232c3d; --line2:#334056; --line3:#46566f;
    /* 文字：主 / 次 / 弱 / 极弱 */
    --fg:#e8ecf3; --dim:#9aa7bd; --dim2:#6d7c95; --dim3:#4f5d75;
    --acc:#4d8dfa; --acc2:#2f6fe0; --acc-soft:#1a2740;
    --ok:#4ac26b; --warn:#e0a83c; --bad:#f46a6a; --gold:#e3b341;
    /* 类型 */
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono","Microsoft YaHei",monospace;
    --r:8px; --r-sm:6px;
    --shadow:0 8px 24px #00000059;
    --focus:0 0 0 3px #4d8dfa33;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.6 var(--sans);
       display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  code,kbd,pre{font-family:var(--mono)}

  /* ---------- 细滚动条（Chrome/Edge） ---------- */
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#28313f;border:3px solid transparent;background-clip:content-box;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4658;background-clip:content-box}
  :focus-visible{outline:none;box-shadow:var(--focus)}

  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);
         border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:2}
  .brand{font-weight:650;letter-spacing:.2px;font-size:14px;line-height:1.25}
  .brand small{display:block;color:var(--dim3);font-weight:400;font-size:10px;font-family:var(--mono);margin-top:1px}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-sm);
         padding:6px 11px;cursor:pointer;font:13px/1.4 var(--sans);transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--raised);border-color:var(--line3)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}
  button.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad);background:#2a1719}
  button.tiny{padding:2px 8px;font-size:11px;border-radius:5px}
  button.dirty{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset;color:#f5d68a}
  #btnResume{border-color:var(--warn);color:#f0c674;background:#241f12}
  #btnResume:hover:not(:disabled){background:#2e2716;border-color:#e0a83c}

  .chip{font:11px/1.7 var(--mono);padding:1px 8px;border-radius:99px;border:1px solid var(--line2);
        color:var(--dim);background:#0e131b;white-space:nowrap}
  .chip.ok{color:var(--ok);border-color:#23532f;background:#0f1d14}
  .chip.bad{color:var(--bad);border-color:#5a2727;background:#1e1113}
  .chip.warn{color:var(--warn);border-color:#4f3f16;background:#1c1710}
  .chip.gold{color:var(--gold);border-color:#5a4715;background:#1d1810}

  /* ---------- 页签：胶囊式，选中态明确 ---------- */
  nav{display:flex;gap:3px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:none;border:1px solid transparent;border-radius:7px;
             padding:6px 12px;color:var(--dim);white-space:nowrap;font-size:13px;transition:background .12s,color .12s}
  nav button:hover:not(:disabled){color:var(--fg);background:var(--panel2);border-color:transparent}
  nav button.on{color:#fff;background:var(--acc2);border-color:var(--acc2);font-weight:600;
                box-shadow:0 1px 8px #2f6fe055}
  nav button.on:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}
  nav button b{font-weight:600;font-family:var(--mono);font-size:10.5px;color:var(--dim3);margin-left:5px}
  nav button.on b{color:#dbe9ff}
  nav .badge{display:inline-block;min-width:17px;margin-left:6px;padding:0 5px;background:var(--bad);color:#fff;
             border-radius:99px;font:10px/16px var(--mono);text-align:center;vertical-align:1px}

  /* ---------- 主体三段式 ---------- */
  main{flex:1;display:flex;min-height:0}
  .list{width:308px;min-width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  .list .tools{padding:9px 10px;display:flex;gap:6px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel)}
  .list .tools.row2{padding:5px 10px 9px;border-top:none}
  .list .tools .seg{display:flex;gap:3px;background:#0a0e15;border:1px solid var(--line);border-radius:7px;padding:2px}
  .list .tools .seg button{border:none;background:none;padding:4px 10px;border-radius:5px;color:var(--dim);font-size:12px}
  .list .tools .seg button:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
  .list .tools .seg button.on{background:var(--acc2);color:#fff;font-weight:600}
  .list .tools .numchip{margin-left:auto;font:10.5px var(--mono);color:var(--dim3);
                        background:#0a0e15;border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
  .list input[type=search]{flex:1;min-width:0}
  .list .scroll{flex:1;overflow:auto;scrollbar-gutter:stable}
  .row{padding:7px 12px;border-bottom:1px solid #151a23;cursor:pointer;display:flex;align-items:center;gap:7px;
       transition:background .1s}
  .row:hover{background:var(--panel2)}
  .row.on{background:var(--acc-soft);box-shadow:inset 2px 0 0 var(--acc)}
  .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .row .sub{color:var(--dim3);font:10.5px var(--mono);flex:none;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--gold);flex:none;box-shadow:0 0 6px #e3b34166}

  /* ---------- 详情 ---------- */
  .detail{flex:1;overflow:auto;padding:18px 22px 60px;min-width:0;scrollbar-gutter:stable}
  .detail > *{max-width:1180px}
  .detail h2{margin:0 0 4px;font-size:19px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .detail h3{margin:0 0 6px;font-size:13px;color:var(--dim);font-weight:600}
  .detail .sub{color:var(--dim2);font:11px var(--mono);margin-bottom:16px;word-break:break-all;line-height:1.7}
  code.copyid{cursor:pointer;border-bottom:1px dotted var(--line3);transition:color .12s}
  code.copyid:hover{color:var(--acc);border-bottom-color:var(--acc)}

  /* 卡片（原 fieldset）：更轻的边框、更明确的标题 */
  fieldset{border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px;padding:14px 16px 16px;background:var(--panel)}
  fieldset > legend{padding:0 7px;color:var(--fg);font-size:12px;font-weight:600;margin-left:-3px}
  fieldset > legend code{color:var(--gold);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px 16px}
  label.f{display:flex;flex-direction:column;gap:4px}
  label.f > span{color:var(--dim2);font:10.5px/1.5 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  input,select,textarea{background:#0a0e16;color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-sm);
                        padding:6px 9px;font:13px/1.5 var(--sans);width:100%;transition:border-color .12s,box-shadow .12s,background .12s}
  input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--line3)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--focus);background:#080b11}
  input::placeholder,textarea::placeholder{color:var(--dim3)}
  input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  select{cursor:pointer}
  label.f.bb > span.k{white-space:normal;line-height:1.45;font-family:var(--mono);color:var(--dim)}
  label.f.bb > span.k span.cn{color:var(--dim3);font-family:var(--sans)}
  label.f.bb > span.k b.val{color:var(--ok);font-weight:600;font-family:var(--mono)}
  label.f.bb input{color:#bcd5ff}
  input.changed,select.changed,textarea.changed{border-color:var(--gold);background:#191508}
  input.changed.num{color:#f5d68a}
  textarea{resize:vertical;min-height:60px;font-family:var(--mono);font-size:12px;line-height:1.65}
  .hint{color:var(--dim2);font-size:11.5px;line-height:1.75;margin:8px 0 0}
  .hint code{color:var(--dim);background:#0c1017;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
  .del{color:var(--bad);background:none;border:none;cursor:pointer;padding:0 4px;font-size:14px;line-height:1;border-radius:4px}
  .del:hover{background:#2a1719}

  /* ---------- 名单标签 ---------- */
  .idlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  /* 可拖动的特质/盟约条目：整条能拖，左侧把手提示「能拖」 */
  .idlist .tag[draggable=true]{cursor:grab}
  .idlist .tag[draggable=true]:active{cursor:grabbing}
  .tag .grip{color:var(--dim3);cursor:grab;font-size:11px;letter-spacing:-1px;user-select:none;margin-right:-2px}
  .tag.dragging{opacity:.4;border-style:dashed}
  /* 拖到别的干员上时，给那一行一个明确的落点提示 */
  .row.droptarget{background:#1d3524;box-shadow:inset 0 0 0 1px var(--ok)}
  /* 拖动中：左侧名单变成「放到哪个干员」的接收区 */
  .list.droppable .scroll{outline:1px dashed var(--acc);outline-offset:-4px}
  .dropbar{padding:6px 10px;background:#1a2740;border-bottom:1px solid var(--line);color:#cfe0ff;font-size:11.5px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);
       border-radius:99px;padding:2px 5px 2px 10px;font:11px var(--mono);max-width:100%}
  .tag:hover{border-color:var(--line3)}
  .tag.bad{border-color:var(--bad);color:var(--bad);background:#1e1113}
  .tag .ver{color:var(--dim3);font-size:10px}
  datalist{display:none}
  .tag.add{background:none;border-style:dashed;color:var(--dim2);padding:2px 10px}
  .addbox{display:flex;gap:7px;margin-top:9px;align-items:center;flex-wrap:wrap}
  .addbox input{flex:1;min-width:140px;font-family:var(--mono);font-size:12px}

  /* ---------- 文案卡 ---------- */
  .txrow{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r-sm);
         padding:12px 14px;margin-bottom:11px;background:var(--panel2)}
  .txrow .txhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .txrow .txhead b{color:var(--dim2);font:11px var(--mono);font-weight:600}
  .txrow .txhead code{color:var(--gold);font:12px var(--mono)}
  .txrow textarea{width:100%;min-height:66px}
  .txrow .txfoot{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}
  .txrow .hint{margin:7px 0 0}
  .cand{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;padding:10px;border:1px dashed var(--line2);
        border-radius:var(--r-sm);background:var(--panel2)}
  .candbtn{font-family:var(--mono);font-size:11px}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim2);font-weight:600;font-size:11px;text-transform:none;
     position:sticky;top:0;background:var(--panel);z-index:1}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--panel2)}
  td.old{color:var(--bad);word-break:break-all}
  td.new{color:var(--ok);word-break:break-all}
  td.k{color:var(--dim);word-break:break-all}
  .empty{color:var(--dim2);padding:36px 20px;text-align:center;font-size:13px}
  pre{background:#0a0e15;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;overflow:auto;
      max-height:46vh;font:12px/1.7 var(--mono)}

  /* ---------- 校验问题列表 ---------- */
  ul.issues{list-style:none;margin:0;padding:0}
  ul.issues li{padding:8px 10px;border-bottom:1px solid var(--line);font:12px/1.7 var(--mono);word-break:break-all}
  ul.issues li:last-child{border-bottom:none}
  ul.issues li:hover{background:var(--panel2)}
  ul.issues li b{font-weight:600}
  .lvl-bad{color:var(--bad)} .lvl-warn{color:var(--warn)} .lvl-info{color:var(--dim)}

  /* ---------- 弹窗 ---------- */
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:12px;
         max-width:min(960px,92vw);width:960px;padding:0;box-shadow:var(--shadow)}
  dialog::backdrop{background:#04060ad9;backdrop-filter:blur(2px)}
  dialog .dh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
             font-size:14px}
  dialog .db{padding:16px;max-height:72vh;overflow:auto}
  dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

  /* ---------- 浮层提示 ---------- */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2431ee;border:1px solid var(--line3);
         border-radius:9px;padding:10px 18px;box-shadow:var(--shadow);z-index:99;max-width:min(80vw,720px);
         font-size:12.5px;backdrop-filter:blur(6px);animation:toastin .16s ease-out}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
  .drop{outline:2px dashed var(--acc);outline-offset:-8px}

  /* ---------- 响应式：窄屏时列表变顶栏 ---------- */
  @media (max-width:860px){
    main{flex-direction:column}
    .list{width:auto;min-width:0;max-height:42vh;border-right:none;border-bottom:1px solid var(--line)}
    .detail{padding:14px 14px 48px}
    .brand small{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">卫戍协议 · 数据编辑器<small id="brandFiles">bonds / chess / garrisons / backups</small></div>
  <span id="dirChip" class="chip">未授权目录</span>
  <div class="spacer"></div>
  <button id="btnResume" hidden title="用上次授权的目录（Chrome 会再确认一次权限）">继续用上次的目录</button>
  <button id="btnOpen" class="primary" title="授权到游戏的 data 目录后，保存会直接写盘">选择 data 目录</button>
  <button id="btnImport" title="没授权目录时的退路：导入 json → 改 → 下载覆盖">导入 JSON</button>
  <button id="btnRevertAll" class="danger" disabled>全部还原</button>
  <button id="btnPatch" title="把当前改动生成可重放的补丁脚本（换版本/重建数据后用）">补丁脚本</button>
  <button id="btnShare" title="把改动导成一个 json 文件，可以在另一个编辑器里导入；也可以导入别人给的">导出/导入</button>
  <button id="btnSave" class="primary" disabled title="Ctrl+S">保存到 data/</button>
</header>

<nav id="tabs">
    <button data-tab="op" class="on">干员 <b id="nOps">0</b><span class="badge" id="bOps" hidden>0</span></button>
    <button data-tab="garrisons">特性修改 <b id="nTraits">0</b><span class="badge" id="bTraits" hidden>0</span></button>
    <button data-tab="bonds">盟约修改 <b id="nBonds">0</b><span class="badge" id="bBonds" hidden>0</span></button>
	<button data-tab="mix">混合特性 <b id="nMix">0</b><span class="badge" id="bMix" hidden>0</span></button>
	<button data-tab="items">道具 <b id="nItems">0</b><span class="badge" id="bItems" hidden>0</span></button>
	<button data-tab="choices">悬赏 · 战术卡 <b id="nCards">0</b><span class="badge" id="bCards" hidden>0</span></button>
	<button data-tab="effects">效果 <b id="nEffects">0</b><span class="badge" id="bEffects" hidden>0</span></button>
    <button data-tab="changes">改动 <span class="badge" id="bChanges" hidden>0</span></button>
    <button data-tab="validate">校验 <span class="badge" id="bIssues" hidden>0</span></button>
    <button data-tab="glossary">键名词典</button>
    <button data-tab="help">使用说明</button>
</nav>

<main id="main"></main>

<dialog id="dlg">
  <div class="dh"><b id="dlgTitle"></b><div class="spacer"></div><button id="dlgClose">关闭</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button id="dlgCopy">复制</button></div>
</dialog>

<input type="file" id="filePick" multiple accept=".json" hidden>

<script type="module">
/* =====================================================================================
   卫戍协议 · 盟约/数值编辑器（单文件、无依赖）

   用法：Chrome / Edge 打开本文件 → 「选择 data 目录」授权到 Stronghold-Protocol/data
        → 改 → 「保存到 data/」→ 刷新游戏页面生效（改到数值时建议顺带重启服务器）。

   安全：保存前自动把原文件备份为 <name>.bak-<时间戳>.json；「全部还原」回到载入时的快照。
        改动只在内存里，只有点保存才落盘；关页面前有改动会拦一下。
   ===================================================================================== */

/*
 * 受管文件：装载 → 编辑 → 保存 / 补丁 / 分享，全都在这一张表里派生。
 * 加新文件**只改这里**（外加 tableOfKind 的表形状判断与页签渲染），不要再写第二份清单。
 */
const FILES = {
  bonds: 'bonds.json',
  chess: 'chess.json',
  garrisons: 'garrisons.json',
  backups: 'backups.json',
  items: 'items.json',
  choices: 'choices.json',
  effects: 'effects.json',
};
/**
 * 只读参照文件：载进来只做「谁在用这条效果」的反查，**不参与保存 / 补丁 / 分享**。
 * bands.json 是策略（乐队）数据，它的 effectId 指向 effects.json 的 BAND_INITIAL 条目。
 */
const AUX_FILES = { bands: 'bands.json' };

/**
 * 引擎实现的特质 effectKey 清单（源码：server/sim/content/garrisons/meta.js 的 `H.*`、
 * battle.js 的 `INSTALLERS` / `READERS` / 命中修正）。
 *
 * 为什么需要它：特质是靠 effectKey 找处理器的（`registry.get('garrison:' + effectKey)`）。
 * 引擎只认这些键，认不出就**默默不生效**。所以「新增一条特质」的正确做法是：挑一个现成的
 * effectKey，改它的 bb 数值与文案；凭空编一个键名不会有任何效果。
 * key → [分类, 一句话作用]。分类：prep=备战期（meta.js），battle=战斗中（battle.js）。
 */
const EFFECT_KEYS = {
  SERVER_ADD_BOND: ['prep', '给指定干员/自身追加盟约成员资格'],
  SERVER_ADD_BOND_CHESS_ALL: ['prep', '给所有棋子追加盟约成员资格'],
  SERVER_ADD_BOND_METHOD: ['prep', '按条件（如站位、同名）追加盟约资格'],
  SERVER_ADD_MULTIPLE_BOND: ['prep', '一次追加多条盟约资格'],
  SERVER_ADD_BOND_ACTIVATED_MOST_LAYER: ['prep', '给已激活层数最高的盟约追加资格'],
  SERVER_ADD_ACT_BOND_DIFF_LV_MOST_LAYER: ['prep', '按层数差给某条盟约追加资格'],
  SERVER_ADD_BOND_IN_HAND: ['prep', '手里（未上场）的棋子也计入盟约'],

/** 把 bb 值格式化成好读的形式：百分比 / 倍率 / 带符号数值。 */
function bbValueText(key, v) {
  if (typeof v !== 'number' || !Number.isFinite(v)) return '';
  const g = BB_GLOSS[key];
  const pct = !g || g[1] === '百分比';
  if (pct && Math.abs(v) <= 2.0000001) {
    // 0..2 视作比例：1.5 是倍率，其余按带符号百分比
    if (v > 1 && v !== 1) return '= ×' + v;
    return '= ' + (v > 0 ? '+' : '') + (v * 100).toFixed(Math.abs((v * 100) % 1) > 1e-9 ? 1 : 0) + '%';
  }
  return '= ' + (v > 0 && pct ? '+' : '') + v;
}

/** 标签：键名 + 中文含义 + 当前值解读。 */
function bbLabel(key, v) {
  const g = BB_GLOSS[key];
  const val = bbValueText(key, v);
  const cn = g ? g[0] : '字典未收录';
  // 行内形式外面还要包一层括号，所以内层括号转成方括号，避免「（…（…）…）」
  const inline = cn.replace(/（/g, '[').replace(/）/g, ']');
  return { cn, inline, val, unit: g ? g[1] : '' };
}

/* ---- 目录句柄持久化 ----
 * File System Access API 的目录句柄可以存进 IndexedDB，刷新后取回来再 requestPermission，
 * 就不用每次都重新挑目录。权限必须由用户手势触发，所以取回后只在按钮上提示「继续用上次的目录」。
 */
const IDB_NAME = 'sp-bond-editor', IDB_STORE = 'handles', IDB_KEY = 'dataDir';
function idb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') { reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, value) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}

/** 混合特性页的选择状态（跨重绘保留；必须在这里先声明，首渲染的徽标要用）。 */
const mixSel = { ids: [], name: '', chess: '' };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/** 深拷贝；undefined 原样返回（往一个原本不存在的字段写值时会出现）。 */
const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const fmt = (v) => (typeof v === 'number' ? String(v) : typeof v === 'string' ? `"${v}"` : JSON.stringify(v));
/**
 * 按点号读路径，但保留含 `/` 的段（档位键如 2/1/4/0 会作为一段出现）。
 * 「.」与「/」相邻时视为档位键内部的分隔，不作为字段分隔。
 */
const splitPath = (p) => String(p).split(/\.(?!\/)|(?<!\/)\./);
const getPath = (o, p) => splitPath(p).reduce((a, k) => (a == null ? a : a[k]), o);

/* data/*.json 的几种形状：bonds/garrisons 是「id → 记录」扁平表；chess 可能被包一层；
   backups 是根级记录（units / tokens / diy 三块），不拆表——DIY 页签按 charId 合并两处来源。 */
const bondsTable = (j) => (j && j.bonds ? j.bonds : j);
const garrTable  = (j) => (j && j.garrisons ? j.garrisons : j);
const chessTable = (j) => (j && j.chess ? j.chess : j);
const itemsTable = (j) => (j && j.items ? j.items : j);
const effectsTable = (j) => (j && j.effects ? j.effects : j);
/** backups.json（units/tokens/diy）与 choices.json（cards/events/pools…）都是根级布局，不拆表。 */
const backupsTable = (j) => j;
const choicesTable = (j) => j;
/**
 * 根级布局的受管文件：记录 id 本身是「从文档根出发的点号路径」（如 cards.bounty.3、diy.operators.x），
 * 不是扁平表里的键。补丁脚本与分享包用同一套读法，两边必须一致。
 */
const ROOT_KINDS = new Set(['backups', 'choices']);
/** 按文件形状取「id → 记录」的表；根级布局原样返回（调用方用点号路径取记录）。 */
function tableOfKind(kind, json) {
  if (kind === 'bonds') return bondsTable(json);
  if (kind === 'garrisons') return garrTable(json);
  if (kind === 'chess') return chessTable(json);
  if (kind === 'items') return itemsTable(json);
  if (kind === 'effects') return effectsTable(json);
  return json;   // backups / choices：保留文档根
}
/** 按点号路径从文档根取记录（根级布局专用）。 */
function rootRec(kind, id) {
  const t = work[kind];
  if (!t) return null;
  return getPath(t, id) || null;
}
/** 按点号路径写记录（根级布局专用）：沿途缺失的对象/数组按段创建。 */
function rootSetRec(kind, id, rec) {
  const segs = splitPath(id);
  if (!work[kind]) work[kind] = {};
  let o = work[kind];
  for (let i = 0; i < segs.length - 1; i++) {
    const k = segs[i];
    if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(segs[i + 1]) ? [] : {};
    o = o[k];
  }
  o[segs[segs.length - 1]] = rec;
}
/**
 * 统一的「按 id 取记录」入口：扁平表直接查键，根级布局走点号路径。
 * 新增页面一律用它，别再各写一份 `work[kind][id]`。
 */
function recordOf(kind, id) {
  if (id == null) return null;
  return ROOT_KINDS.has(kind) ? rootRec(kind, id) : ((work[kind] || {})[id] ?? null);
}
/** 表单/按钮里取「记录本体」的容错版：根级布局或扁平表都行，取不到给空对象，免得渲染崩在 undefined 上。 */
const hostOf = (kind, id) => recordOf(kind, id) || {};

/**
 * 两条特质文本互相串入的检测（用户报告：「上面的特质也被复制在了一起」）。
 *
 * 特征：一条特质的显示文本里，出现了「另一条**由同一个人携带**的特质」的核心句。
 * 这几乎总是编辑时误把上一条的文本一起粘贴进来造成的 —— 显示上会出现两段效果，而数值只对得上其中一段。
 */
function crossTraitConflicts() {
  const out = [];
  const fingerprint = (t) => [...String(t || '').matchAll(/使(?:已激活的)?【[^】]+】[^，。；]{0,14}层数\s*[+\-]?\d+/g)]
    .map((m) => m[0].replace(/<[^>]*>/g, '').replace(/\s+/g, ''));
  const shown = (gid) => {
    const g = work.garrisons[gid] || {};
    return String(g.descRaw || g.desc || '');
  };
  for (const [chessId, rec] of Object.entries(work.chess || {})) {
    const gids = (rec.garrisonIds || []).filter((g2) => work.garrisons[g2]);
    if (gids.length < 2) continue;
    for (const gid of gids) {
      const mine = fingerprint(shown(gid));
      if (mine.length < 2) continue;                       // 只有一段核心效果：正常
      for (const other of gids) {
        if (other === gid) continue;
        const others = fingerprint(shown(other));
        const shared = mine.filter((x) => others.includes(x));
        if (shared.length) {
          out.push({ kind: 'chess', id: chessId, gid, other, shared });
          break;
        }
      }
    }
  }
  return out;
}

/** 干员记录的两条：普通 _a 与精锐 _b。展示用中文标注，避免混淆。 */
const CHESS_VER = { a: '普通（精一）', b: '精锐（精二）' };
const CHESS_VER_SHORT = { a: '精一', b: '精二' };
function chessVer(rec) { return rec && rec.isGolden ? 'b' : 'a'; }
function chessVerLabel(rec) { return CHESS_VER[chessVer(rec)]; }
function chessTierLabel(rec) { return 'T' + rec.tier + ' · ' + CHESS_VER[chessVer(rec)]; }
/** 干员名的后缀：T5·精一 / T6·精二（未进卡池的加标记）。 */
function chessShortTag(rec) {
  if (!rec) return '';
  return 'T' + rec.tier + '·' + CHESS_VER_SHORT[chessVer(rec)] + (rec.visible ? '' : '·未进卡池');
}
/** 另一条记录的 id（普通 ↔ 精锐）。 */
function pairIdOf(kind, rec, id) {
  if (kind !== 'chess' || !rec) return null;
  const other = rec.isGolden ? rec.baseId : rec.goldenId;
  return other && other !== id ? other : null;
}
/** 某个池子里 id 对应的记录版本标注（用于 id 标签）。 */
/** 特质同样成对：garrison_N_a = 精一版，garrison_N_b = 精二版。 */
function garrisonPairKey(id) { return String(id).replace(/_[ab]$/, ''); }
function garrisonVerLabel(id) {
  const m = String(id).match(/_([ab])$/);
  return m ? (m[1] === 'b' ? '精二' : '精一') : '';
}
function verTagOf(poolKind, id) {
  if (poolKind === 'chess') return chessShortTag(work.chess && work.chess[id]);
  if (poolKind === 'garrisons') return garrisonVerLabel(id);
  return '';
}
function meta(kind, id, rec) {
  if (kind === 'bonds') return { name: rec.name || id, sub: `${rec.isCore ? '核心' : '附加'} · ${(rec.thresholds || []).join('/')}` };
  if (kind === 'chess') return { name: rec.name || id, sub: chessTierLabel(rec) };
  return { name: (rec.desc || id).split('\n')[0].slice(0, 34), sub: `${rec.eventType || ''}`.slice(0, 18) };
}

function setField(kind, id, path, value, { logIt = true } = {}) {
  // 用 recordOf：扁平表查键，根级布局（backups / choices）走点号路径——两条读法必须同一处
  const rec = recordOf(kind, id);
  if (!rec) return;
  const segs = path.split('.');
  let o = rec;
  for (let i = 0; i < segs.length - 1; i++) {
    if (o[segs[i]] == null || typeof o[segs[i]] !== 'object') o[segs[i]] = {};
    o = o[segs[i]];
  }
  const last = segs[segs.length - 1];
  const from = o[last];
  if (logIt && JSON.stringify(from) === JSON.stringify(value)) return;
  o[last] = value;
  // 自动同步只在非抑制状态下触发。这里**只同步同一条记录内**的 desc ↔ descRaw：
  // 游戏渲染 descRaw，只改 desc 不会显示。配对特质（_a/_b）刻意不自动同步——
  // 两版本来就是两套效果（精一 +1 / 精二 +2），自动同步会把刻意的差异抹掉。
  if (!suppressSync) {
    syncDescPair(kind, id, path, value);
  }
  if (logIt) {
    const prev = log.find((e) => e.file === kind && e.id === id && e.field === path);
    if (prev) prev.to = clone(value);
    else log.push({ file: kind, id, field: path, from: clone(from), to: clone(value) });
  }
  renderBadges();
}

const touched = (kind, id) => log.some((e) => e.file === kind && e.id === id);

/* ============================ 文件读写 ============================ */

async function pickDirectory() {
  if (!window.showDirectoryPicker) {
    toast('此浏览器不支持目录写入，请用 Chrome / Edge；或点「导入 JSON」后手动下载覆盖。', 5600);
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ id: 'sp-data', mode: 'readwrite' });
  } catch (e) {
    if (e.name !== 'AbortError') toast('选择目录失败：' + e.message, 4200);
    return;
  }
  // 记住这个目录：下次打开就能「继续用上次的目录」，不用重新找
  try { await idbPut(IDB_KEY, dirHandle); } catch { /* 隐私模式等，忽略 */ }
  const rb = $('#btnResume'); if (rb) rb.hidden = true;
  await loadFromDirectory();
}

/** 开机：如果上次存过目录句柄，就在顶栏露出「继续用上次的目录」。 */
async function offerResume() {
  const rb = $('#btnResume');
  if (!rb || !window.showDirectoryPicker) return;
  let h = null;
  try { h = await idbGet(IDB_KEY); } catch { return; }
  if (!h) return;
  rb.hidden = false;
  rb.textContent = '继续用上次的目录' + (h.name ? '（' + h.name + '）' : '');
  rb.addEventListener('click', async () => {
    try {
      // 权限必须由用户手势触发（这个点击就是）
      let perm = await h.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await h.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { toast('没有拿到写入权限，请点「选择 data 目录」重选一次。', 5200); return; }
    } catch (e) {
      toast('恢复上次的目录失败：' + e.message + '（请重新选择目录）', 5200);
      return;
    }
    dirHandle = h;
    rb.hidden = true;
    await loadFromDirectory();
  });
}

async function loadFromDirectory() {
  const missing = [];
  for (const [kind, name] of Object.entries(FILES)) {
    try {
      const fh = await dirHandle.getFileHandle(name);
      const json = JSON.parse(await (await fh.getFile()).text());
      const table = tableOfKind(kind, json);
      work[kind] = table;
      pristine[kind] = clone(table);
    } catch (e) {
      missing.push(`${name}（${e.name === 'NotFoundError' ? '目录里没有' : e.message}）`);
    }
  }
  // 只读参照（缺了不影响任何事，只是少一块「谁在用」的反查）
  for (const [kind, name] of Object.entries(AUX_FILES)) {
    try {
      const fh = await dirHandle.getFileHandle(name);
      aux[kind] = JSON.parse(await (await fh.getFile()).text());
    } catch { /* 没有就算了 */ }
  }
  if (missing.length) toast('未能载入：' + missing.join('；'), 6200);
  if (!Object.keys(FILES).some((k) => work[k])) { toast('这个目录里没有找到 data/*.json', 5000); return; }
  afterLoad();
}

function importFiles(fileList) {
  for (const f of [...fileList]) {
    const kind = Object.keys(FILES).find((k) => f.name === FILES[k] || f.name.endsWith(FILES[k]));
    const auxKind = kind ? null : Object.keys(AUX_FILES).find((k) => f.name === AUX_FILES[k] || f.name.endsWith(AUX_FILES[k]));
    if (!kind && !auxKind) continue;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        // 参照文件：只更新反查用的 aux，不进入 work / 保存 / 补丁
        if (auxKind) { aux[auxKind] = json; if (Object.keys(FILES).some((k) => work[k])) render(); return; }
        const table = tableOfKind(kind, json);
        work[kind] = table; pristine[kind] = clone(table);
        afterLoad();
      } catch (e) { toast(`${f.name} 解析失败：${e.message}`, 5000); }
    };
    reader.readAsText(f);
  }
}

function afterLoad() {
  clearIndexCache();
  for (const kind of Object.keys(FILES)) {
    if (work[kind] && !selected[kind]) selected[kind] = Object.keys(work[kind])[0] || null;
  }
  $('#dirChip').textContent = dirHandle ? `已载入 data（${dirHandle.name}）` : '已导入（只读，可下载）';
  $('#dirChip').className = 'chip ok';
  $('#btnSave').disabled = false;
  $('#btnRevertAll').disabled = false;
  validate(); render();
}

async function saveAll() {
  if (!Object.keys(FILES).some((k) => work[k])) return;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);

  if (!dirHandle) {
    for (const [kind, name] of Object.entries(FILES)) if (work[kind]) download(name, JSON.stringify(work[kind]));
    toast('已下载改动涉及的文件（' + Object.values(FILES).join(' / ') + ' 里凡是载入了的都会重新导出），覆盖到 data/ 后刷新游戏页面即可看到新文案', 5600);
    return;
  }
  try {
    for (const [kind, name] of Object.entries(FILES)) {
      if (!work[kind]) continue;
      try {
        const old = await dirHandle.getFileHandle(name);
        const text = await (await old.getFile()).text();
        const bak = await dirHandle.getFileHandle(`${name}.bak-${stamp}.json`, { create: true });
        const w0 = await bak.createWritable();
        await w0.write(text); await w0.close();
      } catch { /* 原文件不存在 */ }
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(work[kind]));
      await w.close();
    }
    for (const kind of Object.keys(FILES)) if (work[kind]) pristine[kind] = clone(work[kind]);
    log.length = 0;
    validate(); render();
    toast(`已保存（原件备份为 *.bak-${stamp}.json）。客户端数据走静态服务、按内容 ETag 回源，刷新游戏页面即可看到新文案；改到数值时建议重启服务器，让服务端校验也跟上。`, 9000);
  } catch (e) {
    toast('保存失败：' + e.message, 6000);
  }
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function revertAll() {
  clearIndexCache();
  for (const kind of Object.keys(FILES)) if (pristine[kind]) work[kind] = clone(pristine[kind]);
  log.length = 0;
  validate(); render();
  toast('已还原为载入时的内容（尚未写入磁盘）', 3600);
}

/* ============================ 校验器 ============================ */
/* 照搬构建管线与引擎的实际读法，尽量在保存前拦住「存进去但游戏跑不起来 / 面板与实效不符」。 */

function validate() {
  issues = [];
  const bad = (m, where) => issues.push({ lvl: 'bad', m, where });
  const warn = (m, where) => issues.push({ lvl: 'warn', m, where });
  const B = work.bonds, C = work.chess, G = work.garrisons;

  if (B) {
    if (Object.keys(B).length !== 23) warn(`盟约数量为 ${Object.keys(B).length}（原版 23）`, null);
    for (const [id, r] of Object.entries(B)) {
      if (r.bondId !== id) bad(`键名与 bondId 不一致：${id} ≠ ${r.bondId}`, id);
      const th = r.thresholds;
      if (!Array.isArray(th) || !th.length) warn('缺少 thresholds', id);
      else {
        if (!th.every((v, i, a) => i === 0 || a[i - 1] <= v)) bad(`thresholds 不是升序：${th.join(',')}`, id);
        const bb = r.bb || {};
        if (typeof bb.power_bond_char_cnt === 'number' && th[1] != null && bb.power_bond_char_cnt !== th[1]) warn(`门槛不同步：thresholds[1]=${th[1]} 但 bb.power_bond_char_cnt=${bb.power_bond_char_cnt}`, id);
        if (typeof bb.ex_bond_char_cnt === 'number' && th[2] != null && bb.ex_bond_char_cnt !== th[2]) warn(`门槛不同步：thresholds[2]=${th[2]} 但 bb.ex_bond_char_cnt=${bb.ex_bond_char_cnt}`, id);
        if (th.some((v) => !Number.isFinite(v))) bad('thresholds 里有非数字', id);
      }
      for (const [k, v] of Object.entries(r.bb || {})) if (typeof v !== 'number' || !Number.isFinite(v)) bad(`bb.${k} 不是有限数字：${fmt(v)}`, id);
      if (r.countMode && !['BOARD', 'BOARD_AND_DECK', 'BOARD_ALL_CHESS'].includes(r.countMode)) warn(`未知 countMode：${r.countMode}`, id);
      if (r.descRaw && plainOf(r.descRaw) !== String(r.desc ?? '').replace(/\s+/g, ' ').trim()) warn('desc 与 descRaw 不一致（界面显示 descRaw）', id);
      if (r.effectDescRaw && plainOf(r.effectDescRaw) !== String(r.effectDesc ?? '').replace(/\s+/g, ' ').trim()) warn('effectDesc 与 effectDescRaw 不一致（界面显示 effectDescRaw）', id);
      for (const b of String(r.bbStr?.bond_id || '').split(',').filter(Boolean)) if (!B[b]) bad(`bbStr.bond_id 指向不存在的盟约：${b}`, id);
      for (const ms of r.layerMilestones || []) {
        if (ms.effect && C === null) continue;
        if (ms.layer != null && !Number.isFinite(ms.layer)) bad(`layerMilestones.layer 非数字：${fmt(ms.layer)}`, id);
      }
      if (Array.isArray(r.members) && C) {
        // members = 所有拥有该盟约的干员（含 17 个隐藏记录）；visibleMembers = 其中进卡池的
        const all = Object.values(C).filter((c) => !c.isGolden && !c.isDiy && (c.bonds || []).includes(id)).map((c) => c.chessId).sort();
        const vis = Object.values(C).filter((c) => !c.isGolden && c.visible && (c.bonds || []).includes(id)).map((c) => c.chessId).sort();
        if (all.join(',') !== [...r.members].sort().join(',')) {
          const extra = [...r.members].filter((x) => !all.includes(x));
          const miss = all.filter((x) => !r.members.includes(x));
          warn(`members 与干员侧不一致（应有 ${all.length} 名、记录里 ${r.members.length} 名` + (extra.length ? `；多出 ${extra.slice(0, 3).join(',')}` : '') + (miss.length ? `；缺少 ${miss.slice(0, 3).join(',')}` : '') + `）—— 重跑 build-data 会重算`, id);
        }
        if (Array.isArray(r.visibleMembers) && vis.join(',') !== [...r.visibleMembers].sort().join(',')) warn(`visibleMembers 与「进卡池成员」不一致（应为 ${vis.length} 名，记录里 ${r.visibleMembers.length} 名）`, id);
      }
    }
  }

  if (C) {
    for (const [id, c] of Object.entries(C)) {
      if (!c.stats && !c.isDiy) warn('没有 stats（DIY 位除外）', id);
      for (const b of c.bonds || []) if (B && !B[b]) bad(`bonds 指向不存在的盟约：${b}`, id);
      for (const g of c.garrisonIds || []) if (G && !G[g]) bad(`garrisonIds 指向不存在的特质：${g}`, id);
      if (c.goldenId && !C[c.goldenId]) bad(`goldenId 指向不存在的记录：${c.goldenId}`, id);
      if (!c.isGolden && c.baseId !== id) bad(`baseId 不等于自身：${c.baseId}`, id);
      if (typeof c.stats?.maxHp === 'number' && c.stats.maxHp <= 0) bad('maxHp 必须 > 0', id);
      if (typeof c.stats?.atk === 'number' && c.stats.atk < 0) bad('atk 不能为负', id);
      if (typeof c.tier === 'number' && (c.tier < 1 || c.tier > 6)) warn(`tier 超出 1..6：${c.tier}`, id);
      if (c.isGolden) {
        const base = C[c.baseId];
        if (base) {
          const bondsDiffer = JSON.stringify([...(base.bonds || [])].sort()) !== JSON.stringify([...(c.bonds || [])].sort());
          // 特质是成对的：garrison_N_a（精一）对应 garrison_N_b（精二），按去掉后缀的键比较
          const norm = (arr) => [...new Set((arr || []).map((g) => String(g).replace(/_[ab]$/, '')))].sort();
          const garrisonsDiffer = JSON.stringify(norm(base.garrisonIds)) !== JSON.stringify(norm(c.garrisonIds));
          if (bondsDiffer || garrisonsDiffer) {
            const why = [bondsDiffer ? 'bonds' : null, garrisonsDiffer ? 'garrisonIds' : null].filter(Boolean).join(' / ');
            warn('精锐与本体不同步（' + why + '）', id);
          }
        }
      }
      for (const o of c.garrisonIds || []) {
        const g = G && G[o];
        if (g && Array.isArray(g.owners) && g.owners.length && !g.owners.includes(id) && !g.owners.includes(c.baseId))
          warn(`特质 ${o} 的 owners 里没有 ${id}（不影响判定，仅供参考）`, id);
      }
    }
  }

  if (G) {
    for (const [id, g] of Object.entries(G)) {
      if (g.garrisonId !== id) bad(`键名与 garrisonId 不一致：${id} ≠ ${g.garrisonId}`, id);
      // effectKey 找不到处理器 = 引擎默默不生效（数据写对了也不会有任何表现）
      if (g.effectKey && !Object.prototype.hasOwnProperty.call(EFFECT_KEYS, g.effectKey))
        bad(`effectKey「${g.effectKey}」引擎没有实现（不会生效）。请改用「使用说明」里列出的键名。`, id);
      // eventType 不在 GARRISON_HOOK 里 = 引擎直接跳过，特质永为不触发
      if (g.eventType && !Object.prototype.hasOwnProperty.call(EVENT_TYPES, g.eventType))
        bad(`eventType「${g.eventType}」不是引擎认的触发时机（永为不触发）。可用：${Object.keys(EVENT_TYPES).join(' / ')}`, id);
      /*
       * eventType 与 effectKey 的搭配提醒 —— 只在你**动过这两个字段**时给。
       * 不这么做会误报官方数据：有些合法组合本来就只有一条（例如 garrison_60_a 的
       * SERVER_PREP_START + SERVER_TRIGGER_ANOTHER），对它们吹哨纯属噪音。
       */
      const pairTouched = log.some((e) => e.file === 'garrisons' && e.id === id
        && (e.field === 'eventType' || e.field === 'effectKey'));
      if (pairTouched && g.eventType && g.effectKey
        && Object.prototype.hasOwnProperty.call(EVENT_TYPES, g.eventType)
        && Object.prototype.hasOwnProperty.call(EFFECT_KEYS, g.effectKey)) {
        const k = g.eventType + '|' + g.effectKey;
        let n = 0;
        for (const x of Object.values(work.garrisons || {})) {
          if (String(x.eventType) + '|' + String(x.effectKey) === k) n++;
        }
        if (n <= 1) warn(`你把这组改成了「${EVENT_TYPES[g.eventType][0]} + ${g.effectKey}」，这个搭配在全部特质里只有这一条，很可能不触发；可在「搭配参考」里挑一个现成的组合。`, id);
      }
      for (const [k, v] of Object.entries(g.bb || {})) if (typeof v !== 'number' || !Number.isFinite(v)) bad(`bb.${k} 不是有限数字：${fmt(v)}`, id);
      for (const bid of String(g.bbStr?.bond_id || '').split(',').filter(Boolean)) if (B && !B[bid]) bad(`bbStr.bond_id 指向不存在的盟约：${bid}`, id);
      for (const o of g.owners || []) if (C && !C[o]) warn(`owners 指向不存在的干员：${o}`, id);
      if (g.eventType === 'IN_BATTLE' && !g.effectKey) warn('战斗类特质缺少 effectKey', id);
      // 客户端显示 descRaw（优先），两者不一致说明改了 desc 却没改显示用文本
      // desc 保留了 <战斗中> 这类字面触发标签（见 DATA.md §0），descRaw 里没有，比较时要先归一化
      if (g.descRaw && plainOf(g.descRaw) !== String(g.desc ?? '').replace(/\s+/g, ' ').trim()) warn('desc 与 descRaw 不一致：界面显示 descRaw，改 desc 时编辑器会自动同步', id);
    }
  }

  // 自选六星（backups.json）：两处来源（diy.operators / units）与名单、锁定的引用完整性
  const BK = work.backups;
  if (BK) {
    const ops = (BK.diy && BK.diy.operators) || {};
    const units = BK.units || {};
    const known = (id) => !!ops[id] || !!units[id];
    for (const [cid, o] of Object.entries(ops)) {
      for (const b of o.bonds || []) if (B && !B[b]) bad('自选干员 ' + cid + ' 的 bonds 指向不存在的盟约：' + b, cid);
      if (!units[cid]) warn('自选干员 ' + cid + ' 在 units 里没有战斗数据（自选面板能选，但对局可能缺数值）', cid);
      if (o.rarity != null && units[cid] && units[cid].rarity != null && o.rarity !== units[cid].rarity)
        warn('星级不一致：diy.operators=' + o.rarity + '，units=' + units[cid].rarity, cid);
    }
    // ownedPool 是「可选的六星」，指向不存在的记录说明名单坏了；excluded 只是黑名单，
    // 放一个当前不在池里的 id 是合法的（也许它以后会出现），所以不算问题。
    for (const cid of (BK.diy && BK.diy.ownedPool) || []) {
      if (!known(cid)) warn('ownedPool 里的 ' + cid + ' 在 operators / units 里都没有记录', cid);
    }
    for (const [tier, arr] of Object.entries((BK.diy && BK.diy.prototypes) || {})) {
      if (!Array.isArray(arr)) { bad('diy.prototypes.' + tier + ' 不是数组', null); continue; }
      for (const cid of arr) if (!known(cid)) bad('prototypes.' + tier + ' 里的 ' + cid + ' 没有对应记录（自选会失败）', cid);
    }
    for (const [tier, byOp] of Object.entries((BK.diy && BK.diy.locked) || {})) {
      for (const [cid, rec] of Object.entries(byOp || {})) {
        if (!known(cid)) bad('locked.' + tier + ' 里的 ' + cid + ' 没有对应记录', cid);
        if (rec && typeof rec.skillIndex !== 'number') warn('locked.' + tier + '.' + cid + ' 的 skillIndex 不是数字', cid);
      }
    }
    // 每个自选干员的档位都要有数值
    for (const [cid, u] of Object.entries(units)) {
      if (!/^char_/.test(cid)) continue;
      const forms = u.forms || {};
      if (!Object.keys(forms).length) { warn('units.' + cid + ' 没有 forms（档位），引擎取不到数值', cid); continue; }
      for (const [key, f] of Object.entries(forms)) {
        const st = f && f.stats;
        if (!st || typeof st !== 'object') { bad('units.' + cid + '.forms["' + key + '"] 缺少 stats', cid); continue; }
        for (const [k, v] of Object.entries(st)) {
          if (typeof v !== 'number' || !Number.isFinite(v)) bad('units.' + cid + '.forms["' + key + '"].stats.' + k + ' 不是有限数字', cid);
        }
      }
    }
  }

  const rank = (i) => (i.lvl === 'bad' ? 0 : 1);
  /* ---------- 道具 / 悬赏·战术卡 / 效果（三张新表） ----------
   * 规则全部照引擎源码写，不是按字段名猜；注释里带上依据，方便以后对照 0.2.x 的改动。
   */
  const I = work.items, E = work.effects, CH = work.choices;
  /** 一条 buff 的通用检查（道具 / 效果 / 策略共用同一套读法）。 */
  const checkBuff = (rec, where, label, opts2 = {}) => {
    // 只在用户动过这条记录时才吹哨：官方数据本身就有一些「设计如此」的怪癖，
    // 一上来就报几百条提醒会把真正的问题淹掉（校验页的噪音控制原则与特质页一致）。
    const touchedRec = !!opts2.touched;
    const buffs = Array.isArray(rec.buffs) ? rec.buffs : [];
    if (rec.buffs != null && !Array.isArray(rec.buffs)) bad(`${label}.buffs 不是数组`, where);
    buffs.forEach((b, i) => {
      if (!b || typeof b !== 'object') { bad(`${label}.buffs[${i}] 不是对象`, where); return; }
      // buffs[].key：备战期 registry 按它找处理器（server/match/effectsMeta.js + builtinMeta.js）
      if (b.key && !BUFF_KEY_ZH[b.key]) bad(`${label}.buffs[${i}].key「${b.key}」源码里没有备战期处理者：写了也不会触发`, where);
      if (!b.key) warn(`${label}.buffs[${i}] 没有 key`, where);
      // bbStr.key：战斗侧按它找符文（server/sim/content/items/battle.js 的 BY_BUFF / installItem）
      const rune = b.bbStr && b.bbStr.key;
      if (rune && !RUNE_ZH[rune]) warn(`${label}.buffs[${i}].bbStr.key「${rune}」不是已知战斗符文键：战斗侧不会按它结算`, where);
      for (const [k, v] of Object.entries(b.bb || {})) {
        if (typeof v !== 'number' || !Number.isFinite(v)) bad(`${label}.buffs[${i}].bb.${k} 不是有限数字：${fmt(v)}`, where);
        else if (!BB_GLOSS[k]) warn(`${label}.buffs[${i}].bb.${k} 是词典未收录的数值键（含义不明，改之前先确认）`, where);
      }
      for (const k of Object.keys(b.bbStr || {})) if (k !== 'key' && !BBSTR_GLOSS[k]) warn(`${label}.buffs[${i}].bbStr.${k} 是未知引用键`, where);
    });
    // params 必须与 buffs 摊平结果一致：战斗侧读 buffs、备战侧读 params，不一致就会出现「面板与实际不符」
    const { flat, dup } = foldParams(buffs);
    const cur = rec.params && typeof rec.params === 'object' ? rec.params : null;
    if (cur) {
      const diff = [...new Set([...Object.keys(flat), ...Object.keys(cur)])].filter((k) => JSON.stringify(flat[k]) !== JSON.stringify(cur[k]));
      if (diff.length) warn(`${label} 的 params 与 buffs 不一致（${diff.slice(0, 4).join('、')}${diff.length > 4 ? '…' : ''}）：`
        + '战斗侧读 buffs、引擎内置的备战效果读 params，只改一处会两边不一致', where);
    }
    if (touchedRec && dup.length) warn(`${label} 的 buffs 里有重名键（${dup.join('；')}）：摊平成 params 时先出现者胜，备战效果只会看到留下的那个值`, where);
  };

  if (E) {
    for (const [id, r] of Object.entries(E)) {
      if (r.effectId !== id) warn(`键名与 effectId 不一致：${id} ≠ ${r.effectId}（引用方按 effectId 找它）`, id);
      if (!EFFECT_TYPE_ZH[r.effectType]) warn(`effectType「${r.effectType}」引擎里没有这个类型`, id);
      if (r.continuedRound != null && typeof r.continuedRound !== 'number') bad(`continuedRound 不是数字：${fmt(r.continuedRound)}`, id);
      checkBuff(r, id, '效果', { touched: touched('effects', id) });
      /*
       * 引用关系（1:1，已逐条核对）：
       *   EQUIP←items、ENEMY_GAIN←cards.bounty、BUFF_GAIN←cards.tactic、BAND_INITIAL←bands、BOND←bonds。
       * 只检查「这条效果没人用」与「使用者那边找不到效果」两个方向。
       */
      if (['EQUIP', 'ENEMY_GAIN', 'BUFF_GAIN', 'BOND'].includes(r.effectType) && !effectOwners(id).length) {
        warn(`这条 ${r.effectType} 效果没有任何记录引用它（可能是废弃条目）`, id);
      }
      // ENEMY 那 6 条运行期真的没人读：真正的倍率在 config.json 的 modes[].enemyScale 里（build-data 算好的）
      if (r.effectType === 'ENEMY' && touched('effects', id))
        warn('ENEMY 类效果运行期不会被读：敌人倍率由 config.json 的 modes[].enemyScale 决定，改这里不会生效', id);
    }
  }

  if (I) {
    const itemIds2 = Object.keys(I);
    for (const [id, r] of Object.entries(I)) {
      // 商店三兄弟：isShopItem 会因它们为真/超范围而把道具从所有商店池里剔掉（sim/simdata.js:72-73）
      if (typeof r.tier !== 'number' || !Number.isInteger(r.tier) || r.tier < 1 || r.tier > 6)
        bad(`tier 必须是 1..6 的整数（现在是 ${fmt(r.tier)}）：不是整数会让它从所有商店池里消失`, id);
      if (typeof r.price !== 'number' || !Number.isFinite(r.price) || r.price < 0)
        bad(`price 必须是非负数字（现在是 ${fmt(r.price)}）：引擎会静默回落到 2`, id);
      // 合成：服务端与客户端都要求 mergeable === true 且 1 < upgradeNum < 100（player/acquire.js:255-258、invariants.js:155-157）
      const canMerge = r.mergeable === true;
      const num = r.upgradeNum;
      if (canMerge && !(typeof num === 'number' && num > 1 && num < 100))
        bad(`mergeable=true 但 upgradeNum=${fmt(num)}（必须 >1 且 <100）：合成条件永远不成立`, id);
      if (!canMerge && typeof num === 'number' && num > 1 && num < 100)
        warn(`upgradeNum=${num} 但 mergeable=false：客户端不会提示合成、服务端也不会合成`, id);
      if (r.upgradeChessId && !I[r.upgradeChessId]) bad(`upgradeChessId 指向不存在的记录：${r.upgradeChessId}`, id);
      if (r.goldenId && !I[r.goldenId]) bad(`goldenId 指向不存在的记录：${r.goldenId}`, id);
      if (r.giveBondId && B && !B[r.giveBondId]) bad(`giveBondId 指向不存在的盟约：${r.giveBondId}`, id);
      if (r.requiresBondId && B && !B[r.requiresBondId]) bad(`requiresBondId 指向不存在的盟约：${r.requiresBondId}`, id);
      if (r.effectId && E && !E[r.effectId]) warn(`effectId 指向不存在的效果记录：${r.effectId}`, id);
      if (r.effectId && E && E[r.effectId]) {
        const eff = E[r.effectId];
        if (JSON.stringify(eff.buffs) !== JSON.stringify(r.buffs))
          warn('这条道具的 buffs 与它对应的效果记录不一致（运行时道具读自己这份，镜像只是对照）', id);
      }
      checkBuff(r, id, '道具', { touched: touched('items', id) });
      // _a/_b 成对：官方模式是「精一可合成、精二不可合成」（50 对全是这样），只拦反常的那种
      const m = /^(.*)_a$/.exec(id);
      if (m && I[m[1] + '_b'] && I[m[1] + '_b'].mergeable === true)
        warn('精锐版 mergeable=true：官方 50 对里没有任何精锐可合成（精锐是合成结果，不是材料）', id);
      const g2 = /^(.*)_b$/.exec(id);
      if (g2 && !I[g2[1] + '_a']) warn('精锐版没有对应的普通版', id);
    }
    // 商店里同名的两版价格通常一高一低，价格相同多半是漏改
    const byName = new Map();
    for (const [id, r] of Object.entries(I)) {
      const k = String(r.name || id);
      if (!byName.has(k)) byName.set(k, []);
      byName.get(k).push([id, r]);
    }
    for (const [name, list] of byName) {
      // 只在动过这两版里任意一版时才提醒（官方数据里另有一对本来就是同价，不必天天报）
      if (list.length === 2 && list[0][1].price === list[1][1].price
        && (touched('items', list[0][0]) || touched('items', list[1][0]))) {
        warn(`道具「${name}」的两版价格相同（${list[0][1].price} 金）：官方精锐版通常更贵`, list[0][0]);
      }
    }
    if (itemIds2.length !== 115) warn(`道具数量为 ${itemIds2.length}（原版 115）`, null);
  }

  if (CH && CH.cards) {
    for (const list of ['bounty', 'tactic']) {
      const arr = Array.isArray(CH.cards[list]) ? CH.cards[list] : [];
      const seen = new Map();
      arr.forEach((c, i) => {
        const where = 'cards.' + list + '.' + i;
        if (!c || typeof c !== 'object') { bad('卡片不是对象', where); return; }
        const want = list === 'bounty' ? 'ENEMY_GAIN' : 'BUFF_GAIN';
        if (!c.effectId) bad('缺 effectId：引擎靠它取文案与结算', where);
        else {
          if (seen.has(c.effectId)) warn(`effectId「${c.effectId}」与 #${seen.get(c.effectId)} 重复：两张卡会共用同一条效果`, where);
          else seen.set(c.effectId, i);
          const eff = E && E[c.effectId];
          if (E && !eff) bad(`effectId「${c.effectId}」在 effects.json 里找不到`, where);
          else if (eff && eff.effectType !== want) warn(`effectType 是 ${eff.effectType}，但 ${list} 卡应该用 ${want}`, where);
        }
        if (list === 'bounty') {
          if (c.payout != null && !BOUNTY_PAYOUT_ZH[c.payout]) warn(`未知 payout：${c.payout}`, where);
          if (c.enemyKey && work.enemies && !work.enemies[c.enemyKey]) warn(`enemyKey 指向不存在的敌人：${c.enemyKey}`, where);
          if (typeof c.count === 'number' && c.count < 1) bad(`count 必须 ≥ 1（现在是 ${c.count}）`, where);
          if (typeof c.coin === 'number' && c.coin < 0) bad(`coin 不能为负（现在是 ${c.coin}）`, where);
          // 卡上的是「抽卡池/赏金对象」读的，效果 buff 黑板是「按效果自己推赏金」读的，两边应一致
          const KEY3 = ['add_enemy_kill_gain_coin', 'add_enemy_selfbattle_win_gain_coin', 'next_battle_add_enemy_win_gain_coin'];
          const eff = E && E[c.effectId];
          const buff = (eff && Array.isArray(eff.buffs) ? eff.buffs : []).find((b) => b && KEY3.includes(b.key) && b.bbStr && b.bbStr.enemy_id);
          if (buff) {
            const bb = buff.bb || {};
            if (c.enemyKey && buff.bbStr.enemy_id && c.enemyKey !== buff.bbStr.enemy_id)
              warn(`卡上 enemyKey（${c.enemyKey}）与效果 buff 黑板的 enemy_id（${buff.bbStr.enemy_id}）不一致`, where);
            if (typeof c.count === 'number' && typeof bb.count === 'number' && c.count !== bb.count && touched('choices', where))
              warn(`卡上 count（${c.count}）与效果 buff 黑板的 count（${bb.count}）不一致`, where);
            if (typeof c.coin === 'number' && typeof bb.coin === 'number' && c.coin !== bb.coin)
              warn(`卡上 coin（${c.coin}）与效果 buff 黑板的 coin（${bb.coin}）不一致`, where);
            if (c.payout && c.payout !== (buff.key === 'add_enemy_kill_gain_coin' ? 'kill' : 'perfect'))
              warn(`卡上 payout（${c.payout}）与效果 buff 的键（${buff.key}）推出的条件不一致`, where);
          }
          // adds[] 运行时没人读（已逐处核对）：这件事在卡片页里说明一次就够了，不必按记录刷提醒
        } else {
          if (c.kind != null && !TACTIC_KIND_ZH[c.kind]) warn(`未知战术卡 kind：${c.kind}`, where);
          if (c.stageId && work.stages && !(work.stages[c.stageId] || (work.stages.stages && work.stages.stages[c.stageId]))) warn(`stageId 指向不存在的关卡：${c.stageId}`, where);
        }
      });
    }
  }

  // 特质文本串扰（同一干员的两条特质互相混入）
  if (B && C && G) {
    for (const c of crossTraitConflicts()) {
      warn('特质文本串扰：' + c.gid + ' 的文案里出现了同一干员另一条特质 ' + c.other + ' 的内容（' + c.shared[0] + '）。数值只对得上其中一段，请检查。', c.kind === 'chess' ? c.id : c.gid);
    }
  }

  issues.sort((a, b) => rank(a) - rank(b));
  renderBadges();
}

const issuesOf = (kind, id) => issues.filter((i) => i.where === id);

/* ============================ 自选六星（backups.json） ============================ */

/**
 * 自选干员的合成台面：以 charId 为键，把 backups.json 里两处来源拼在一起。
 *
 *   op —— diy.operators[charId]   名字 / 星级 / 职业 / 势力 / 盟约（自选界面与开局用）
 *   un —— units[charId]           战斗数值（forms 各档位的 stats），引擎与专属 kit 读取
 *
 * 字段路径因此是 <charId>.op.* 与 <charId>.un.*；setField 靠点号路径写回真实对象，
 * 所以这里的合成对象只是「视图」，不占内存、也不进 JSON。
 */
function diyTab() {
  const b = work.backups;
  if (!b) return {};
  const out = {};
  const ops = (b.diy && b.diy.operators) || {};
  const units = b.units || {};
  for (const charId of new Set([...Object.keys(ops), ...Object.keys(units)])) {
    out[charId] = { op: ops[charId], un: units[charId] };
  }
  return out;
}

/** 页签里的记录 id 列表（按星级降序，再按名字）。 */
function diyIds() {
  const t = diyTab();
  return Object.keys(t).sort((a, b) => (t[b].op?.rarity || 0) - (t[a].op?.rarity || 0)
    || String(t[a].op?.name || a).localeCompare(String(t[b].op?.name || b), 'zh'));
}

/**
 * 按构建管线（tools/build-data.mjs:1394-1401）的算法，从势力推算这名干员应该吃哪些盟约。
 *
 *   核心盟约 = bonds 里 isCore 为真、且带非空 powerIdList 的那些（当前 8 条）；
 *   命中     = 某条核心盟约的 powerIdList 与这名干员的 powers 有交集。
 *   一个都不命中时，构建管线会写 fallbackBondId（act.constData.fallbackBondId，实际是 emptyShip）。
 *
 * 注意这只是**构建时的推导**：引擎运行时只读 bonds，不读 powers。
 * 所以直接改 bonds 立刻生效；改 powers 当前无效，但重建数据后 bonds 会按它重算。
 */
const FALLBACK_BOND = 'emptyShip';
function diyDerivedBonds(powers) {
  const list = Array.isArray(powers) ? powers : [];
  const hits = [];
  for (const [bondId, b] of Object.entries(work.bonds || {})) {
    if (!b || !b.isCore) continue;
    const pl = Array.isArray(b.powerIdList) ? b.powerIdList : [];
    if (!pl.length) continue;
    const matched = pl.filter((p) => list.includes(p));
    if (matched.length) hits.push({ bondId, matched, powerIdList: pl });
  }
  return { hits, expected: hits.length ? hits.map((h) => h.bondId) : [FALLBACK_BOND] };
}

/** 一名自选干员属于哪些名单（ownedPool / prototypes[星级]）。 */
function diyMemberships(charId) {
  const d = (work.backups && work.backups.diy) || {};
  const out = [];
  if ((d.ownedPool || []).includes(charId)) out.push({ list: 'ownedPool', label: '可选名单' });
  for (const [tier, arr] of Object.entries(d.prototypes || {})) {
    if (Array.isArray(arr) && arr.includes(charId)) out.push({ list: 'prototypes.' + tier, label: '原型 ' + tier + ' 星槽' });
  }
  return out;
}

/**
 * 自选页签的专用写入：路径形如 <charId>.op.bonds / <charId>.un.forms.<档位>.stats.maxHp /
 * diy.ownedPool / diy.locked.<星级>。
 *
 * 不能用 setField('backups', charId, path)：那个按 work.backups[charId] 取根，
 * 而 backups 的根级键是 units / tokens / diy，合成记录不在里面。这里按真实位置解析：
 *   · 首段是 diy        → 走 work.backups.diy
 *   · 首段是 charId，次段 op/un → 走 diy.operators[charId] / units[charId]
 */
function diySet(charId, path, value, { logIt = true } = {}) {
  const segs = splitPath(path);
  let root = null;
  let rest = null;
  // UI 路径 → 真实路径（op/un 只是界面上的分组，数据里没有这一层）
  let real = path;
  if (segs[0] === 'diy') {
    const d = work.backups && work.backups.diy;
    // 也接受撤销回传的真实路径：diy.operators.<charId>.…
    // 只有「还能再往下走」时才把这几段当容器：diy.prototypes.6 本身就是那个数组，
    // 直接当值处理（rest 落到它身上），不能再切一层。
    if (segs[1] === 'operators' && segs[3]) { root = d && d.operators && d.operators[segs[2]]; rest = segs.slice(3); }
    else if (segs[1] === 'prototypes' && segs[3]) { root = d && d.prototypes && d.prototypes[segs[2]]; rest = segs.slice(3); }
    else if (segs[1] === 'locked' && segs[3] && segs[4]) { root = d && d.locked && d.locked[segs[2]] && d.locked[segs[2]][segs[3]]; rest = segs.slice(4); }
    else { root = d; rest = segs.slice(1); }
    real = segs.join('.');
  } else if (segs[0] === 'units' && segs[1]) {
    // 真实路径 units.<charId>.…
    const d = work.backups || {};
    root = d.units && d.units[segs[1]];
    rest = segs.slice(2);
    real = segs.join('.');
  } else if (segs[0] === charId && (segs[1] === 'op' || segs[1] === 'un')) {
    const d = work.backups || {};
    root = segs[1] === 'op' ? (d.diy && d.diy.operators && d.diy.operators[charId]) : (d.units && d.units[charId]);
    rest = segs.slice(2);
    real = (segs[1] === 'op' ? 'diy.operators.' + charId : 'units.' + charId) + (rest.length ? '.' + rest.join('.') : '');
  }
  if (!root || !rest || !rest.length) { toast('无法定位字段：' + path, 4200); return; }
  let o = root;
  for (let i = 0; i < rest.length - 1; i++) {
    if (o[rest[i]] == null || typeof o[rest[i]] !== 'object') o[rest[i]] = {};
    o = o[rest[i]];
  }
  const last = rest[rest.length - 1];
  const from = o[last];
  if (logIt && JSON.stringify(from) === JSON.stringify(value)) return;
  o[last] = value;
  if (logIt) {
    // 日志里记**真实路径**（diy.operators.char_x.bonds / units.char_x.forms...），
    // 补丁重放时就能从文档根一路走下来（见 buildPatchScript 的 apply）。
    const prev = log.find((e) => e.file === 'backups' && e.id === charId && e.field === real);
    if (prev) prev.to = clone(value);
    else log.push({ file: 'backups', id: charId, field: real, from: clone(from), to: clone(value) });
  }
  renderBadges();
}

/**
 * 删除一条真实路径上的字段（目前只用于解除 diy.locked.<星级>.<干员> 的锁定）。
 * 删除也记进变更日志，这样撤销与补丁都能还原。
 */
function deletePath(path) {
  const segs = splitPath(path);
  let o = work.backups;
  for (let i = 0; i < segs.length - 1; i++) {
    if (o == null || typeof o[segs[i]] !== 'object') return false;
    o = o[segs[i]];
  }
  const last = segs[segs.length - 1];
  if (o == null || !(last in o)) return false;
  const from = clone(o[last]);
  delete o[last];
  log.push({ file: 'backups', id: segs[segs.length - 2] || null, field: path, from, to: null });
  renderBadges();
  return true;
}

function renderDiy(main) {
  const t = diyTab();
  const sig = 'backups|' + Object.keys(t).length;
  const shell = main.querySelector('.list');
  if (!(shell && main.dataset.sig === sig)) {
    main.dataset.sig = sig;
    main.innerHTML = [
      '<div class="list">',
        '<div class="tools">',
          '<input type="search" id="q" placeholder="搜索名字 / id / 职业 / 势力 / 盟约" value="' + esc(state.q) + '">',
          '<span id="qCount" class="hint" style="margin:0;white-space:nowrap"></span>',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="detail"></div>',
    ].join('');
    const qi = $('#q');
    qi.addEventListener('input', () => { state.q = qi.value; paintDiyRows(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintDiyRows(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintDiyRows(); } });
    qi.focus();
    try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  }
  paintDiyRows();
}

/** 自选页签的搜索命中（名字 / id / 职业 / 势力 / 盟约）。 */
function diyMatch(id, r, q) {
  if (!q) return true;
  return [id, r.op && r.op.name, r.un && r.un.name, r.op && r.op.profession, r.op && r.op.subProfessionId,
    ...((r.op && r.op.powers) || []), ...((r.op && r.op.bonds) || [])].join(' ').toLowerCase().includes(q);
}

function paintDiyRows() {
  const t = diyTab();
  const q = state.q.trim().toLowerCase();
  const ids = diyIds().filter((id) => diyMatch(id, t[id], q));
  if (!ids.includes(selected.backups)) selected.backups = ids[0] || null;

  const rows = $('#rows');
  if (rows) {
    const cur = selected.backups;
    const keepScroll = rows.scrollTop || 0;
    rows.innerHTML = ids.length ? ids.map((id) => {
      const r = t[id];
      const mem = diyMemberships(id);
      const iss = issuesOf('backups', id);
      const name = (r.op && r.op.name) || (r.un && r.un.name) || id;
      const sub = [(r.op && r.op.rarity) ? r.op.rarity + '★' : ((r.un && r.un.rarity) ? r.un.rarity + '★' : ''),
        (r.un && r.un.subProfessionName) || (r.op && r.op.profession) || '',
        ((r.op && r.op.bonds) || []).length ? '盟约 ' + r.op.bonds.length : '无盟约',
        mem.map((m) => m.label).join('/')].filter(Boolean).join(' · ');
      return '<div class="row ' + (id === cur ? 'on' : '') + '" data-id="' + esc(id) + '">'
        + (touched('backups', id) ? '<span class="dot" title="已修改"></span>' : '')
        + '<span class="t">' + esc(name) + (iss.length ? ' <span class="lvl-' + iss[0].lvl + '">●</span>' : '')
        + (r.un ? '' : ' <span class="chip" style="font-size:10px">无战斗数据</span>') + '</span>'
        + '<span class="sub">' + esc(sub) + '<br>' + esc(id) + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">没有匹配的自选干员</div>';
    if (keepScroll) rows.scrollTop = keepScroll;
    for (const el of rows.querySelectorAll ? (rows.querySelectorAll('.row') || []) : []) {
      el.addEventListener('click', () => { selected.backups = el.dataset.id; paintDiyRows(); });
    }
  }
  const qcEl = $('#qCount');
  if (qcEl) qcEl.textContent = q ? '找到 ' + ids.length + ' 名' : '';

  const detail = $('#detail');
  if (!detail) return;
  const cur = selected.backups;
  if (!cur || !t[cur]) { detail.innerHTML = '<div class="empty">从左侧选一名自选干员</div>'; return; }
  const sameRecord = detail.dataset.rec === cur;
  const keepDetail = sameRecord ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = cur;
  detail.innerHTML = diyForm(cur);
  wireForm('backups', cur);
  detail.scrollTop = keepDetail;
}

/** 一名自选干员的详情：面板字段 + 势力/盟约 + 名单与锁定 + 战斗数值。 */
/** 势力 → 盟约的推导对照：让「powers 不生效、bonds 才生效」这件事在页面上看得见。 */
function diyDeriveBlock(powers, bonds) {
  const { hits, expected } = diyDerivedBonds(powers);
  const cur = Array.isArray(bonds) ? bonds : [];
  const same = cur.length === expected.length && expected.every((b) => cur.includes(b));
  const coreRows = Object.entries(work.bonds || {})
    .filter(([, b]) => b && b.isCore && (b.powerIdList || []).length)
    .map(([bondId, b]) => {
      const matched = (b.powerIdList || []).filter((p) => (powers || []).includes(p));
      return '<tr><td class="k">' + esc(bondId) + '</td><td class="k">' + esc((b.powerIdList || []).join(' / '))
        + '</td><td>' + (matched.length ? '<span class="chip ok">命中 ' + esc(matched.join('、')) + '</span>' : '<span class="hint">不匹配</span>') + '</td></tr>';
    }).join('');
  return '<div style="grid-column:1/-1;margin-top:8px">'
    + '<span style="color:var(--dim);font:11px var(--mono)">按势力推算的盟约（构建管线 build-data.mjs 的算法，仅供参考）</span>'
    + '<div class="grid" style="margin-top:6px">'
    + '<table><thead><tr><th>核心盟约</th><th>它认的势力 powerIdList</th><th>这名干员</th></tr></thead><tbody>'
    + (coreRows || '<tr><td colspan="3" class="hint">bonds.json 里没有带 powerIdList 的核心盟约</td></tr>')
    + '</tbody></table></div>'
    + '<p class="hint">推算结果：<b>' + esc(expected.join('、')) + '</b>'
    + (hits.length ? '' : '（没有任何核心盟约命中，构建管线会用兜底盟约 ' + esc(FALLBACK_BOND) + '）')
    + '　｜　当前 bonds：<b>' + esc(cur.join('、') || '（空）') + '</b> '
    + (same ? '<span class="chip ok">与推算一致</span>' : '<span class="chip warn">与推算不同 —— 这是手改的结果，重建数据会被覆盖</span>')
    + '</p></div>';
}

/* ============================ 导出 / 导入（跨编辑器搬运改动） ============================ */
/*
 *  导出的文件是「差异包」：每条记录带上完整内容，既能合并也能回看。
 *  导入时**不覆盖原有记录**：撞 id 会改名（加 _import 后缀），并把文件内部的引用
 *  （成员 / owners / bonds / bbStr.bond…）一起改成新 id，避免静默换掉你已有的数据。
 */
const SHARE_FORMAT = 'stronghold-data-patch';
const SHARE_VERSION = 1;

/** 这一轮改过的记录（同一条只出现一次）。 */
function shareEntries() {
  const seen = new Set();
  const out = [];
  for (const e of log) {
    if (!e.id || !e.field) continue;
    const key = e.file + ':' + e.id;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({ file: e.file, id: e.id });
  }
  return out;
}

/** 打包：自选干员拆成 diy.operators / units 两处的真实位置。 */
function buildSharePack(note = '') {
  const records = [];
  const push = (file, id, rec) => records.push({ file, id, record: JSON.parse(JSON.stringify(rec)) });
  for (const e of shareEntries()) {
    if (e.file === 'backups') {
      const ops = work.backups && work.backups.diy && work.backups.diy.operators;
      if (ops && ops[e.id]) push('backups', 'diy.operators.' + e.id, ops[e.id]);
      const un = work.backups && work.backups.units && work.backups.units[e.id];
      if (un) push('backups', 'units.' + e.id, un);
      continue;
    }
    // recordOf 统一处理扁平表与根级布局（choices 的 id 是 cards.bounty.3 这类点号路径）
    const rec = recordOf(e.file, e.id);
    if (rec) push(e.file, e.id, rec);
  }
  return {
    format: SHARE_FORMAT,
    version: SHARE_VERSION,
    exportedAt: new Date().toISOString().slice(0, 19),
    note,
    counts: records.reduce((m, r) => { m[r.file] = (m[r.file] || 0) + 1; return m; }, {}),
    records,
  };
}

/** 下载成文件。 */
function downloadJson(name, obj) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/**
 * 导入差异包。撞 id 一律改名，并把包内引用一起改名（不动本地同名记录）。
 * @returns {{ok:true,added:number,renamed:number}|{ok:false,reason:string}}
 */
function importSharePack(pack, { rename = true } = {}) {
  if (!pack || pack.format !== SHARE_FORMAT) return { ok: false, reason: '不是本编辑器导出的文件（缺少 format 标记）' };
  if (!Array.isArray(pack.records) || !pack.records.length) return { ok: false, reason: '文件里没有记录' };
  const renamed = new Map();
  const put = [];
  const skipped = [];
  const taken = (file, id) => {
    if (file === 'backups') {
      const seg = String(id).split('.');
      const t = seg[0] === 'diy'
        ? (work.backups && work.backups.diy && work.backups.diy.operators)
        : (work.backups && work.backups.units);
      return !!(t && t[seg[1]]);
    }
    return !!recordOf(file, id);
  };
  for (const r of pack.records) {
    if (!r || !r.file || !r.id || !r.record) continue;
    let id = r.id;
    // 卡牌是数组元素：没有「改名」这回事，导入一律追加到同类卡表的末尾，绝不覆盖已有序位
    if (rename && r.file !== 'choices' && taken(r.file, id)) {
      let n = 1, cand = id + '_import';
      while (taken(r.file, cand)) { n++; cand = id + '_import' + n; }
      renamed.set(id, cand);
      id = cand;
    }
    put.push({ ...r, newId: id });
  }
  const fix = (v) => (typeof v === 'string' && renamed.has(v) ? renamed.get(v) : v);
  const fixList = (arr) => (Array.isArray(arr) ? arr.map(fix) : arr);
  for (const r of put) {
    const rec = r.record;
    for (const k of ['members', 'visibleMembers', 'owners', 'bonds', 'garrisonIds', 'powerIdList']) {
      if (Array.isArray(rec[k])) rec[k] = fixList(rec[k]);
    }
    if (rec.bbStr && typeof rec.bbStr.bond === 'string') {
      rec.bbStr = { ...rec.bbStr, bond: rec.bbStr.bond.split(',').map((x) => fix(x.trim())).join(',') };
    }
    for (const k of ['bondId', 'garrisonId', 'name']) if (typeof rec[k] === 'string') rec[k] = fix(rec[k]);
    // 效果记录自带 effectId 键名（= effects.json 的键），改名后要跟上一处改，否则记录自相矛盾
    if (r.file === 'effects' && typeof rec.effectId === 'string') rec.effectId = fix(rec.effectId);
    if (r.file === 'choices' && typeof rec.effectId === 'string') rec.effectId = fix(rec.effectId);
    if (r.file === 'backups') {
      const seg = String(r.newId).split('.');
      if (!work.backups) work.backups = {};
      if (seg[0] === 'diy') {
        work.backups.diy = work.backups.diy || { operators: {} };
        work.backups.diy.operators = work.backups.diy.operators || {};
        work.backups.diy.operators[seg[1]] = rec;
      } else if (seg[0] === 'units') {
        work.backups.units = work.backups.units || {};
        work.backups.units[seg[1]] = rec;
      }
      log.push({ file: 'backups', id: seg[1], field: '(整条新增·导入)', from: null, to: { imported: r.id } });
      continue;
    }
    /*
     * 卡牌（choices.cards.bounty / cards.tactic）是数组元素：导出时 id 记成 cards.bounty.3 这样的点号路径，
     * 导入时**不按路径覆盖**（那是别人机器上的序位），而是一律追加到同类卡表末尾，并记下新的真实序位。
     */
    if (r.file === 'choices') {
      const seg = splitPath(r.newId);
      const arr = seg.length > 1 ? getPath(work.choices, seg.slice(0, -1).join('.')) : null;
      if (!Array.isArray(arr)) { skipped.push(r.newId + '（choices.json 里没有这张卡表）'); continue; }
      arr.push(rec);
      const newPath = seg.slice(0, -1).join('.') + '.' + (arr.length - 1);
      log.push({ file: 'choices', id: newPath, field: '(整条新增·导入)', from: null, to: { imported: r.id } });
      continue;
    }
    work[r.file] = work[r.file] || {};
    const existed = work[r.file][r.newId] !== undefined;
    work[r.file][r.newId] = rec;
    log.push({ file: r.file, id: r.newId, field: existed ? '(整条替换·导入)' : '(整条新增·导入)', from: null, to: { imported: r.id } });
  }
  clearIndexCache();
  validate(); render();
  return { ok: true, added: put.length - skipped.length, renamed: renamed.size, skipped };
}

/** 导出 / 导入的对话框。 */
function showShareDialog() {
  const entries = shareEntries();
  const pack = buildSharePack();
  const counts = Object.entries(pack.counts).map(([f, n]) => '<code>' + esc(f) + '</code> ×' + n).join('　') || '（还没有改动）';
  const list = entries.length
    ? '<ul class="issues">' + entries.map((e) => '<li><span class="k">' + esc(e.file) + '</span> ' + esc(e.id) + '</li>').join('') + '</ul>'
    : '<p class="hint">这一轮还没改任何记录。先去干员页 / 特性修改 / 盟约修改里做点改动，再回来导出。</p>';
  $('#dlgTitle').textContent = '导出 / 导入';
  $('#dlgBody').innerHTML = ''
    + '<fieldset><legend>导出这一轮的改动（' + entries.length + ' 条记录）</legend>'
    + '<p class="hint">' + counts + '</p>' + list
    + '<div class="addbox"><button class="primary" id="shareExport">下载为 json</button>'
    + '<span class="hint" style="margin:0">文件名带时间戳，可以放进任何备份目录，或用另一个编辑器打开</span></div>'
    + '</fieldset>'
    + '<fieldset><legend>导入别人给的 / 之前的备份</legend>'
    + '<p class="hint">导入<b>不会覆盖</b>本地同名记录：撞 id 会自动改名（加 <code>_import</code> 后缀），'
    + '并把文件内部的引用（成员、owners、bonds、bbStr.bond…）一起改成新 id，避免误改到你已有的数据。</p>'
    + '<div class="addbox"><input type="file" id="shareImport" accept=".json,application/json"></div>'
    + '</fieldset>';
  const dlg = $('#dlg');
  const ex = $('#shareExport');
  if (ex) ex.onclick = () => {
    if (!entries.length) { toast('还没有改动，没什么可导出的。', 3200); return; }
    downloadJson('stronghold-patch-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.json', pack);
    toast('已下载（' + entries.length + ' 条记录）', 3600);
  };
  const im = $('#shareImport');
  if (im) im.onchange = () => {
    const f = im.files && im.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let p;
      try { p = JSON.parse(rd.result); } catch (e) { toast('文件不是合法 json：' + e.message, 5200); return; }
      const r = importSharePack(p);
      if (!r.ok) { toast('导入失败：' + r.reason, 6000); return; }
      dlg.close();
    toast('已导入 ' + r.added + ' 条记录'
      + (r.renamed ? '（其中 ' + r.renamed + ' 条因 id 冲突改名）' : '')
      + (r.skipped && r.skipped.length ? '；' + r.skipped.length + ' 条跳过：' + r.skipped.slice(0, 2).join('、') : '')
      + '，记得保存', 7200);
    };
    rd.readAsText(f);
  };
  dlg.showModal();
}

/* ============================ 干员页（一名干员一页） ============================ */
/*
 *  页签结构与数据类型解耦：一名干员可能同时牵涉 chess.json 的两条记录（精一/精二）、
 *  bonds.json 的若干条盟约、garrisons.json 的若干条特质、以及（自选六星）backups.json。
 *  这一页把「以他为中心」的东西放在一起，改完不用跳页。
 *
 *  共用记录（一条盟约/特质被多人引用）允许直接改，但必须标出会影响谁——
 *  这是刻意的取舍：一页到底比「强制跳页」好用，把代价讲清楚就行。
 */

/** 干员清单的一行。 */
function opIndex() {
  const out = [];
  for (const [id, rec] of Object.entries(work.chess || {})) {
    if (!/^chess_char_/.test(id)) continue;
    // 自选槽占位记录（名字「甄选干员」，没有盟约也没有特质）没有可编辑的内容，
    // 自选干员的真实数据在 backups.json 里、走 diy: 那批，不在这里重复出现。
    if (/^chess_char_\d+_diy\d+_[ab]$/.test(id)) continue;
    out.push({ key: 'chess:' + id, kind: 'chess', id, rec, name: rec.name || id, tier: rec.tier || 0 });
  }
  for (const [charId, r] of Object.entries(diyTab())) {
    out.push({ key: 'diy:' + charId, kind: 'diy', id: charId, rec: r,
      name: (r.op && r.op.name) || (r.un && r.un.name) || charId,
      tier: (r.op && r.op.rarity) || (r.un && r.un.rarity) || 0 });
  }
  return out;
}

/** 这位干员的精一/精二两条棋子记录（自选干员没有 chess 记录）。 */
function opPair(entry) {
  if (!entry || entry.kind !== 'chess') return [];
  const a = entry.id.replace(/_b$/, '_a');
  return [...new Set([a, a.replace(/_a$/, '_b'), entry.id])]
    .map((cid) => ({ id: cid, rec: work.chess[cid] })).filter((x) => x.rec);
}

/** 这位干员（含配对版本）涉及的盟约 id。 */
function opBondIds(entry) {
  const ids = [];
  if (entry.kind === 'diy') {
    for (const b of (entry.rec.op && entry.rec.op.bonds) || []) if (!ids.includes(b)) ids.push(b);
    return ids;
  }
  for (const { rec } of opPair(entry)) for (const b of rec.bonds || []) if (!ids.includes(b)) ids.push(b);
  return ids;
}

/** 这位干员（含配对版本）携带的特质 id。 */
function opGarrisonIds(entry) {
  const ids = [];
  if (entry.kind !== 'chess') return ids;
  for (const { rec } of opPair(entry)) for (const g of rec.garrisonIds || []) if (!ids.includes(g)) ids.push(g);
  return ids;
}

/** 某条盟约还被谁引用（用来标示「改这里会影响谁」）。 */
function bondOwners(bondId) {
  const out = [];
  for (const [cid, rec] of Object.entries(work.chess || {})) {
    if ((rec.bonds || []).includes(bondId)) out.push({ where: cid, name: rec.name || cid });
  }
  const ops = (work.backups && work.backups.diy && work.backups.diy.operators) || {};
  for (const [charId, o] of Object.entries(ops)) {
    if ((o.bonds || []).includes(bondId)) out.push({ where: charId, name: o.name || charId });
  }
  return out;
}

/** 某条特质被哪些棋子记录引用。 */
function garrisonUsers(gid) {
  return Object.entries(work.chess || {})
    .filter(([, c]) => (c.garrisonIds || []).includes(gid))
    .map(([k, c]) => ({ where: k, name: c.name || k }));
}

/** 「改这里会影响其他人」的警示条。 */
function sharedBar(others, what) {
  if (!others.length) return '';
  const names = others.slice(0, 4).map((o) => o.name).join('、');
  return '<div class="addbox" style="margin:4px 0 8px;border-left:3px solid #b8860b;padding-left:8px">'
    + '<span class="hint" style="margin:0"><b>共用</b>：' + esc(what) + '还被其他 ' + others.length + ' 名干员引用（'
    + esc(names) + (others.length > 4 ? '…' : '') + '）。改数值或文案会一起变。</span></div>';
}

/** 盟约区块：数值 + 门槛 + 文案 + 成员，一处改完。 */
function opBondBlock(entry, bondId) {
  const b = work.bonds && work.bonds[bondId];
  const head = '<legend>盟约 · <code>' + esc(bondId) + '</code>'
    + (b && b.isCore ? ' <span class="chip ok">核心</span>' : ' <span class="chip">附加</span>')
    + (Array.isArray(b && b.thresholds) && b.thresholds.length
      ? ' <span class="hint" style="margin:0">门槛 ' + esc(b.thresholds.join(' / ')) + '</span>' : '')
    + '</legend>';
  if (!b) return '<fieldset>' + head + '<p class="hint" style="color:#f85149">bonds.json 里没有这条盟约，游戏里会认不出来。</p></fieldset>';
  const others = bondOwners(bondId).filter((o) => o.where !== entry.id);
  const bbKeys = Object.keys(b.bb || {});
  const members = b.members || [];
  return '<fieldset>' + head
    + sharedBar(others, '这条盟约')
    + '<div class="grid">'
    + numField('bonds', bondId, 'weight', 'weight（本局禁用抽取权重）', b)
    + arrayField('bonds', bondId, 'thresholds', '激活门槛 thresholds', b)
    + textField('bonds', bondId, 'countMode', '数人头方式 countMode', b)
    + '</div>'
    + (bbKeys.length ? '<div class="grid">' + bbKeys.map((k) => numField('bonds', bondId, 'bb.' + k, k, b)).join('') + '</div>' : '')
    + '<div class="grid">'
    + textField('bonds', bondId, 'desc', 'desc（纯文本；自动同步 descRaw）', b, { area: true, full: true, rows: 2 })
    + '</div>'
    + '<p class="hint">当前成员 ' + members.length + ' 名。thresholds 与 bb 里的门槛键要保持同步，否则面板与实效不符。</p>'
    + '<details><summary class="hint">成员名单（' + members.length + ' 名）</summary>'
    + idList('bonds', bondId, 'members', 'members', b, 'chess', '这两个数组是「干员侧反查」的结果。要真正改成员，去那名干员的页里改它的 bonds；重跑 build-data 也会覆盖这里。')
    + '</details>'
    + '</fieldset>';
}

/** 特质区块：数值 + 文案 + 专属复制。 */
function opGarrisonBlock(entry, gid) {
  const g = work.garrisons && work.garrisons[gid];
  if (!g) return '<fieldset><legend>特质 · <code>' + esc(gid) + '</code></legend><p class="hint" style="color:#f85149">garrisons.json 里没有这条特质。</p></fieldset>';
  const users = garrisonUsers(gid);
  const owners = Array.isArray(g.owners) ? g.owners : [];
  const mine = owners.length <= 1 && owners.includes(entry.id);
  const others = users.filter((u) => u.where !== entry.id && u.where !== entry.id.replace(/_b$/, '_a'));
  const bbKeys = Object.keys(g.bb || {});
  const known = Object.prototype.hasOwnProperty.call(EFFECT_KEYS, g.effectKey || '');
  return '<fieldset><legend>特质 · <code>' + esc(gid) + '</code>'
    + (mine ? ' <span class="chip ok">该干员专属</span>' : ' <span class="chip warn">共用</span>')
    + (!known ? ' <span class="chip bad">效果未实现</span>' : ' <span class="chip">' + esc(effectKeyLabel(g.effectKey)) + '</span>') + '</legend>'
    + sharedBar(others, '这条特质')
    + (bbKeys.length ? '<div class="grid">' + bbKeys.map((k) => numField('garrisons', gid, 'bb.' + k, 'bb.' + k, g)).join('') + '</div>' : '<p class="hint">这条特质没有 bb 数值。</p>')
    + (mine
      ? '<div class="grid">'
        + textField('garrisons', gid, 'desc', 'desc（纯文本；自动同步 descRaw）', g, { area: true, full: true, rows: 2 })
        + '</div>'
        + '<div class="addbox"><button class="tiny" data-numg="' + esc(gid) + '">按 bb 数值重写文本</button></div>'
      : '<p class="hint">文字是共用的，不能直接改（数值可以）。要单独改文字，先复制一份专属副本。</p>'
        + '<div class="addbox"><button class="tiny" data-copyg="' + esc(gid) + '">复制一份专属文本再改</button></div>')
    + '<p class="hint">效果：<b>' + esc(effectKeyLabel(g.effectKey)) + '</b>　<code>' + esc(g.effectKey || '') + '</code>'
    + (known ? '' : ' —— 引擎没实现这个键，特质不会生效')
    + '</p>'
    + (g.descRaw || g.desc ? '<p class="hint">当前文案：' + esc(String(g.descRaw || g.desc).slice(0, 120)) + '</p>' : '')
    + '</fieldset>';
}

/** 一条棋子记录（精一或精二）：盟约、特质、数值，纵向排；两条记录左右并排对照。 */
function opChessColumn(entry, cid, rec) {
  const statKeys = Object.keys(rec.stats || {});
  const isB = /_b$/.test(cid);
  const gids = rec.garrisonIds || [];
  return '<div style="min-width:0">'
    + '<h3 style="margin:0 0 4px">' + (isB ? '精锐（精二）' : '普通（精一）')
    + ' <span class="hint" style="font-weight:400">' + esc(cid.replace(/^chess_char_/, '')) + '</span></h3>'
    + '<div class="grid">'
    + textField('chess', cid, 'name', '名字', rec)
    + numField('chess', cid, 'tier', 'tier（阶 / 刷新概率）', rec)
    + numField('chess', cid, 'price', 'price（购买价）', rec)
    + '</div>'
    + '<fieldset><legend>盟约（' + (rec.bonds || []).length + '）</legend>'
    + idList('chess', cid, 'bonds', 'bonds', rec, 'bonds', '这条记录算哪些盟约的成员。加入/移除立刻影响盟约人数与激活门槛。')
    + '</fieldset>'
    + '<fieldset><legend>特质（' + gids.length + '）</legend>'
    + idList('chess', cid, 'garrisonIds', 'garrisonIds', rec, 'garrisons', '特质决定效果。精锐通常要单独配一份（_b）。')
    + '</fieldset>'
    + '<fieldset><legend>基础属性（' + statKeys.length + '）</legend>'
    + '<div class="grid">' + statKeys.map((k) => numField('chess', cid, 'stats.' + k, k, rec)).join('') + '</div>'
    + '<p class="hint">maxHp / atk / def 是战斗直接读的数值；bat 攻击间隔（秒），aspd 攻速，cost 再部署费用。</p>'
    + '</fieldset>'
    + '</div>';
}

/** 干员页主体。 */
function opForm(entry) {
  if (!entry) return '<div class="empty">从左侧选一名干员</div>';
  const iss = issuesOf(entry.kind === 'diy' ? 'backups' : 'chess', entry.id);
  const issHtml = iss.length ? `<fieldset><legend>问题</legend><ul class="issues">${iss.map((i) => `<li class="lvl-${i.lvl}"><b>${i.lvl === 'bad' ? '错误' : '提醒'}</b> ${esc(i.m)}</li>`).join('')}</ul></fieldset>` : '';
  const bondIds = opBondIds(entry);
  const gIds = opGarrisonIds(entry);
  const badge = entry.kind === 'diy'
    ? '<span class="chip gold">自选六星</span>'
    : (/_b$/.test(entry.id) ? '<span class="chip gold">精锐（精二）</span>' : '<span class="chip">普通（精一）</span>');

  const head = '<h2>' + esc(entry.name) + ' ' + badge
    + (entry.kind === 'chess' && !/_b$/.test(entry.id) ? '<span class="chip">T' + esc(entry.tier) + '</span>' : '')
    + '</h2>'
    + '<div class="sub"><code class="copyid" data-copy="' + esc(entry.id) + '" title="点一下复制 id">' + esc(entry.id) + '</code>'
    + ' · 盟约 ' + bondIds.length + ' 条 · 特质 ' + gIds.length + ' 条'
    + (entry.kind === 'chess' ? ' · ' + esc(entry.rec.profession || '') + '/' + esc(entry.rec.subProfessionName || '') : '') + '</div>'
    + issHtml;

  const chessCols = entry.kind === 'chess'
    ? '<fieldset><legend>棋子记录（精一 / 精二 并排对照）</legend>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">'
      + opPair(entry).map(({ id, rec }) => opChessColumn(entry, id, rec)).join('')
      + '</div></fieldset>'
    : '';

  const bondsHtml = '<fieldset><legend>盟约（' + bondIds.length + ' 条）</legend>'
    + '<p class="hint" style="margin:0 0 8px">下面是这名干员牵扯到的每一条盟约的完整内容——数值、门槛、文案都能直接改。'
    + '标着「共用」的会影响其他引用它的干员，改前请留意。</p></fieldset>'
    + (bondIds.map((b) => opBondBlock(entry, b)).join('') || '<fieldset><p class="hint">这名干员没有所属盟约。</p></fieldset>');

  const gHtml = '<fieldset><legend>特质（' + gIds.length + ' 条）</legend>'
