/**
 * 效果 / 触发时机的总览表——放在键名词典页顶部，方便一次性对照。
 * 每一行都是数据里真实在用的 key 及用量；搜索框会一起过滤。
 */
/**
 * 三张新表用到的「键」总览：buff 处理器键、战斗符文键、引用型字段。
 *
 * 这些键是道具/卡/效果的「做什么」与「怎么结算」，与特质那套 effectKey/eventType 平行，
 * 但属于不同命名空间（特质走 garrison:<effectKey>，道具/效果走 buffs[].key 与 bbStr.key）。
 */
function newKeysOverviewHtml(gq) {
  const match = (s) => !gq || String(s).toLowerCase().includes(gq);
  // 用量统计：道具 + 效果 两张表（卡的 buff 在效果表里，所以不用重复统计）
  const useKey = new Map(), useRune = new Map();
  const tally = (kind, table) => {
    for (const [id, rec] of Object.entries(table || {})) {
      for (const b of (rec.buffs || [])) {
        if (b.key) {
          if (!useKey.has(b.key)) useKey.set(b.key, []);
          useKey.get(b.key).push(kind + ':' + id);
        }
        if (b.bbStr && b.bbStr.key) {
          if (!useRune.has(b.bbStr.key)) useRune.set(b.bbStr.key, []);
          useRune.get(b.bbStr.key).push(kind + ':' + id);
        }
      }
    }
  };
  tally('items', work.items);
  tally('effects', work.effects);
  const kindZh = { items: '道具', effects: '效果' };
  const links = (list) => {
    const shown = list.slice(0, 4).map((u) => {
      const [k, id] = u.split(':');
      return '<button class="tiny jump" data-jump-kind="' + esc(k) + '" data-jump-id="' + esc(id) + '">' + esc(kindZh[k] || k) + '</button>';
    }).join(' ');
    return shown + (list.length > 4 ? ' <span class="hint">+' + (list.length - 4) + '</span>' : '');
  };
  const keyRows = Object.keys(BUFF_KEY_ZH).sort()
    .filter((k) => match(k + ' ' + BUFF_KEY_ZH[k][0] + ' ' + BUFF_KEY_ZH[k][1]))
    .map((k) => '<tr><td class="k" style="font-size:12px">' + esc(k) + '</td>'
      + '<td>' + esc(BUFF_KEY_ZH[k][0]) + '<div class="hint">阶段：' + esc(BUFF_KEY_ZH[k][1])
      + (BUFF_KEY_ZH[k][2] ? ' · 出处 <code>' + esc(BUFF_KEY_ZH[k][2]) + '</code>' : ' · <b style="color:#f85149">源码里没有处理者</b>') + '</div></td>'
      + '<td>' + ((useKey.get(k) || []).length ? links(useKey.get(k)) : '<span class="hint">未使用</span>') + '</td></tr>').join('');
  const runeRows = Object.keys(RUNE_ZH).sort()
    .filter((k) => match(k + ' ' + RUNE_ZH[k][0]))
    .map((k) => '<tr><td class="k" style="font-size:12px">' + esc(k) + '</td>'
      + '<td>' + esc(RUNE_ZH[k][0]) + (RUNE_ZH[k][1] ? '<div class="hint">出处 <code>' + esc(RUNE_ZH[k][1]) + '</code></div>' : '') + '</td>'
      + '<td>' + ((useRune.get(k) || []).length ? links(useRune.get(k)) : '<span class="hint">未使用</span>') + '</td></tr>').join('');
  const strRows = Object.keys(BBSTR_GLOSS).sort()
    .filter((k) => match(k + ' ' + BBSTR_GLOSS[k][0]))
    .map((k) => '<tr><td class="k" style="font-size:12px">' + esc(k) + '</td><td>' + esc(BBSTR_GLOSS[k][0]) + '</td></tr>').join('');
  const enumRows = Object.entries({ '道具大类 itemType': ITEM_TYPE_ZH, '功能分类 category': ITEM_CATEGORY_ZH, '结算方式 kind': ITEM_KIND_ZH, '系列 family': ITEM_FAMILY_ZH, '计数方式 countType': COUNT_TYPE_ZH, '悬赏结算 payout': BOUNTY_PAYOUT_ZH, '战术卡类别 kind': TACTIC_KIND_ZH, '效果类型 effectType': EFFECT_TYPE_ZH })
    .map(([title, dict]) => {
      const inner = Object.entries(dict).map(([k, v]) => match(k + ' ' + v[0] + ' ' + v[1])
        ? '<tr><td class="k" style="font-size:12px">' + esc(k) + '</td><td><b>' + esc(v[0]) + '</b><br><span class="hint">' + esc(v[1]) + '</span></td></tr>' : '').join('');
      return inner ? '<h3 style="margin-top:14px">' + esc(title) + '</h3><table><thead><tr><th style="width:230px">值</th><th>中文含义</th></tr></thead><tbody>' + inner + '</tbody></table>' : '';
    }).join('');
  return '<fieldset><legend>道具 / 效果用的键（buff 处理器 · 战斗符文 · 枚举）</legend>'
    + '<p class="hint">道具与效果的「做什么」写在 <code>buffs[].key</code>（备战期处理器，源码里没有就是永为不触发），'
    + '「怎么结算」写在 <code>bbStr.key</code>（战斗符文）。这两组都是<b>逐键到源码里核对过</b>的，共 '
    + Object.keys(BUFF_KEY_ZH).length + ' / ' + Object.keys(RUNE_ZH).length + ' 个。'
    + '<span style="color:#f85149">带红字的那几个键源码里没有处理者，改它们不会有效果。</span></p>'
    + '<h3>buff 处理器键（' + Object.keys(BUFF_KEY_ZH).length + ' 个）</h3>'
    + '<table><thead><tr><th style="width:260px">键</th><th>中文含义 / 阶段 / 出处</th><th style="width:150px">用在</th></tr></thead><tbody>'
    + (keyRows || '<tr><td colspan="3" class="hint" style="padding:10px">没有匹配</td></tr>') + '</tbody></table>'
    + '<h3 style="margin-top:14px">战斗符文键 bbStr.key（' + Object.keys(RUNE_ZH).length + ' 个）</h3>'
    + '<table><thead><tr><th style="width:260px">符文键</th><th>战斗内做什么 / 出处</th><th style="width:150px">用在</th></tr></thead><tbody>'
    + (runeRows || '<tr><td colspan="3" class="hint" style="padding:10px">没有匹配</td></tr>') + '</tbody></table>'
    + '<h3 style="margin-top:14px">引用型字段 bbStr（' + Object.keys(BBSTR_GLOSS).length + ' 个）</h3>'
    + '<table><thead><tr><th style="width:260px">字段</th><th>含义</th></tr></thead><tbody>' + strRows + '</tbody></table>'
    + enumRows
    + '</fieldset>';
}

function effectOverviewHtml(gq) {
  const countKey = new Map(), countEv = new Map(), countType = new Map();
  const combos = new Map();
  for (const g of Object.values(work.garrisons || {})) {
    if (g.effectKey) countKey.set(g.effectKey, (countKey.get(g.effectKey) || 0) + 1);
    if (g.eventType) countEv.set(g.eventType, (countEv.get(g.eventType) || 0) + 1);
    if (g.effectType) countType.set(g.effectType, (countType.get(g.effectType) || 0) + 1);
    if (g.effectKey && g.eventType) {
      const k = g.eventType + '|' + g.effectKey;
      combos.set(k, (combos.get(k) || 0) + 1);
    }
  }
  const match = (s) => !gq || s.toLowerCase().includes(gq);
  const evRows = [...countEv].filter(([k]) => match(k + ' ' + ((EVENT_TYPES[k] || [])[0] || '') + ' ' + ((EVENT_TYPES[k] || [])[1] || '')))
    .sort((a, b) => b[1] - a[1])
    .map(([k, n]) => '<tr><td class="k">' + esc(k) + '</td><td><b>' + esc((EVENT_TYPES[k] || [])[0] || '（未翻译）')
      + '</b><br><span class="hint">' + esc((EVENT_TYPES[k] || [])[1] || '') + '</span></td><td class="k">' + n + ' 条</td></tr>').join('');
  const keyRows = [...countKey].filter(([k]) => match(k + ' ' + effectKeyLabel(k) + ' ' + ((EFFECT_KEYS[k] || [])[0] || '')))
    .sort((a, b) => b[1] - a[1])
    .map(([k, n]) => '<tr><td class="k">' + esc(k) + '</td><td>' + esc(effectKeyLabel(k))
      + '</td><td class="k">' + esc((EFFECT_KEYS[k] || [])[0] === 'battle' ? '战斗中' : (EFFECT_KEYS[k] ? '备战期' : '未实现')) + '</td><td class="k">' + n + ' 条</td></tr>').join('');
  const untranslated = [...countKey].filter(([k]) => !EFFECT_KEYS[k]).map(([k]) => k);
  const comboRows = [...combos].filter(([k]) => match(k.split('|').join(' ') + ' ' + effectKeyLabel(k.split('|')[1]) + ' ' + ((EVENT_TYPES[k.split('|')[0]] || [])[0] || '')))
    .sort((a, b) => b[1] - a[1])
    .map(([k, n]) => {
      const [ev, ek] = k.split('|');
      return '<tr><td class="k">' + esc((EVENT_TYPES[ev] || [])[0] || ev) + '</td><td>' + esc(effectKeyLabel(ek))
        + ' <code style="font-size:10px">' + esc(ek) + '</code></td><td class="k">' + n + ' 条</td></tr>';
    }).join('');
  return '<fieldset><legend>效果与触发时机对照（effectKey / eventType / effectType）</legend>'
    + '<p class="hint">这三组值就是特质「做什么、什么时候做」的全部选项。'
    + '数据里在用的 effectKey <b>' + countKey.size + '</b> 种、eventType <b>' + countEv.size + '</b> 种、'
    + '搭配组合 <b>' + combos.size + '</b> 种。'
    + (untranslated.length ? '<span style="color:#f85149">未翻译：' + esc(untranslated.join('、')) + '</span>' : '<b>全部已翻译</b>')
    + '</p>'
    + '<h3>触发时机 eventType（' + countEv.size + ' 种）</h3>'
    + '<table><thead><tr><th style="width:230px">值</th><th>中文含义</th><th style="width:70px">用量</th></tr></thead><tbody>' + (evRows || '<tr><td colspan="3" class="hint">没有匹配</td></tr>') + '</tbody></table>'
    + '<h3 style="margin-top:14px">效果实现 effectKey（' + countKey.size + ' 种）</h3>'
    + '<table><thead><tr><th style="width:230px">值</th><th>中文含义</th><th style="width:70px">阶段</th><th style="width:70px">用量</th></tr></thead><tbody>' + (keyRows || '<tr><td colspan="4" class="hint">没有匹配</td></tr>') + '</tbody></table>'
    + '<details style="margin-top:12px"><summary class="hint" style="cursor:pointer">查看全部 ' + combos.size + ' 种「触发时机 × 实现」搭配</summary>'
    + '<table><thead><tr><th>触发时机</th><th>实现</th><th style="width:70px">用量</th></tr></thead><tbody>' + comboRows + '</tbody></table></details>'
    + '</fieldset>';
}

function renderGlossary(main) {
  const sig = 'glossary|' + (work.bonds ? Object.keys(work.bonds).length : 0) + '|' + (work.chess ? Object.keys(work.chess).length : 0);
  /*
   * 守卫必须同时检查「外壳还在不在」：改动 / 校验 / 词典 / 使用说明 这几个页签的渲染是整页覆盖，
   * 不写 dataset。只用签名判断的话，「词典 → 校验 → 词典」会以为外壳没变、跳过重建，
   * 结果 #gRows 已经不存在、表体填不进去，页面停在上一页的内容上（点回词典却还是校验页）。
   */
  if (main.dataset.gsig !== sig || !main.querySelector('#gRows')) {
    main.dataset.gsig = sig;
    main.innerHTML = [
      '<div class="detail">',
        '<h2>键名词典 <span class="chip">' + Object.keys(BB_GLOSS).length + ' 个 bb 键</span>'
        + ' <span class="chip">' + Object.keys(EFFECT_KEYS).length + ' 个 effectKey</span>'
        + ' <span class="chip">' + Object.keys(EVENT_TYPES).length + ' 个 eventType</span></h2>',
        '<div class="sub">上半部分是「效果 / 触发时机」的全部选项（含中文），下半部分是 bb 键（数值参数）的含义与出现在哪些记录里。'
        + '<br>道具 / 悬赏 / 战术 / 效果那三张表的键（buff 处理器、战斗符文、枚举）也在这一页，用同一个搜索框。</div>',
        '<div class="addbox" style="margin-bottom:10px">',
          '<input id="gq" placeholder="搜索键名或中文含义，如 base_time / 持续时间" style="max-width:380px">',
          '<span id="gCount" class="hint" style="margin:0"></span>',
          '<span class="hint">点右侧标签可直接跳到那条记录</span>',
        '</div>',
        '<div id="fxRows"></div>',
        '<div id="newKeys" style="margin-top:18px"></div>',
        '<h3 style="margin-top:18px">bb 键（数值参数）</h3>',
        '<table><thead><tr><th style="width:240px">bb 键</th><th style="width:330px">中文含义</th><th>出现于</th></tr></thead><tbody id="gRows"></tbody></table>',
      '</div>',
    ].join('');
    const gi = $('#gq');
    gi.value = state.gq || '';
    // 输入法安全：只重绘表体，输入框保持存活
    gi.addEventListener('input', () => { state.gq = gi.value; paintGlossary(); });
    gi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { gi.value = ''; state.gq = ''; paintGlossary(); } });
    gi.focus();
    try { gi.setSelectionRange(gi.value.length, gi.value.length); } catch (err) {}
  }
  paintGlossary();
}

/** 只重绘词典表体。 */
function paintGlossary() {
  const gq = (state.gq || '').trim().toLowerCase();
  const usage = new Map();
  for (const kind of ['bonds', 'chess', 'garrisons', 'items', 'effects']) {
    for (const [id, rec] of Object.entries(work[kind] || {})) {
      // 盟约/干员/特质的数值在 rec.bb；道具与效果的在 rec.buffs[].bb —— 两条路都要扫，否则词典里看不到用量
      const bbKeys = [...Object.keys(rec.bb || {}), ...(rec.buffs || []).flatMap((b) => Object.keys((b && b.bb) || {}))];
      for (const k of bbKeys) {
        const sub = k.includes('.') ? k.slice(k.lastIndexOf('.') + 1) : k;
        for (const kk of new Set([k, sub])) {
          if (!usage.has(kk)) usage.set(kk, []);
          const list = usage.get(kk);
          if (!list.includes(kind + ':' + id)) list.push(kind + ':' + id);
        }
      }
    }
  }
  let keys = Object.keys(BB_GLOSS).sort();
  if (gq) keys = keys.filter((k) => (k + ' ' + BB_GLOSS[k][0]).toLowerCase().includes(gq));
  const rows = keys.map((k) => {
    const used = usage.get(k) || [];
    const links = used.slice(0, 6).map((u) => {
      const parts = u.split(':');
      const kind = parts[0], id = parts[1];
      return '<button class="tiny jump" data-jump-kind="' + esc(kind) + '" data-jump-id="' + esc(id) + '">'
        + ({ bonds: '盟约', chess: '干员', garrisons: '特质', items: '道具', effects: '效果' }[kind] || kind)
        + ' · ' + esc(id) + '</button>';
    }).join(' ');
    const more = used.length > 6 ? ' <span class="hint">…另有 ' + (used.length - 6) + ' 处</span>' : '';
    return '<tr><td class="k" style="font-size:12px">' + esc(k) + '</td>'
      + '<td>' + esc(BB_GLOSS[k][0]) + '<div class="hint">单位：' + esc(BB_GLOSS[k][1]) + '</div></td>'
      + '<td>' + (used.length ? links + more : '<span class="hint">（当前数据里没有记录使用这个键）</span>') + '</td></tr>';
  }).join('');
  const body = $('#gRows');
  if (!body) return;
  body.innerHTML = rows || '<tr><td colspan="3" class="hint" style="padding:10px">没有匹配的键</td></tr>';
  // 效果 / 触发时机的总览（也吃同一个搜索框）
  const fx = $('#fxRows');
  if (fx) fx.innerHTML = effectOverviewHtml(gq);
  const nk = $('#newKeys');
  if (nk) nk.innerHTML = newKeysOverviewHtml(gq);
  const gc = $('#gCount');
  if (gc) gc.textContent = gq ? '找到 ' + keys.length + ' 个键' : '';
  for (const b of body.querySelectorAll ? (body.querySelectorAll('[data-jump-id]') || []) : []) {
    b.addEventListener('click', () => {
      const kind = b.dataset.jumpKind, id = b.dataset.jumpId;
      // 词典里的 bb 键可能出现在盟约/特质上：那两类都归到干员页去（按引用它的干员开）
      if (kind === 'chess') { selected.op = 'chess:' + id; activeTab = 'op'; }
      else if (kind === 'backups') { selected.op = 'diy:' + id; activeTab = 'op'; }
      else {
        const owners = kind === 'bonds' ? bondOwners(id) : garrisonUsers(id);
        if (owners.length) { selected.op = 'chess:' + owners[0].where; activeTab = 'op'; }
        else { selected[kind] = id; activeTab = kind; }
      }
      for (const x of $('#tabs').querySelectorAll('button')) x.classList.toggle('on', x.dataset.tab === activeTab);
      render();
    });
  }
}
/* ============================ 杂项与接线 ============================ */

let toastTimer = null;
function toast(msg, ms = 2600) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), ms);
}

$('#btnOpen').addEventListener('click', pickDirectory);
$('#btnSave').addEventListener('click', saveAll);
$('#btnRevertAll').addEventListener('click', revertAll);
$('#btnImport').addEventListener('click', () => $('#filePick').click());
$('#filePick').addEventListener('change', (e) => importFiles(e.target.files));
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
for (const b of $('#tabs').querySelectorAll('button')) {
  b.addEventListener('click', () => {
    activeTab = b.dataset.tab;
    for (const x of $('#tabs').querySelectorAll('button')) x.classList.toggle('on', x === b);
    render();
  });
}
document.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drop'); });
document.addEventListener('dragleave', () => document.body.classList.remove('drop'));
document.addEventListener('drop', (e) => {
  e.preventDefault(); document.body.classList.remove('drop');
  if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files);
});
window.addEventListener('beforeunload', (e) => { if (log.length) { e.preventDefault(); e.returnValue = ''; } });

/* ---- 快捷键与状态记忆 ---- */

/** 把定位信息写进标题：切走标签页也能看出「改的是谁、改了几处」。 */
function syncTitle() {
  const n = log.length;
  const fp = dirHandle ? dirHandle.name : (work.bonds ? '已导入' : '未授权');
  const what = activeTab === 'op' ? (pageCtx && pageCtx.name ? pageCtx.name : '干员')
    : activeTab === 'garrisons' ? '特性修改'
    : activeTab === 'items' ? '道具'
    : activeTab === 'choices' ? '悬赏 · 战术卡'
    : activeTab === 'effects' ? '效果'
    : $('#tabs') ? (($('#tabs').querySelector('button.on') || {}).textContent || '').trim().split(/\s/)[0] : '';
  document.title = (n ? '● ' + n + ' 处改动 · ' : '') + what + ' — 卫戍协议数据编辑器（' + fp + '）';
  const save = $('#btnSave');
  if (save) { save.textContent = n ? '保存到 data/（' + n + ' 处）' : '保存到 data/'; save.classList.toggle('dirty', !!n); }
  const patch = $('#btnPatch');
  if (patch) { patch.disabled = !n; patch.classList.toggle('dirty', !!n); }
}

document.addEventListener('keydown', (e) => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  // Ctrl/Cmd + S：保存（拦住浏览器的「保存网页」）
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') {
    e.preventDefault();
    if (!$('#btnSave').disabled) saveAll();
    else toast('还没载入 data，先点「选择 data 目录」。', 3600);
    return;
  }
  // F2：跳到搜索框（不占用浏览器默认的查找快捷键）
  if (e.key === 'F2') {
    e.preventDefault();
    const qi = $('#q') || $('#gq');
    if (qi) { qi.focus(); qi.select?.(); }
    return;
  }
  // Esc：关弹窗 / 清空搜索
  if (e.key === 'Escape') {
    const dlg = $('#dlg');
    if (dlg && dlg.open) { dlg.close(); return; }
    if (inField) return;                       // 输入框里的 Esc 交给各自的处理器
    const qi = $('#q');
    if (qi && qi.value) { qi.value = ''; state.q = ''; paintOpRows(); }
  }
});

$('#btnPatch').addEventListener('click', () => {
  if (!log.length) { toast('还没有改动。', 2600); return; }
  showPatch();
});
$('#btnShare').addEventListener('click', showShareDialog);

/* 记住上次的页签 / 名单 / 选中项：重开编辑器直接接着改 */
function restoreState() {
  const s = lsGet(LS_KEY, null);
  if (!s) return;
  if (s.tab && $('#tabs') && $('#tabs').querySelector('[data-tab="' + s.tab + '"]')) activeTab = s.tab;
  if (s.opKind === 'chess' || s.opKind === 'diy') state.opKind = s.opKind;
  if (s.op) selected.op = s.op;
  if (s.trait) selected.garrisons = s.trait;
  if (s.item) selected.items = s.item;
  if (s.card) selected.choices = s.card;
  if (s.effect) selected.effects = s.effect;
  if (s.q) state.q = s.q;
  for (const x of $('#tabs').querySelectorAll('button')) x.classList.toggle('on', x.dataset.tab === activeTab);
}
function saveState() {
  lsSet(LS_KEY, {
    tab: activeTab,
    opKind: state.opKind || 'chess',
    op: selected.op || null,
    trait: selected.garrisons || null,
    item: selected.items || null,
    card: selected.choices || null,
    effect: selected.effects || null,
    q: state.q || '',
  });
}

restoreState();
offerResume();
render();
if (!lsGet(LS_KEY + ':seen', false)) { lsSet(LS_KEY + ':seen', true); toast('第一次用？点「选择 data 目录」授权到游戏的 data 文件夹，之后改完 Ctrl+S 保存。', 9000); }
</script>
