    + '<p class="hint" style="margin:0 0 8px">特质的效果由 effectKey 对应引擎里的实现，数值与文案在下面直接改。</p></fieldset>'
    + (gIds.map((g) => opGarrisonBlock(entry, g)).join('') || '<fieldset><p class="hint">这名干员没有特质。</p></fieldset>');

  // 自选六星：面板字段、势力、名单与锁定、战斗数值（沿用原来的区块函数）
  const diyHtml = entry.kind === 'diy' ? (() => {
    const charId = entry.id;
    const t = diyTab();
    const r = t[charId] || {};
    const op = r.op || {};
    const un = r.un || {};
    // 路径相对合成记录 t[charId]（键就是 op / un），与 getPath 的口径一致；
    // 写入时由 formRoot 翻译成 diy.operators.<id>.… / units.<id>.… 的真实位置。
    const P = (p) => p;
    const formBlocks = Object.entries(un.forms || {}).map(([key, f]) => {
      const stats = f.stats || {};
      return '<fieldset><legend>战斗数值 · 档位 <code>' + esc(key) + '</code>'
        + (key === '2/1/4/0' ? '（普通）' : key === '2/60/7/3' ? '（精锐）' : '') + '</legend>'
        + '<div class="grid">' + Object.keys(stats).map((k) => numField('backups', charId, P('un.forms.' + key + '.stats.' + k), k, t[charId])).join('') + '</div>'
        + '<p class="hint">引擎与专属 kit（<code>server/sim/content/kits/ops/</code>）真正读取的数值，改动直接影响对局强度。</p>'
        + '</fieldset>';
    }).join('');
    const poolRows = DIY_SECTIONS.filter((s) => s.key !== 'operators').map((s) => {
      if (s.key === 'ownedPool' || s.key === 'excluded') {
        const arr = (work.backups.diy && work.backups.diy[s.key]) || [];
        const inIt = arr.includes(charId);
        return '<tr><td>' + esc(s.label) + '</td><td class="k">' + arr.length + ' 名</td><td>'
          + (inIt ? '<button class="tiny" data-poolrm="' + esc(s.key) + '">移出</button>' : '<button class="tiny" data-pooladd="' + esc(s.key) + '">加入</button>')
          + '</td></tr>';
      }
      if (s.key === 'prototypes') {
        return Object.keys(work.backups.diy.prototypes || {}).sort().map((tier) => {
          const arr = work.backups.diy.prototypes[tier] || [];
          const inIt = arr.includes(charId);
          return '<tr><td>' + esc(s.label) + ' · ' + esc(tier) + ' 星</td><td class="k">' + arr.length + ' 名</td><td>'
            + (inIt ? '<button class="tiny" data-poolrm="prototypes.' + esc(tier) + '">移出</button>' : '<button class="tiny" data-pooladd="prototypes.' + esc(tier) + '">加入</button>')
            + '</td></tr>';
        }).join('');
      }
      return Object.keys(work.backups.diy.locked || {}).sort().map((tier) => {
        const lr = work.backups.diy.locked[tier] && work.backups.diy.locked[tier][charId];
        return '<tr><td>' + esc(s.label) + ' · ' + esc(tier) + ' 星</td><td class="k">'
          + (lr ? '技能 ' + esc(lr.skillIndex ?? '—') + (lr.uniEquipId ? ' · ' + esc(lr.uniEquipId) : ' · 无模组') : '未锁定')
          + '</td><td>' + (lr ? '<button class="tiny" data-lockdel="' + esc(tier) + '">解除</button>'
                             : '<button class="tiny" data-lockadd="' + esc(tier) + '">加入</button>') + '</td></tr>';
      }).join('');
    }).join('');
    return '<fieldset><legend>自选数据（backups.json）</legend>'
      + '<div class="grid">'
      + textField('backups', charId, P('op.name'), '名字 name', t[charId])
      + numField('backups', charId, P('op.rarity'), '星级 rarity', t[charId])
      + textField('backups', charId, P('op.profession'), '职业 profession', t[charId])
      + '</div>'
      + idList('backups', charId, P('op.bonds'), 'bonds（盟约 ' + (op.bonds || []).length + '）', t[charId], 'bonds',
          '这才是引擎真正读的（决定算哪些盟约的成员）。改完保存、刷新页面即可看到新的盟约条；重建数据会按 powers 重算回去。')
      + idList('backups', charId, P('op.powers'), 'powers（势力 ' + (op.powers || []).length + '）', t[charId], null,
          '势力的汇总（nationId / groupId / teamId）。<b>引擎不读它</b>，只是构建时推导 bonds 的输入。')
      + diyDeriveBlock(op.powers, op.bonds)
      + '</fieldset>'
      + '<fieldset><legend>名单与锁定</legend><table><thead><tr><th>名单</th><th>当前</th><th>操作</th></tr></thead><tbody>' + poolRows + '</tbody></table></fieldset>'
      + formBlocks;
  })() : '';

  return head + chessCols + diyHtml + bondsHtml + gHtml;
}

/* ---- 干员页的渲染 ---- */

const OP_LIST_KINDS = [
  { key: 'chess', label: '棋子干员', hint: 'chess.json 里的 266 条记录（含精一/精二）' },
  { key: 'diy', label: '自选六星', hint: 'backups.json 的甄选干员（不在 chess.json 里）' },
];

function opFiltered(kindKey, q) {
  return opIndex().filter((e) => e.kind === kindKey).filter((e) => {
    if (!q) return true;
    const bondIds = opBondIds(e);
    const gIds = opGarrisonIds(e);
    const hay = [e.id, e.name, e.rec && e.rec.profession, e.rec && e.rec.subProfessionName,
      ...bondIds, ...gIds,
      ...((e.rec && e.rec.op && e.rec.op.powers) || [])].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function renderOp(main) {
  const listKind = state.opKind || 'chess';
  const q = state.q.trim().toLowerCase();

  // 壳的签名含列表种类与条数；选中项与搜索只重绘内容（输入法安全）
  const sig = 'op|' + listKind + '|' + opIndex().filter((e) => e.kind === listKind).length;
  const shell = main.querySelector('.list');
  if (!(shell && main.dataset.sig === sig)) {
    main.dataset.sig = sig;
    main.innerHTML = [
      '<div class="list">',
        '<div class="tools">',
          '<div class="seg">',
            ...OP_LIST_KINDS.map((k) => '<button data-opkind="' + k.key + '" class="' + (k.key === listKind ? 'on' : '') + '" title="'
              + esc(k.hint) + '">' + esc(k.label) + '</button>'),
            '</div>',
          '<span id="qCount" class="numchip"></span>',
        '</div>',
        '<div class="tools row2">',
          '<input type="search" id="q" placeholder="搜名字 / id / 盟约 / 特质" value="' + esc(state.q) + '">',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="detail"></div>',
    ].join('');
    for (const b of main.querySelectorAll('[data-opkind]')) b.addEventListener('click', () => {
      state.opKind = b.dataset.opkind;
      selected.op = null;
      render();
    });
    const qi = $('#q');
    qi.addEventListener('input', () => { state.q = qi.value; paintOpRows(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintOpRows(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintOpRows(); } });
    qi.focus();
    try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  }
  paintOpRows();
}

function paintOpRows() {
  resetDatalists();      // 本轮渲染的候选清单登记，见 idList
  const listKind = state.opKind || 'chess';
  const q = state.q.trim().toLowerCase();
  const items = opFiltered(listKind, q);

  const rows = $('#rows');
  if (rows) {
    if (!selected.op || !items.some((e) => e.key === selected.op)) selected.op = items.length ? items[0].key : null;
    const keepScroll = rows.scrollTop || 0;
    rows.innerHTML = items.length ? items.map((e) => {
      const bondIds = opBondIds(e);
      const gIds = opGarrisonIds(e);
      const iss = issuesOf(e.kind === 'diy' ? 'backups' : 'chess', e.id);
      const sub = [e.tier ? e.tier + '★' : '',
        e.kind === 'chess' ? ((e.rec && e.rec.subProfessionName) || '') : ((e.rec && e.rec.un && e.rec.un.subProfessionName) || ''),
        bondIds.length ? '盟约 ' + bondIds.length : '无盟约',
        gIds.length ? '特质 ' + gIds.length : ''].filter(Boolean).join(' · ');
      return '<div class="row ' + (e.key === selected.op ? 'on' : '') + '" data-opkey="' + esc(e.key) + '">'
        + (touched(e.kind === 'diy' ? 'backups' : 'chess', e.id) ? '<span class="dot" title="已修改"></span>' : '')
        + '<span class="t">' + esc(e.name) + (iss.length ? ' <span class="lvl-' + iss[0].lvl + '">●</span>' : '')
        + (e.kind === 'chess' && /_b$/.test(e.id) ? ' <span class="chip gold" style="font-size:10px">精二</span>' : '') + '</span>'
        + '<span class="sub">' + esc(sub) + '<br>' + esc(e.id) + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">没有匹配的干员</div>';
    if (keepScroll) rows.scrollTop = keepScroll;
    for (const el of rows.querySelectorAll ? (rows.querySelectorAll('[data-opkey]') || []) : []) {
      el.addEventListener('click', () => { selected.op = el.dataset.opkey; paintOpRows(); });
    }
  }
  const qcEl = $('#qCount');
  if (qcEl) {
    const total = opIndex().filter((e) => e.kind === listKind).length;
    qcEl.textContent = q ? items.length + ' / ' + total : total + ' 名';
  }

  const detail = $('#detail');
  if (!detail) return;
  if (!items.length) {
    detail.innerHTML = '<div class="empty">没有匹配的干员。<br><span class="hint">可以搜：干员名（余）、干员 id、盟约（炎）、特质 id。</span></div>';
    return;
  }
  const entry = items.find((e) => e.key === selected.op) || items[0];
  const sameRecord = detail.dataset.rec === entry.key;
  const keepDetail = sameRecord ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = entry.key;
  detail.innerHTML = opForm(entry);
  // 记录是合成的，wireForm 的 rec 兜底要能拿到
  wireForm(entry.kind === 'diy' ? 'backups' : 'chess', entry.id, { rec: entry.rec, pageCtx: entry });
  detail.scrollTop = keepDetail;
  syncTitle();
}

/* ============================ 特质页（按数据类型） ============================ */
/*
 *  与干员页互补：干员页是「以人为中心」，这里是「以特质为中心」——列出全部特质逐个改，
 *  适合批量核对数值/文案、找共用关系。
 *
 *  配对约定：garrison_N_a = 精一版、garrison_N_b = 精二版，是两条独立记录。
 *  这是最容易出错的地方（改了一条忘了另一条，面板与实效不符），所以：
 *    · 文案（desc / descRaw）改一条会**自动同步**到配对那条；
 *    · 数值（bb）**不自动同步**——两版的数值本该可以不同，只在配对不一致时给提醒。
 */

/** 配对的特质 id（garrison_N_a ↔ garrison_N_b）。 */
function traitPairId(gid) {
  const m = /^(.*)_([ab])$/.exec(String(gid));
  return m ? m[1] + '_' + (m[2] === 'a' ? 'b' : 'a') : null;
}

/**
 * 把一条特质的**文案**复制到配对那条（数值不动）。
 * 刻意不自动做：两版文案本就常不同（+1 / +2），只有你想统一时才明确调用。
 * 一次把 desc + descRaw 写全并抑制再同步——分开写会互相覆盖。
 * @returns {string|null} 被写入的 id，没有配对时 null
 */
function copyTraitTextToPair(gid) {
  const other = traitPairId(gid);
  const g = work.garrisons[gid];
  const o = other && work.garrisons[other];
  if (!g || !o) return null;
  suppressSync = true;
  const plain = String(g.desc ?? '').trim();
  setField('garrisons', other, 'desc', plain);
  setField('garrisons', other, 'descRaw', toRaw(plain));
  suppressSync = false;
  return other;
}

/** 配对那条的特征摘要，用来判断两条是否已经不同步。 */
function traitPairDiff(gid) {
  const other = traitPairId(gid);
  const g = work.garrisons[gid];
  const o = other && work.garrisons[other];
  if (!g || !o) return null;
  const bbKeys = [...new Set([...Object.keys(g.bb || {}), ...Object.keys(o.bb || {})])];
  const bbDiff = bbKeys.filter((k) => JSON.stringify((g.bb || {})[k]) !== JSON.stringify((o.bb || {})[k]));
  const textDiff = (g.desc || '') !== (o.desc || '');
  return { other, bbDiff, textDiff };
}

/** 特质页主体。 */
/* ============================ 混合特性（合成引擎，纯函数） ============================ */
/*
 *  引擎层面的硬约束（决定「混合」能做到什么）：
 *    · 一条特质只有一个 effectKey → 一个实现。**不同 effectKey 的两条特质无法合成一条**：
 *      引擎按 `garrison:<effectKey>` 找处理器，不会把两个处理器拼起来跑。
 *      想让一个干员同时生效，正确做法是让他**同时带两条特质**（garrisonIds 本来就有序、可多条）。
 *    · 同 effectKey 时，参数是**列表**（bbStr.bond / bond_id / count 逗号分隔）→ 可以合并，
 *      结果表现为「一条特质影响多条盟约」（官方 SERVER_ADD_MULTIPLE_BOND 就是这么做的）。
 *      参数是**标量**（bb.atk 这类）→ 同键出不了两个值，只能沿用其一，并如实告诉你。
 *
 *  所以这个引擎给出明确的三种结论：merge（可合）、same-key-note（合了但有条目被顶掉）、
 *  incompatible（不能合，附原因与替代方案）。**不猜、不静默丢参数。**
 */

/** 参数里本来就是「逗号分隔列表」的键——这些可以合并。 */
const MERGE_LIST_KEYS = ['bond', 'bond_id', 'count'];

/** 一条特质的参数是不是「同类可合并」形状。 */
function mergeShape(g) {
  const bb = g.bb || {}, bbStr = g.bbStr || {};
  const lists = MERGE_LIST_KEYS.filter((k) => typeof bbStr[k] === 'string' && bbStr[k].includes(','));
  const scalars = Object.keys(bb).filter((k) => typeof bb[k] === 'number');
  return { lists, scalars, hasStrCount: typeof bbStr.count === 'string' };
}

/**
 * 尝试把多条特质混合成一条新特质。
 * @param {string[]} gids 源特质 id（顺序即优先级：标量冲突时取靠前的）
 * @returns {{ok:boolean, kind:string, reason?:string, record?:object, notes:string[], dropped?:string[]}}
 */
function mixTraits(gids, opts = {}) {
  const list = [...new Set(gids)].filter(Boolean);
  const notes = [];
  if (list.length < 2) return { ok: false, kind: 'incompatible', reason: '至少要选 2 条特质', notes };
  const recs = list.map((gid) => ({ gid, g: work.garrisons && work.garrisons[gid] })).filter((x) => x.g);
  if (recs.length !== list.length) {
    const miss = list.filter((gid) => !work.garrisons[gid]);
    return { ok: false, kind: 'incompatible', reason: '这些特质不存在：' + miss.join('、'), notes };
  }
  const keys = [...new Set(recs.map((x) => x.g.effectKey))];
  if (keys.length > 1) {
    return {
      ok: false, kind: 'incompatible',
      reason: '这几条的 effectKey 不同（' + keys.join(' / ') + '）。一条特质只能有一个实现，引擎不会把两个实现拼起来跑。',
      notes: ['正确做法：让这名干员**同时带这几条特质**（garrisonIds 支持多条，编队页会全部显示、按顺序结算）。'],
    };
  }
  const key = keys[0];
  const base = recs[0].g;
  const out = JSON.parse(JSON.stringify(base));
  out.garrisonId = opts.newId || (list[0].replace(/_[ab]$/, '') + '_mix');
  out.desc = opts.desc != null ? opts.desc : recs.map((x) => String(x.g.desc || '')).join('；');
  out.descRaw = opts.descRaw != null ? opts.descRaw : out.desc;
  out.owners = [];
  out.synth = { mix: list.slice(), at: new Date().toISOString().slice(0, 19) };

  // 先清掉继承来的合成痕迹，避免取消合成后旧痕迹残留
  delete out.synthFrom;

  /*
   * 合并参数。
   * 列表键（bond / bond_id / count 的字符串形状）：按位置拼起来，长度不一致也要对齐补空，
   *   否则 bond 与 count 会错位——那正是「面板对不上实效」的经典原因。
   * 标量键：同键出不了两个值 → 沿用优先级最高的那条，被顶掉的如实记进 dropped。
   */
  const dropped = [];
  const allStrKeys = [...new Set(recs.flatMap((x) => Object.keys(x.g.bbStr || {})))];
  for (const k of allStrKeys) {
    const vals = recs.map((x) => (x.g.bbStr || {})[k]);
    if (MERGE_LIST_KEYS.includes(k)) {
      const parts = vals.map((v) => (v == null || v === '' ? [] : String(v).split(',').map((s) => s.trim())));
      const merged = [];
      // 按「源顺序」整块拼接，不要交错：list 与它对应的数值列表必须保持一一对应
      for (const p of parts) for (const item of p) if (item) merged.push(item);
      out.bbStr = out.bbStr || {};
      out.bbStr[k] = merged.join(',');
      notes.push('bbStr.' + k + ' 合并为 ' + merged.length + ' 项：' + merged.join(' / '));
    } else {
      const uniq = [...new Set(vals.filter((v) => v != null && v !== ''))];
      if (uniq.length > 1) {
        out.bbStr = out.bbStr || {};
        out.bbStr[k] = uniq[0];
        dropped.push('bbStr.' + k + '（' + uniq.join(' vs ') + '）');
      } else if (uniq.length === 1) {
        out.bbStr = out.bbStr || {};
        out.bbStr[k] = uniq[0];
      } else if (out.bbStr) {
        delete out.bbStr[k];
      }
    }
  }
  const allBbKeys = [...new Set(recs.flatMap((x) => Object.keys(x.g.bb || {})))];
  for (const k of allBbKeys) {
    const nums = recs.map((x) => (x.g.bb || {})[k]).filter((v) => typeof v === 'number');
    if (!nums.length) continue;
    const uniq = [...new Set(nums)];
    out.bb = out.bb || {};
    out.bb[k] = uniq[0];
    if (uniq.length > 1) dropped.push('bb.' + k + '（' + uniq.join(' vs ') + '）');
  }

  if (dropped.length) {
    notes.push('这些标量参数只能保留一个值（同键出不了两个数），已沿用排在前面的那条：' + dropped.join('；')
      + '。想让两个值都生效，请用「同时携带两条特质」，而不是合成。');
  }
  const kind = dropped.length ? 'same-key-note' : 'merge';
  return { ok: true, kind, record: out, notes, dropped };
}

/** 把混合结果放进数据表并记账。 */
function createMixedTrait(mix, opts = {}) {
  const rec = mix && mix.record;
  if (!rec) return { ok: false, reason: '没有可写入的记录' };
  // 显式传了 newId 就用它（空串也算「显式给了个空值」→ 拒绝），没给才回退到记录自带的 id
  const given = Object.prototype.hasOwnProperty.call(opts, 'newId') ? opts.newId : rec.garrisonId;
  let id = String(given == null ? '' : given).trim();
  if (!id) return { ok: false, reason: '新特质 id 不能为空' };
  if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(id)) return { ok: false, reason: 'id 只能是英文字母开头的字母/数字/下划线（引擎按 id 找记录，中文不行）' };
  if (work.garrisons[id]) {
    // 撞名自动加后缀，不覆盖已有特质
    let n = 1;
    while (work.garrisons[id + '_' + n]) n++;
    id = id + '_' + n;
  }
  rec.garrisonId = id;
  rec.owners = Array.isArray(opts.owners) ? [...opts.owners] : [];
  work.garrisons[id] = rec;
  log.push({ file: 'garrisons', id, field: '(整条新增·混合)', from: null, to: JSON.parse(JSON.stringify(rec)) });
  clearIndexCache();
  validate();
  return { ok: true, id };
}

/** 把一条特质挂到干员身上（合成后「同时携带」的正确做法）。 */
function attachTraitToChess(chessId, gid) {
  const rec = work.chess && work.chess[chessId];
  if (!rec) return { ok: false, reason: '找不到棋子记录 ' + chessId };
  const arr = [...(rec.garrisonIds || [])];
  if (arr.includes(gid)) return { ok: false, reason: (rec.name || chessId) + ' 已经有这条特质了' };
  arr.push(gid);
  setField('chess', chessId, 'garrisonIds', arr);
  validate();
  return { ok: true };
}

/* ============================ 「获得时 · 加盟约层数」的成对编辑器 ============================ */
/*
 *  这一类特质在数据里的形状（纯数据、引擎已有实现，不需要改代码）：
 *
 *    单条盟约  SERVER_ADD_BOND         bb {count:N}            bbStr {bond:"yanShip"}
 *    多条盟约  SERVER_ADD_MULTIPLE_BOND bb {}                  bbStr {bond:"yanShip,miraShip", count:"12,6"}
 *
 *  两条串必须**逗号对齐、一一对应**——手写极易错位（这是这个编辑器存在的理由）。
 *  界面上一行 = 一条盟约，改完自动写回两个串，并同步 desc（游戏渲染 descRaw，会自动跟上）。
 */

const MULTI_BOND_KEYS = new Set(['SERVER_ADD_BOND', 'SERVER_ADD_MULTIPLE_BOND']);

/** 盟约 id → 中文显示名（desc 里用【中文】，bbStr 里用英文 id）。 */
const bondName = (bondId) => {
  const b = work.bonds && work.bonds[bondId];
  return (b && b.name) || bondId;
};

/**
 * 读出一组「盟约 → 层数」。
 * 兼容两种形状：多条盟约按位置对齐（155/156），以及单条盟约（157，层数在 bb.count）。
 * @returns {Array<{bondId:string, count:number|null}>}
 */
function readBondPairs(g) {
  const ids = String((g.bbStr && g.bbStr.bond) || '').split(',').map((s) => s.trim()).filter(Boolean);
  const counts = String((g.bbStr && g.bbStr.count) || '').split(',').map((s) => s.trim());
  const bbCount = (g.bb && typeof g.bb.count === 'number') ? g.bb.count : null;
  return ids.map((bondId, i) => {
    const raw = counts[i];
    const n = raw === undefined || raw === '' ? NaN : Number(raw);
    return { bondId, count: Number.isFinite(n) ? n : (counts.filter(Boolean).length ? null : bbCount) };
  });
}

/** 写回：多条盟约统一走 SERVER_ADD_MULTIPLE_BOND（bb 清空，数值放 bbStr.count）。 */
function writeBondPairs(gid, pairs) {
  const clean = pairs.filter((p) => p.bondId);
  if (!clean.length) { toast('至少要留一条盟约。', 3200); return false; }
  // 注意 Number('') === 0，是有限数——空值必须单独挡掉，否则会被当成 +0
  const missing = clean.filter((p) => p.count === '' || p.count == null || !Number.isFinite(Number(p.count)));
  if (missing.length) { toast('这几条的层数要填数字：' + missing.map((p) => bondName(p.bondId)).join('、'), 4200); return false; }
  if (clean.length > 1) {
    // 多条：数值放进 bbStr.count，bb 里的 count 必须清掉，否则引擎会读错来源
    setField('garrisons', gid, 'effectKey', 'SERVER_ADD_MULTIPLE_BOND');
    setField('garrisons', gid, 'effectType', 'SERVER_ADD_MULTIPLE_BOND');
    setField('garrisons', gid, 'bbStr.bond', clean.map((p) => p.bondId).join(','));
    setField('garrisons', gid, 'bbStr.count', clean.map((p) => String(Number(p.count))).join(','));
    setField('garrisons', gid, 'bb', {});
  } else {
    // 单条：走 SERVER_ADD_BOND，数值放 bb.count（与官方 157 一致）
    setField('garrisons', gid, 'effectKey', 'SERVER_ADD_BOND');
    setField('garrisons', gid, 'effectType', 'SERVER_ADD_BOND');
    setField('garrisons', gid, 'bbStr.bond', clean[0].bondId);
    setField('garrisons', gid, 'bbStr.count', '');
    setField('garrisons', gid, 'bb', { count: Number(clean[0].count) });
  }
  return true;
}

/** 按一组「盟约 → 层数」生成描述文本（<获得时> 开头，与官方写法一致）。 */
function bondPairsText(pairs) {
  const clean = pairs.filter((p) => p.bondId && p.count !== '' && p.count != null);
  if (!clean.length) return '';
  const body = clean.map((p) => '【' + bondName(p.bondId) + '】层数+' + Number(p.count)).join('、');
  return '<获得时>' + body + '（无需激活盟约）';
}

/**
 * 同上，但数字带官方彩色标记 —— 游戏渲染的是 descRaw，带标记才和原生特质长得一样。
 * 官方写法：<获得时>【炎】层数<@ba.vup>+12</>、…
 */
function bondPairsRichText(pairs) {
  const clean = pairs.filter((p) => p.bondId && p.count !== '' && p.count != null);
  if (!clean.length) return '';
  const body = clean.map((p) => '【' + bondName(p.bondId) + '】层数<@ba.vup>+' + Number(p.count) + '</>').join('、');
  return '<获得时>' + body + '（无需激活盟约）';
}

/** 把一份成对列表的文案（纯文本 + 富文本）一起写进特质记录。 */
function applyBondPairsText(gid, pairs) {
  setField('garrisons', gid, 'desc', bondPairsText(pairs));
  setField('garrisons', gid, 'descRaw', bondPairsRichText(pairs));
}

/** 在现有列表上追加一条盟约（已存在则累加层数，符合「混合为」的直觉）。 */
function addBondPair(pairs, bondId, count) {
  const hit = pairs.find((p) => p.bondId === bondId);
  if (hit) {
    hit.count = (Number(hit.count) || 0) + Number(count);
  } else {
    pairs.push({ bondId, count: Number(count) });
  }
  return pairs;
}

/**
 * 特质页里的「获得时 · 加盟约层数」编辑器（一行 = 一条盟约）。
 * 只在 effectKey 属于这一族时出现——其它特质的数值含义不同，不能套用这个界面。
 */
/* ============================ 混合特性页 ============================ */

function renderMix(main) {
  resetDatalists();
  const sig = 'mix|' + traitIds().length;
  if (!(main.querySelector('.list') && main.dataset.sig === sig)) {
    main.dataset.sig = sig;
    main.innerHTML = [
      '<div class="list">',
        '<div class="tools">',
          '<span style="font-size:12px;color:var(--dim)">挑选要混合的特质</span>',
          '<span id="qCount" class="numchip"></span>',
        '</div>',
        '<div class="tools row2">',
          '<input type="search" id="q" placeholder="搜 id / 文案 / effectKey / bb 键 / 拥有者" value="' + esc(state.q) + '">',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="mixDetail"></div>',
    ].join('');
    const qi = $('#q');
    qi.addEventListener('input', () => { state.q = qi.value; paintMix(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintMix(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintMix(); } });
  }
  paintMix();
}

function paintMix() {
  resetDatalists();
  const q = state.q.trim().toLowerCase();
  const ids = traitFiltered(q);
  const rows = $('#rows');
  if (rows) {
    const keepScroll = rows.scrollTop || 0;
    const picked = new Set(mixSel.ids);
    rows.innerHTML = ids.length ? ids.map((gid) => {
      const g = work.garrisons[gid] || {};
      const on = picked.has(gid);
      const order = mixSel.ids.indexOf(gid);
      const users = garrisonUsers(gid).length;
      return '<div class="row' + (on ? ' on' : '') + '" data-mixgid="' + esc(gid) + '" title="点一下选中/取消">'
        + '<span class="t">' + (on ? '<b style="color:#7fb2ff">' + (order + 1) + '. </b>' : '')
        + esc(String(g.desc || gid).split('\n')[0].slice(0, 26))
    + ' <span class="chip" style="font-size:10px">' + esc(effectKeyLabel(g.effectKey)) + '</span></span>'
        + '<span class="sub">' + esc(gid.replace(/^garrison_/, '') + (users ? ' · ' + users + ' 名' : '')) + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">没有匹配的特质</div>';
    if (keepScroll) rows.scrollTop = keepScroll;
    for (const el of rows.querySelectorAll ? (rows.querySelectorAll('[data-mixgid]') || []) : []) {
      el.addEventListener('click', () => {
        const gid = el.dataset.mixgid;
        const i = mixSel.ids.indexOf(gid);
        if (i >= 0) mixSel.ids.splice(i, 1); else mixSel.ids.push(gid);
        paintMix();
      });
    }
  }
  const qcEl = $('#qCount');
  if (qcEl) qcEl.textContent = q ? ids.length + ' / ' + traitIds().length : traitIds().length + ' 条';
  const d = $('#mixDetail');
  if (d) d.innerHTML = mixDetailHtml();
  wireMixDetail();
}

function mixDetailHtml() {
  const picked = mixSel.ids.map((gid) => ({ gid, g: work.garrisons[gid] })).filter((x) => x.g);
  const chosen = picked.map((x) => '<li><span class="k">' + esc(x.gid) + '</span> '
    + esc(String(x.g.desc || '').split('\n')[0].slice(0, 40))
    + ' <span class="chip" style="font-size:10px">' + esc(effectKeyLabel(x.g.effectKey)) + '</span></li>').join('');

  const head = '<h2>混合特性 <span class="chip">已选 ' + picked.length + ' 条</span></h2>'
    + '<div class="sub">把几条<b>已有</b>特质的内容合成一条新特质。所有参数都来自原有特质，不做任何猜测。</div>'
    + '<fieldset><legend>已选（顺序 = 标量冲突时的优先级）</legend>'
    + (picked.length ? '<ul class="issues">' + chosen + '</ul>' : '<p class="hint">在左侧点选 2 条以上特质。</p>')
    + '<div class="addbox"><button class="tiny" id="mixClear">清空选择</button>'
    + '<button class="tiny" id="mixOrderUp">把第 2 条提到前面</button>'
    + '<span class="hint" style="margin:0">顺序决定标量参数冲突时保留谁</span></div>'
    + '</fieldset>';

  const rules = '<fieldset><legend>混合规则（按引擎的实际能力）</legend>'
    + '<p class="hint"><b>能合并</b>：两条的 <code>effectKey</code> 相同，且参数是列表形状'
    + '（<code>bbStr.bond</code> / <code>bond_id</code> / <code>count</code> 逗号分隔）'
    + '→ 结果是一条特质影响多条盟约（官方的 <code>SERVER_ADD_MULTIPLE_BOND</code> 就是这么做的）。</p>'
    + '<p class="hint"><b>只能保留一个</b>：参数是标量（<code>bb.atk</code> 这类）→ 同键出不了两个数，'
    + '沿用排在前面的那条，被顶掉的会明确列出来。</p>'
    + '<p class="hint"><b>不能合并</b>：两条的 <code>effectKey</code> 不同。一条特质只能有一个实现，'
    + '引擎按 <code>garrison:&lt;effectKey&gt;</code> 找处理器、不会把两个跑在一起。'
    + '想让干员同时享受两种效果，正确做法是让他<b>同时带这两条特质</b>（<code>garrisonIds</code> 本来就支持多条）。</p>'
    + '</fieldset>';

  if (picked.length < 2) return head + rules;

  const mix = mixTraits(mixSel.ids, { newId: mixSel.name ? undefined : undefined });
  if (!mix.ok) {
    return head + rules
      + '<fieldset><legend>结论：不能合成一条</legend>'
      + '<div class="addbox" style="border-left:3px solid var(--bad);padding-left:8px">'
      + '<span class="hint" style="margin:0">' + esc(mix.reason) + '</span></div>'
      + (mix.notes.length ? '<p class="hint">' + mix.notes.map((n) => esc(n)).join('<br>') + '</p>' : '')
      + '<div class="addbox"><button class="tiny primary" id="mixAttachAllBad">把它们都挂到同一名干员身上</button></div>'
      + '</fieldset>';
  }
  const ok = mix.kind === 'merge';
  return head + rules
    + '<fieldset><legend>结论：' + (ok ? '可以合成一条' : '可以合成，但有参数被顶掉') + '</legend>'
    + '<div class="addbox" style="border-left:3px solid ' + (ok ? 'var(--ok)' : 'var(--warn)') + ';padding-left:8px">'
    + '<span class="hint" style="margin:0">公共实现：<b>' + esc(effectKeyLabel(mix.record.effectKey)) + '</b>'
    + ' <code>' + esc(mix.record.effectKey) + '</code>'
    + '　触发时机：' + esc((EVENT_TYPES[mix.record.eventType] || [])[0] || mix.record.eventType) + '</span></div>'
    + (mix.notes.length ? '<ul class="issues">' + mix.notes.map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '')
    + '<div class="grid" style="margin-top:8px">'
    + '<label class="f"><span>新特质 id（默认 garrison_N_mix）</span>'
    + '<input id="mixNewId" value="' + esc(mixSel.name || mix.record.garrisonId) + '"></label>'
    + '<label class="f"><span>挂到哪名干员（可选，留空则只建特质）</span>'
    + '<select id="mixChess"><option value="">（先不挂）</option>'
    + (() => {
      const seen = new Set();
      const outs = [];
      for (const gid of mixSel.ids) {
        for (const u of garrisonUsers(gid)) {
          if (seen.has(u.where)) continue;
          seen.add(u.where);
          outs.push('<option value="' + esc(u.where) + '">' + esc(u.name) + '（' + esc(u.where) + '）</option>');
        }
      }
      return outs.join('');
    })()
    + '</select></label>'
    + '<label class="f" style="grid-column:1/-1"><span>合并后的文案（可改；默认把各条文案接起来）</span>'
    + '<textarea id="mixDesc" rows="2">' + esc(mix.record.desc) + '</textarea></label>'
    + '</div>'
    + '<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">看看合并后的完整参数</summary>'
    + '<pre>' + esc(JSON.stringify({ bb: mix.record.bb, bbStr: mix.record.bbStr }, null, 1)) + '</pre></details>'
    + '<div class="addbox"><button class="tiny primary" id="mixCreate">创建这条混合特质</button>'
    + '<button class="tiny" id="mixAttachAll">不改参数，只把它们都挂到同一名干员</button></div>'
    + '</fieldset>';
}

function wireMixDetail() {
  const d = $('#mixDetail');
  if (!d) return;
  const clear = d.querySelector('#mixClear');
  if (clear) clear.addEventListener('click', () => { mixSel.ids = []; paintMix(); });
  const up = d.querySelector('#mixOrderUp');
  if (up) up.addEventListener('click', () => {
    if (mixSel.ids.length < 2) return;
    const [a, b] = mixSel.ids;
    mixSel.ids[0] = b; mixSel.ids[1] = a;
    paintMix();
    toast('已交换前两条的顺序', 2600);
  });
  const attachAll = d.querySelector('#mixAttachAll') || d.querySelector('#mixAttachAllBad');
  if (attachAll) attachAll.addEventListener('click', () => {
    const sel = d.querySelector('#mixChess');
    const cid = sel && sel.value;
    if (!cid) { toast('先在下面选一名干员', 3200); return; }
    let n = 0;
    for (const gid of mixSel.ids) if (attachTraitToChess(cid, gid).ok) n++;
    render();
    toast('已给 ' + cid + ' 挂上 ' + n + ' 条特质（原本已有的会跳过）', 5200);
  });
  const create = d.querySelector('#mixCreate');
  if (create) create.addEventListener('click', () => {
    const newId = (d.querySelector('#mixNewId').value || '').trim();
    const desc = d.querySelector('#mixDesc').value;
    const cid = d.querySelector('#mixChess').value;
    const mix = mixTraits(mixSel.ids, { newId, desc, descRaw: desc });
    if (!mix.ok) { toast(mix.reason, 6000); return; }
    const r = createMixedTrait(mix, { newId, owners: cid ? [cid] : [] });
    if (!r.ok) { toast(r.reason, 6000); return; }
    if (cid) {
      const a = attachTraitToChess(cid, r.id);
      if (!a.ok) toast(a.reason, 4200);
    }
    mixSel.name = '';
    mixSel.ids = [];
    render();
    toast('已创建混合特质 ' + r.id + (cid ? ' 并挂到 ' + cid : '') + '。「校验」页会给它做检查。', 6200);
  });
  // 记住用户在输入框里打的 id，重绘不丢
  const nid = d.querySelector('#mixNewId');
  if (nid) nid.addEventListener('input', () => { mixSel.name = nid.value; });
  const chs = d.querySelector('#mixChess');
  if (chs) chs.addEventListener('change', () => { mixSel.chess = chs.value; });
}


/* ============================ 盟约页（按数据类型） ============================ */
/*
 *  与干员页互补：这里按盟约逐条改，并提供「以某条为模板合成新盟约」。
 *
 *  ⚠ 引擎层面的限制（server/sim/content/bonds/core.js）：盟约的**战斗效果是按 bondId 写死**的，
 *  BUFF_KEYS 只映射 8 条核心盟约，addon 里另外 15 条也各按 id 分支。所以：
 *    · 复制一条现有盟约 → 完整继承它的效果实现，改数值/名字/势力/成员/门槛都有效；
 *    · 凭空造一个新 id   → 能参与成员统计与层数计数，但**没有自己的战斗效果**
 *      （与游戏里「远见 / 奇迹 / 投资人 / 调和」那类纯预备期盟约类似）。
 *  这句话必须显示在界面上，不能让人以为新盟约会自动有威力。
 */

/** 引擎里有专属效果实现的盟约（core 8 条 + addon 里按 id 分支的那些）。 */
const BOND_ENGINE_KEYS = {
  yanShip: 'core.js', sargonShip: 'core.js', victoriaShip: 'core.js', kjeragShip: 'core.js',
  lateranoShip: 'core.js', egirShip: 'core.js', siracusaShip: 'core.js', kazimierzShip: 'core.js',
  preciShip: 'addon/battle', swiftShip: 'addon/battle', skillfulShip: 'addon/battle', arcaneShip: 'addon/battle',
  steadShip: 'addon/battle', deputShip: 'addon/battle + addon/meta', visiShip: 'addon/meta', miraShip: 'addon/meta',
  raidShip: 'addon/battle', indomShip: 'addon/battle', emptyShip: 'addon/battle', soloShip: 'addon/battle',
  suntShip: 'addon/battle', investShip: 'effectsMeta 调度器', maniShip: 'bondsMeta',
};
const bondHasEngineEffect = (bondId) => Object.prototype.hasOwnProperty.call(BOND_ENGINE_KEYS, bondId);

/** 盟约里「引擎会读」的数值键（来自各条的 bbStr/bb，改它们有意义）。 */
const BOND_KNOWN_BB = {
  power_bond_char_cnt: '进阶 1 的干员数门槛（展示/条件，应与 thresholds[1] 一致）',
  ex_bond_char_cnt: '进阶 2 的干员数门槛（应与 thresholds[2] 一致）',
  bond_layer_gain_coin: '每 N 层获得资金（远见等）',
  bond_add_count: '一次性追加的层数',
  base_atk: '干员攻击力加成 · 基础',
  base_max_hp: '干员生命上限加成 · 基础',
  divide_num: '每 N 层触发一次',
  atk: '每层攻击力加成',
  max_hp: '每层生命上限加成',
  count: '数量',
  multi: '倍数',
};

/**
 * 以一条现有盟约为模板合成新盟约。
 * @param {string} srcId 模板盟约 id
 * @param {string} newId 新 id（英文，会作为 bondId 与 bbStr.bond 的值）
 * @returns {{ok:true,id:string}|{ok:false,reason:string}}
 */
function synthBond(srcId, newId, opts = {}) {
  const src = work.bonds && work.bonds[srcId];
  if (!src) return { ok: false, reason: '模板盟约不存在：' + srcId };
  const id = String(newId || '').trim();
  if (!id) return { ok: false, reason: '新盟约 id 不能为空' };
  if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(id)) return { ok: false, reason: 'id 只能是英文字母开头的字母/数字/下划线（引擎按 id 匹配，中文不行）' };
  if (work.bonds[id]) return { ok: false, reason: 'id 已存在：' + id };

  const copy = JSON.parse(JSON.stringify(src));
  copy.bondId = id;
  copy.name = opts.name || (String(src.name || srcId) + '·改');
  // 描述里的盟约名同步换掉，否则界面还写着模板的名字
  for (const k of ['desc', 'descRaw', 'effectDesc', 'effectDescRaw', 'effectName']) {
    if (typeof copy[k] === 'string' && copy[k]) copy[k] = copy[k].split(String(src.name || srcId)).join(copy.name);
  }
  if (Array.isArray(opts.powerIdList)) copy.powerIdList = [...opts.powerIdList];
  if (opts.keepMembers !== true) { copy.members = []; copy.visibleMembers = []; }
  if (Array.isArray(opts.thresholds)) copy.thresholds = [...opts.thresholds];
  // 记录来源，方便以后知道它是从哪条改的
  copy.synth = { from: srcId, at: new Date().toISOString().slice(0, 19) };

  work.bonds[id] = copy;
  log.push({ file: 'bonds', id, field: '(整条新增)', from: null, to: JSON.parse(JSON.stringify(copy)) });
  clearIndexCache();
  return { ok: true, id };
}

    + numField('bonds', bondId, 'bb.ex_bond_char_cnt', 'bb.ex_bond_char_cnt（进阶 2）', b)

    + '</fieldset>'

/**
 * 盟约成员编辑器：一行 = 一名成员（仿「获得时」的成对表，勾选式）。
 * members / visibleMembers 是「干员侧反查」的结果，改它们要一起改干员的 bonds 才自洽。
 */
function bondMembersBlock(bondId, b) {
  const members = b.members || [];
  const all = Object.keys(work.chess || {}).filter((id) => /^chess_char_/.test(id));
  const inIt = new Set(members);
  const others = all.filter((id) => inIt.has(id));
  const rest = all.filter((id) => !inIt.has(id));
  const nameOf = (id) => (work.chess[id] && work.chess[id].name) || id;
  return '<fieldset><legend>成员 members（' + members.length + ' 名）</legend>'
    + '<p class="hint" style="margin:0 0 8px">这是「干员侧反查」的结果：真正决定谁能吃盟约的是<b>干员自己的 bonds</b>。'
    + '在这里勾选只改这张表，<b>重跑 build-data 会被覆盖</b>；要让改动稳固，请同时去那名干员的页里加 bonds。</p>'
    + '<table><thead><tr><th>已加入</th><th></th><th>可加入</th></tr></thead><tbody>'
    + '<tr><td style="vertical-align:top">'

    + '</fieldset>';

/* ---- 盟约页的渲染 ---- */

function bondIds() {
  return Object.keys(work.bonds || {}).sort((a, b) => {
    const ca = work.bonds[a].isCore ? 0 : 1, cb = work.bonds[b].isCore ? 0 : 1;
    return ca - cb || a.localeCompare(b);
  });
}
function bondFiltered(q) {
  return bondIds().filter((id) => {
    if (!q) return true;
    const b = work.bonds[id] || {};
    // 也要能按 bb 键名搜（例如搜 base_time 找出用它的盟约）
    return [id, b.name, b.desc, b.effectDesc, (b.powerIdList || []).join(' '), (b.members || []).join(' '),
      Object.keys(b.bb || {}).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
}

function renderBond(main) {
  const sig = 'bond|' + bondIds().length;
  const shell = main.querySelector('.list');
  if (!(shell && main.dataset.sig === sig)) {
    main.dataset.sig = sig;
    main.innerHTML = [
      '<div class="list">',
        '<div class="tools">',
          '<span style="font-size:12px;color:var(--dim)">全部盟约</span>',
          '<span id="qCount" class="numchip"></span>',
        '</div>',
        '<div class="tools row2">',
          '<input type="search" id="q" placeholder="搜名字 / id / 描述 / 势力 / 成员" value="' + esc(state.q) + '">',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="detail"></div>',
    ].join('');
    const qi = $('#q');
    qi.addEventListener('input', () => { state.q = qi.value; paintBondRows(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintBondRows(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintBondRows(); } });
    qi.focus();
    try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  }
  paintBondRows();
}

function paintBondRows() {
  resetDatalists();
  const q = state.q.trim().toLowerCase();
  const ids = bondFiltered(q);
  if (!ids.includes(selected.bonds)) selected.bonds = ids[0] || null;

  const rows = $('#rows');
  if (rows) {
    const cur = selected.bonds;
    const keepScroll = rows.scrollTop || 0;
    rows.innerHTML = ids.length ? ids.map((id) => {
      const b = work.bonds[id] || {};
      const iss = issuesOf('bonds', id);
      const eng = bondHasEngineEffect(id);
      return '<div class="row ' + (id === cur ? 'on' : '') + '" data-bid="' + esc(id) + '">'
        + (touched('bonds', id) ? '<span class="dot" title="已修改"></span>' : '')
        + '<span class="t">' + esc(b.name || id)
        + (b.isCore ? ' <span class="chip ok" style="font-size:10px">核心</span>' : '')
        + (b.synth ? ' <span class="chip gold" style="font-size:10px">复制品</span>' : '')
        + (iss.length ? ' <span class="lvl-' + iss[0].lvl + '">●</span>' : '') + '</span>'
        + '<span class="sub">' + esc((b.members || []).length + ' 名' + (eng ? '' : ' · 无专属效果')) + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">没有匹配的盟约</div>';
    if (keepScroll) rows.scrollTop = keepScroll;
    for (const el of rows.querySelectorAll ? (rows.querySelectorAll('[data-bid]') || []) : []) {
      el.addEventListener('click', () => { selected.bonds = el.dataset.bid; paintBondRows(); });
    }
  }
  const qcEl = $('#qCount');
  if (qcEl) qcEl.textContent = q ? ids.length + ' / ' + bondIds().length : bondIds().length + ' 条';

  const detail = $('#detail');
  if (!detail) return;
  const cur = selected.bonds;
  if (!cur || !work.bonds[cur]) { detail.innerHTML = '<div class="empty">从左侧选一条盟约</div>'; return; }
  const sameRecord = detail.dataset.rec === cur;
  const keepDetail = sameRecord ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = cur;
  detail.innerHTML = bondForm(cur) + synthBlock(cur);
  wireForm('bonds', cur);
  detail.scrollTop = keepDetail;
  syncTitle();
}

/** 「以这条为模板合成新盟约」——放在详情末尾，避免占主视觉。 */
/**
 * 特质「绑定哪条盟约」的字段：可能是 bbStr.bond_id（82 条）或 bbStr.bond（14 条）。
 * 用户的实际用法就是「把【精准】换成【奥术】」——所以这里要给出：
 *   · 一个盟约下拉（中文名 + 英文 id）
 *   · 换绑时**自动把文案里的【旧名】改成【新名】**，否则面板还写着旧盟约，和实效不一致
 * @returns {string} 字段名（bond_id / bond / null）
 */
function traitBondField(g) {
  if (!g || !g.bbStr) return null;
  if (typeof g.bbStr.bond_id === 'string' && g.bbStr.bond_id) return 'bond_id';
  if (typeof g.bbStr.bond === 'string' && g.bbStr.bond) return 'bond';
  return null;
}

/** 盟约 id 列表 → 中文名列表。 */
const bondNamesOf = (ids) => String(ids || '').split(',').map((x) => x.trim()).filter(Boolean).map((id) => bondName(id));

/**
 * 换绑盟约：改 bbStr 的字段，并把文案里【旧名】同步换成【新名】。
 * 只替换「确实认识的那条旧盟约的名字」，不做模糊替换——例如把 preciShip 换成 arcaneShip，
 * 只把【精准】改成【奥术】，不会碰文案里其他【…】。
 * @returns {{ok:true, oldNames:string[], newNames:string[], changedText:boolean}|{ok:false,reason:string}}
 */
function rebindTraitBond(gid, newId, pos = 0) {
  const g = work.garrisons && work.garrisons[gid];
  if (!g) return { ok: false, reason: '找不到特质 ' + gid };
  const field = traitBondField(g);
  if (!field) return { ok: false, reason: '这条特质的盟约不在 bbStr.bond_id / bbStr.bond 里，不能这样换绑' };
  const one = String(newId || '').trim();
  if (!one) return { ok: false, reason: '请选择要换成的盟约' };
  if (!(work.bonds && work.bonds[one])) return { ok: false, reason: '没有这条盟约：' + one };

  /*
   * 多个盟约时，只替换**指定位置**那一条，其余原样保留。
   * 这样「kjeragShip,arcaneShip」里把第 1 条换成 lateranoShip → 「lateranoShip,arcaneShip」，
   * 不会把第二条一起弄丢。文案按位置换对应的【旧名】→【新名】。
   */
  const oldIds = String(g.bbStr[field] || '').split(',').map((x) => x.trim()).filter(Boolean);
  const i = Math.max(0, Math.min(Number(pos) || 0, oldIds.length - 1));
  const gone = oldIds[i];
  const nextIds = oldIds.slice();
  nextIds[i] = one;
  const oldName = bondName(gone);
  const newName = bondName(one);
  setField('garrisons', gid, 'bbStr.' + field, nextIds.join(','));

  /*
   * 文案同步：只把**这一条**对应的【旧名】换成【新名】。
   * 不做全局模糊替换，避免误伤文案里其它【…】（例如换掉 precisa 时不该动另一处【奥术】）。
   */
  let changed = false;
  for (const key of ['desc', 'descRaw', 'effectDesc', 'effectDescRaw']) {
    let text = g[key];
    if (typeof text !== 'string' || !text) continue;
    let next = text;
    const from = '【' + oldName + '】';
    const to = '【' + newName + '】';
    if (from !== to && next.includes(from)) {
      // 只替换第 (i+1) 次出现，避免多条同名盟约时全被换掉
      let seen = -1;
      next = next.replace(new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), (m2) => {
        seen++;
        return seen === i ? to : m2;
      });
      if (next !== text) changed = true;
    }
    if (next !== text) setField('garrisons', gid, key, next);
  }
  validate();
  return { ok: true, oldNames: [oldName], newNames: [newName], changedText: changed, pos: i, ids: nextIds };
}

/**
 * 「盟约绑定」编辑器。只在特质的盟约确实写在 bbStr 里时出现。
 * 这就是「把【精准】换成【奥术】」的正规入口。
 */
function bondBindBlock(gid, g) {
  const field = traitBondField(g);
  if (!field) return '';
  const ids = String(g.bbStr[field]).split(',').map((x) => x.trim()).filter(Boolean);
  const others = Object.keys(work.bonds || {});
  const nameOf = (id) => (work.bonds[id] ? work.bonds[id].name || id : id + '（不存在）');
  const cntOf = (id) => {
    let n = 0;
    for (const x of Object.values(work.garrisons || {})) {
      const s = String((x.bbStr && (x.bbStr.bond_id || x.bbStr.bond)) || '');
      if (s.split(',').map((y) => y.trim()).includes(id)) n++;
    }
    return n;
  };
  return '<fieldset><legend>盟约绑定 · <code>' + esc(field) + '</code>（这条特质作用于哪条盟约）</legend>'
    + '<p class="hint" style="margin:0 0 8px">数据里写着：<b>' + esc(ids.join(' , ')) + '</b>'
    + '（' + esc(bondNamesOf(ids.join(',')).map((n, i) => '【' + n + '】' + (i === 0 ? '' : '')).join('')) + '）'
    + '　·　文案里出现：' + bondNamesOf(ids.join(',')).filter((n) => String(g.desc || '').includes('【' + n + '】')).map((n) => '【' + n + '】').join('') + '</p>'
    + '<div class="addbox">'
    + (ids.length > 1
      ? '<select id="rebindPos">' + ids.map((id, i) => '<option value="' + i + '">第 ' + (i + 1) + ' 条（' + esc(nameOf(id)) + '）</option>').join('') + '</select>'
      : '')
    + '<select id="rebindPick">' + others.map((id) => '<option value="' + esc(id) + '"' + (ids.includes(id) ? ' selected' : '') + '>'
      + esc(nameOf(id)) + '（' + esc(id) + '） · ' + cntOf(id) + ' 条特质在用</option>').join('') + '</select>'
    + '<button class="tiny primary" id="rebindBtn">换成这条盟约（并同步文案）</button>'
    + '<button class="tiny" id="rebindDescBtn">只把文案里的盟约名改成数据里的</button>'
    + '</div>'
    + '<p class="hint">换绑会改 <code>' + esc(field) + '</code>，并把文案里对应的【旧名】换成【新名】——'
    + '只换这一条的名字，不碰文案里别的【…】、也不动其它条盟约。'
    + (ids.length > 1 ? '这条绑定了 ' + ids.length + ' 条盟约：先选「第几条」，再选换成什么。' : '') + '</p>'
    + '</fieldset>';
}

/** 谁引用了这条盟约（删之前必须让你看清会散出多少悬空引用）。 */
function bondRefs(bondId) {
  const refs = { chess: [], diy: [], traits: [], bondMembers: [] };
  for (const [id, rec] of Object.entries(work.chess || {})) if ((rec.bonds || []).includes(bondId)) refs.chess.push(id);
  const ops = (work.backups && work.backups.diy && work.backups.diy.operators) || {};
  for (const [id, o] of Object.entries(ops)) if ((o.bonds || []).includes(bondId)) refs.diy.push(id);
  for (const [gid, g] of Object.entries(work.garrisons || {})) {
    const s = String((g.bbStr && g.bbStr.bond) || '');
    if (s.split(',').map((x) => x.trim()).includes(bondId)) refs.traits.push(gid);
  }
  for (const [bid, b] of Object.entries(work.bonds || {})) {
    if (bid === bondId) continue;
    if ((b.members || []).includes(bondId)) refs.bondMembers.push(bid);
  }
  return refs;
}
const bondRefCount = (bid) => { const r = bondRefs(bid); return r.chess.length + r.diy.length + r.traits.length + r.bondMembers.length; };

/** 删除一条盟约（带引用预检）。 */
function deleteBond(bondId) {
  const r = bondRefs(bondId);
  const total = r.chess.length + r.diy.length + r.traits.length + r.bondMembers.length;
  if (total) {
    const lines = [
      total + ' 处引用会变成悬空（数据仍在，但指向一条不存在的盟约）：',
      r.chess.length ? '· ' + r.chess.length + ' 条棋子记录的 bonds' : '',
      r.diy.length ? '· ' + r.diy.length + ' 名自选干员的 bonds' : '',
      r.traits.length ? '· ' + r.traits.length + ' 条特质的 bbStr.bond' : '',
      r.bondMembers.length ? '· 其他盟约的成员名单' : '',
      '', '仍然要删除吗？建议先清掉上面这些引用。',
    ].filter(Boolean).join('\n');
    if (!confirm(lines)) return false;
  } else if (!confirm('删除盟约 ' + bondId + '？')) {
    return false;
  }
  const from = JSON.parse(JSON.stringify(work.bonds[bondId]));
  delete work.bonds[bondId];
  log.push({ file: 'bonds', id: bondId, field: '(整条删除)', from, to: null });
  clearIndexCache();
  selected.bonds = null;
  validate(); render();
  toast('已删除盟约 ' + bondId + '（' + total + ' 处引用仍指向它，记得清理）', 5200);
  return true;
}

/**
 * 带中文说明的下拉选择器（用于 effectKey / effectType / eventType 这类枚举字段）。
 *
 * 为什么不用文本框：这些值引擎只认固定的几个，凭空打一个新值 = 特质永远不触发或没有实现，
 * 而且要带着说明才看得懂（43 个 effectKey 光看英文名猜不出干什么）。
 * 「当前值不在清单里」时仍然保留在选项里并标红，这样不会因为选了未知值就丢字段。
 */
/**
 * 三张字段表（effectKey / eventType / effectType）的字典形状并不统一，直接按 [中文, 说明] 读会错位：
 *   EFFECT_KEYS  = { key: ['prep'|'battle', '中文说明'] }  ← 第一格是「阶段」，中文在第二格
 *   EVENT_TYPES  = { key: ['中文', '详细说明'] }
 *   EFFECT_TYPES = { key: '中文说明' }                     ← 纯字符串，没有第二列
 * 统一成 { stage, zh, why } 再排序渲染：否则 effectKey 会把 battle/prep 当成中文显示，
 * effectType 会把说明字符串当数组取 [0]，只留下首字（例如满屏「按 —— …」）。
 */
function enumInfo(v) {
  if (Array.isArray(v)) {
    if (v[0] === 'prep' || v[0] === 'battle') {
      const zh = String(v[1] ?? '');
      return { stage: v[0], zh, why: zh };
    }
    const zh = String(v[0] ?? '');
    return { stage: '', zh, why: String(v[1] ?? zh) };
  }
  const why = String(v ?? '');
  const cut = why.search(/[（(]/);
  const head = cut > 0 ? why.slice(0, cut) : why;
  return { stage: '', zh: head.length > 24 ? head.slice(0, 24) + '…' : head, why };
}

/** 阶段排序权重：备战类在前、战斗类在后，未知阶段排最后（同一批里再按中文排）。 */
function enumStageRank(stage) {
  return stage === 'prep' ? 0 : stage === 'battle' ? 1 : 2;
}

function enumPicker(kind, id, path, label, rec, opts, note = '') {
  const cur = getPath(rec, path);
  const curStr = cur == null ? '' : String(cur);
  const known = opts[curStr];
  const infos = new Map(Object.keys(opts).map((k) => [k, enumInfo(opts[k])]));
  const items = Object.keys(opts).sort((a, b) => {
    const x = infos.get(a), y = infos.get(b);
    return enumStageRank(x.stage) - enumStageRank(y.stage)
      || x.zh.localeCompare(y.zh, 'zh-Hans-CN')
      || a.localeCompare(b);
  });
  const options = [];
  if (curStr && !known) {
    options.push('<option value="' + esc(curStr) + '" selected>⚠ ' + esc(curStr) + '（引擎不认识：不会触发/没有实现）</option>');
  } else if (!curStr) {
    options.push('<option value="" selected>（空）</option>');
  }
  for (const k of items) {
    const { stage, zh } = infos.get(k);
    const prefix = stage === 'prep' ? '【备战】' : stage === 'battle' ? '【战斗】' : '';
    options.push('<option value="' + esc(k) + '"' + (k === curStr ? ' selected' : '')
      + '>' + prefix + esc(zh) + ' —— ' + esc(k) + '</option>');
  }
  // 下拉里只能显示短短一行，完整说明放在选项 title 与下方提示里
  const optionsWithTitle = options.join('').replace(/<option value="([^"]*)"([^>]*)>/g, (mm, v, rest) => {
    const info = infos.get(v);
    return '<option value="' + v + '"' + rest + (info ? ' title="' + esc(info.why) + '"' : '') + '>';
  });
  const changed = log.some((e) => e.file === kind && e.id === id && e.field === path);
  const curInfo = known ? infos.get(curStr) : null;
  return '<label class="f" style="grid-column:1/-1" title="' + esc(path) + '">'
    + '<span>' + esc(label) + '</span>'
    + '<select class="' + (changed ? 'changed' : '') + '" data-path="' + esc(path) + '"' + rootAttr(kind, id, path) + ' data-type="string">'
    + optionsWithTitle + '</select>'
    + (curInfo ? '<span class="hint" style="margin:2px 0 0">' + esc(curInfo.why) + '</span>' : '')
    + (note ? '<span class="hint" style="margin:2px 0 0">' + note + '</span>' : '')
    + '</label>';
}

/**
 * 效果实现的「搭配参考」：把官方数据里出现过的「触发时机 × 实现」组合列出来。
 *
 * 为什么需要：这两个字段是**配对**的——同一族特质要在对应的 eventType 下才成立
 * （「获得时给盟约层数」= SERVER_GAIN + SERVER_ADD_BOND）。自己瞎配对会出现
 * 「面板写得像有效果、实战什么都不发生」。这里直接给官方组合，并高亮当前这条。
 */
function effectCombos(gid) {
  const g = work.garrisons[gid] || {};
  const curKey = g.eventType + '|' + g.effectKey;
  const tally = new Map();
  for (const x of Object.values(work.garrisons || {})) {
    const k = String(x.eventType || '') + '|' + String(x.effectKey || '');
    tally.set(k, (tally.get(k) || 0) + 1);
  }
  const rows = [...tally].sort((a, b) => b[1] - a[1]).map(([k, n]) => {
    const [ev, ek] = k.split('|');
    const evZh = (EVENT_TYPES[ev] || [])[0] || ev;
    const ekZh = (EFFECT_KEYS[ek] || [])[1] || ek;
    const on = k === curKey;
    return '<tr' + (on ? ' style="background:var(--acc-soft)"' : '') + '>'
      + '<td class="k">' + esc(evZh) + (on ? ' <b>←当前</b>' : '') + '</td>'
      + '<td class="k">' + esc(effectKeyLabel(ek)) + ' <code style="font-size:10px">' + esc(ek) + '</code></td>'
      + '<td>' + esc(ekZh) + '</td>'
      + '<td class="k">' + n + ' 条</td></tr>';
  }).join('');
  return '<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">'
    + '搭配参考：官方数据里「触发时机 × 实现」的合法组合（' + tally.size + ' 种，当前这条已高亮）</summary>'
    + '<p class="hint">同一族效果要在<b>对应的触发时机</b>下才成立；乱搭配会「面板好看、实战不触发」。</p>'
    + '<table><thead><tr><th>触发时机</th><th>实现（effectKey）</th><th>作用</th><th>用量</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></details>';
}

/**
 * effectKey → 中文说明（界面统一用它，不要直接显示英文键名）。
 * 未知键返回「英文键（未实现）」，让人一眼看出问题，而不是把英文当标签挂在列表上。
 */
function effectKeyLabel(key) {
  const k = String(key || '');
  if (!k) return '（无 effectKey）';
  const hit = EFFECT_KEYS[k];
  return hit ? hit[1] : k + '（未实现）';
}
/** 同上，但带上英文键名，便于对照。 */
function effectKeyLabelFull(key) {
  const k = String(key || '');
  if (!k) return '（无 effectKey）';
  const hit = EFFECT_KEYS[k];
  return (hit ? hit[1] : '引擎未实现') + '（' + k + '）';
}

function traitForm(gid) {
  const g = work.garrisons[gid];
  if (!g) return '<div class="empty">找不到特质 ' + esc(gid) + '</div>';
  const iss = issuesOf('garrisons', gid);
  const issHtml = iss.length ? `<fieldset><legend>问题</legend><ul class="issues">${iss.map((i) => `<li class="lvl-${i.lvl}"><b>${i.lvl === 'bad' ? '错误' : '提醒'}</b> ${esc(i.m)}</li>`).join('')}</ul></fieldset>` : '';
  const users = garrisonUsers(gid);
  const owners = Array.isArray(g.owners) ? g.owners : [];
  const otherOwners = owners.filter((o) => !users.some((u) => u.where === o));
  const bbKeys = Object.keys(g.bb || {});
  const known = Object.prototype.hasOwnProperty.call(EFFECT_KEYS, g.effectKey || '');
  const pd = traitPairDiff(gid);

  /*
   * 配对对照：两版并排显示，差异一眼可见。
   * 官方数据里大多数配对的数值与文案**本来就不同**（精一 +1 / 精二 +2），那是刻意的，
   * 所以这里不做任何自动同步，只把差异摆出来；要统一时由用户点按钮。
   */
  let pairNotice = '<p class="hint">这条没有配对的另一版本（正常情况应是 <code>_a</code> / <code>_b</code> 成对）。</p>';
  if (pd) {
    const o = work.garrisons[pd.other];
    const keys = [...new Set([...Object.keys(g.bb || {}), ...Object.keys(o.bb || {})])];
    const rows = keys.map((k) => {
      const va = (g.bb || {})[k], vb = (o.bb || {})[k];
      const same = JSON.stringify(va) === JSON.stringify(vb);
      return '<tr><td class="k">' + esc(k) + '</td><td>' + esc(va ?? '—') + '</td><td'
        + (same ? '' : ' style="color:#d29922"') + '>' + esc(vb ?? '—') + '</td>'
        + '<td class="hint">' + (same ? '相同' : '不同') + '</td></tr>';
    }).join('');
    const descA = String(g.desc || '').replace(/\s+/g, ' ').trim();
    const descB = String(o.desc || '').replace(/\s+/g, ' ').trim();
    pairNotice = '<p class="hint">配对：<code>' + esc(gid) + '</code>（' + esc(garrisonVerLabel(gid) || '?') + '） ↔ '
      + '<code>' + esc(pd.other) + '</code>（' + esc(garrisonVerLabel(pd.other) || '?') + '）。'
      + '<b>两版数值/文案本来就常不同</b>（精一 +1 / 精二 +2 是刻意的），所以这里不自动同步，只把差异摆出来。</p>'
      + (keys.length
        ? '<table><thead><tr><th>bb 键</th><th>' + esc(gid) + '</th><th>' + esc(pd.other) + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p class="hint">两版都没有 bb 数值。</p>')
      + '<table><thead><tr><th>文案</th><th>内容</th></tr></thead><tbody>'
      + '<tr><td class="k">' + esc(gid) + '</td><td>' + esc(descA.slice(0, 80)) + '</td></tr>'
      + '<tr><td class="k">' + esc(pd.other) + '</td><td>' + (pd.textDiff ? '<b style="color:#d29922">' : '') + esc(descB.slice(0, 80)) + (pd.textDiff ? '</b>' : '') + '</td></tr>'
      + '</tbody></table>'
      + '<div class="addbox">'
      + '<button class="tiny" id="copyTextToPair">把这条的文案复制到 ' + esc(pd.other) + '</button> '
      + '<button class="tiny" id="syncPairRow">把整条（含 bb）复制到 ' + esc(pd.other) + '</button>'
      + '</div>';
  }

  return '<h2>' + esc(String(g.desc || gid).split('\n')[0].slice(0, 60)) + '</h2>'
    + '<div class="sub">' + esc(gid) + ' · ' + esc(garrisonVerLabel(gid) || '无版本标记') + ' · '
    + esc(g.eventType || '') + ' · ' + esc(g.effectType || '') + ' · ' + owners.length + ' 名拥有者</div>'
    + issHtml
    + '<fieldset><legend>配对与影响面</legend>'
    + pairNotice
    + (users.length
      ? '<div class="addbox" style="border-left:3px solid #b8860b;padding-left:8px"><span class="hint" style="margin:0"><b>共用</b>：'
        + users.length + ' 条棋子记录携带它（' + esc(users.slice(0, 5).map((u) => u.name).join('、'))
        + (users.length > 5 ? '…' : '') + '）。改数值或文案会一起变。</span></div>'
      : '<p class="hint">没有棋子携带这条特质（可能是待配的模板）。</p>')
    + '<div class="addbox"><button class="tiny" data-numg="' + esc(gid) + '">按 bb 数值重写本文案</button></div>'
    + '</fieldset>'
    + bondPairsBlock(gid, g)
    + bondBindBlock(gid, g)
    + '<fieldset><legend>效果实现（三个字段都带中文对照）</legend><div class="grid">'
    + enumPicker('garrisons', gid, 'effectKey', 'effectKey —— 引擎用哪个实现（决定「做什么」）', g, EFFECT_KEYS,
        '<b>这是唯一决定行为的关键</b>：注册键就是 <code>garrison:&lt;effectKey&gt;</code>。')
    + enumPicker('garrisons', gid, 'eventType', 'eventType —— 什么时候触发', g, EVENT_TYPES,
        '不在清单里的值会被引擎直接跳过（永不触发）。<code>IN_BATTLE</code> 走战斗内的另一条路。')
    + enumPicker('garrisons', gid, 'effectType', 'effectType —— 分类标签（一般不用改）', g, EFFECT_TYPES,
        '多数情况下与 effectKey 同名；改它通常不改行为，改 effectKey 才换实现。')
    + textField('garrisons', gid, 'bbStr.bond_id', 'bbStr.bond_id（这条特质影响的盟约，逗号分隔）', g)
    + '</div>'
    + '<p class="hint">' + (known
      ? '当前：<b>' + esc((EFFECT_KEYS[g.effectKey] || [])[1] || '') + '</b>'
      : '<span style="color:#f85149">这个 effectKey 引擎没有实现，特质不会生效。</span>')
    + '</p>'
    + effectCombos(gid)
    + '</fieldset>'
    + '<fieldset><legend>文案（游戏渲染 descRaw，改 desc 会同步）</legend><div class="grid">'
    + textField('garrisons', gid, 'desc', 'desc（纯文本）', g, { area: true, full: true, rows: 3 })
    + textField('garrisons', gid, 'descRaw', 'descRaw（界面真正显示的那份，含官方彩色标记）', g, { area: true, full: true, rows: 3 })
    + '</div></fieldset>'
    + '<fieldset><legend>数值 bb（' + bbKeys.length + ' 个）</legend>'
    + (bbKeys.length ? '<div class="grid">' + bbKeys.map((k) => numField('garrisons', gid, 'bb.' + k, 'bb.' + k, g)).join('') + '</div>' : '<p class="hint">没有 bb 数值。</p>')
    + '<div class="addbox"><input data-addbb placeholder="新 bb 键名" style="max-width:220px"><button class="tiny" data-addbbbtn>加一个数值键</button></div>'
    + '</fieldset>'
    + '<fieldset><legend>拥有者 owners（' + owners.length + '）</legend>'
    + '<p class="hint">判定只看干员侧的 garrisonIds，owners 仅供参考。'
    + (otherOwners.length ? 'owners 里有 ' + otherOwners.length + ' 条没有对应的棋子记录（可能是待配）。' : '')
    + '</p>'
    + idList('garrisons', gid, 'owners', 'owners', g, 'chess', '要真正给某名干员加这条特质，请去他的干员页改 garrisonIds。')
    + '</fieldset>';
}

/* ---- 特质页的渲染 ---- */

function traitIds() {
  return Object.keys(work.garrisons || {}).sort((a, b) => a.localeCompare(b, 'zh'));
}

function traitFiltered(q) {
  return traitIds().filter((gid) => {
    if (!q) return true;
    const g = work.garrisons[gid] || {};
    const owners = (g.owners || []).join(' ');
    return [gid, g.desc, g.descRaw, g.effectKey, g.eventType, owners, Object.keys(g.bb || {}).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
}

function renderTrait(main) {
  const sig = 'trait|' + traitIds().length;
  const shell = main.querySelector('.list');
  if (!(shell && main.dataset.sig === sig)) {
    main.dataset.sig = sig;
    main.innerHTML = [
      '<div class="list">',
        '<div class="tools">',
          '<span style="font-size:12px;color:var(--dim)">全部特质</span>',
          '<span id="qCount" class="numchip"></span>',
        '</div>',
        '<div class="tools row2">',
          '<input type="search" id="q" placeholder="搜 id / 文案 / effectKey / bb 键 / 拥有者" value="' + esc(state.q) + '">',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="detail"></div>',
    ].join('');
    const qi = $('#q');
    qi.addEventListener('input', () => { state.q = qi.value; paintTraitRows(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintTraitRows(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintTraitRows(); } });
    qi.focus();
    try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  }
  paintTraitRows();
}

function paintTraitRows() {
  resetDatalists();
  if (activeTab === 'garrisons') pageCtx = selected.garrisons ? { traitPage: true, id: selected.garrisons } : null;
  const q = state.q.trim().toLowerCase();
  const ids = traitFiltered(q);
  if (!ids.includes(selected.garrisons)) selected.garrisons = ids[0] || null;

  const rows = $('#rows');
  if (rows) {
    const cur = selected.garrisons;
    const keepScroll = rows.scrollTop || 0;
    rows.innerHTML = ids.length ? ids.map((gid) => {
      const g = work.garrisons[gid] || {};
      const users = garrisonUsers(gid);
      const iss = issuesOf('garrisons', gid);
      const ver = garrisonVerLabel(gid);
      return '<div class="row ' + (gid === cur ? 'on' : '') + '" data-gid="' + esc(gid) + '">'
        + (touched('garrisons', gid) ? '<span class="dot" title="已修改"></span>' : '')
        + '<span class="t">' + esc(String(g.desc || gid).split('\n')[0].slice(0, 24))
        + (ver ? ' <span class="chip" style="font-size:10px">' + esc(ver) + '</span>' : '')
        + (iss.length ? ' <span class="lvl-' + iss[0].lvl + '">●</span>' : '') + '</span>'
        + '<span class="sub" title="' + esc(gid + ' · ' + effectKeyLabelFull(g.effectKey)) + '">'
        + esc(gid.replace(/^garrison_/, '')) + ' · ' + esc(effectKeyLabel(g.effectKey))
        + (users.length > 1 ? ' · 共用 ' + users.length + ' 名' : (users.length ? ' · 1 名' : ' · 无携带者')) + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">没有匹配的特质</div>';
    if (keepScroll) rows.scrollTop = keepScroll;
    for (const el of rows.querySelectorAll ? (rows.querySelectorAll('[data-gid]') || []) : []) {
      el.addEventListener('click', () => { selected.garrisons = el.dataset.gid; paintTraitRows(); });
    }
  }
  const qcEl = $('#qCount');
  if (qcEl) {
    const total = traitIds().length;
    qcEl.textContent = q ? ids.length + ' / ' + total : total + ' 条';
  }

  const detail = $('#detail');
  if (!detail) return;
  const cur = selected.garrisons;
  if (!cur || !work.garrisons[cur]) { detail.innerHTML = '<div class="empty">从左侧选一条特质</div>'; return; }
  const sameRecord = detail.dataset.rec === cur;
  const keepDetail = sameRecord ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = cur;
  detail.innerHTML = traitForm(cur);
  wireForm('garrisons', cur);
  detail.scrollTop = keepDetail;
  syncTitle();
}

function diyForm(charId) {
  const t = diyTab();
  const r = t[charId];
  if (!r) return '<div class="empty">找不到 ' + esc(charId) + '</div>';
  const op = r.op || {};
  const un = r.un || {};
  const iss = issuesOf('backups', charId);
  const issHtml = iss.length ? `<fieldset><legend>这条记录的问题</legend><ul class="issues">${iss.map((i) => `<li class="lvl-${i.lvl}"><b>${i.lvl === 'bad' ? '错误' : '提醒'}</b> ${esc(i.m)}</li>`).join('')}</ul></fieldset>` : '';
    // 同上：路径相对合成记录（op / un），写入由 diySet 负责真实位置
    const P = (p) => p;
  const name = op.name || un.name || charId;

  const formBlocks = Object.entries(un.forms || {}).map(([key, f]) => {
    const stats = f.stats || {};
    const extra = Object.keys(f).filter((k) => k !== 'stats' && k !== 'status');
    return '<fieldset><legend>战斗数值 · 档位 <code>' + esc(key) + '</code>'
      + (key === '2/1/4/0' ? '（普通）' : key === '2/60/7/3' ? '（精锐）' : '') + '</legend>'
      + '<div class="grid">'
      + Object.keys(stats).map((k) => numField('backups', charId, P('un.forms.' + key + '.stats.' + k), k, t[charId])).join('')
      + '</div>'
      + '<p class="hint">这是引擎与专属 kit（<code>server/sim/content/kits/ops/</code>）真正读取的数值，改动直接影响对局强度。</p>'
      + (extra.length
        ? '<details><summary class="hint">该档位还有：' + esc(extra.join('、')) + '</summary><pre class="hint" style="max-height:220px;overflow:auto">'
          + esc(JSON.stringify(Object.fromEntries(extra.map((k) => [k, f[k]])), null, 1)) + '</pre></details>'
        : '')
      + '</fieldset>';
  }).join('');

  const poolRows = DIY_SECTIONS.filter((s) => s.key !== 'operators').map((s) => {
    if (s.key === 'ownedPool' || s.key === 'excluded') {
      const arr = (work.backups.diy && work.backups.diy[s.key]) || [];
      const inIt = arr.includes(charId);
      return '<tr><td>' + esc(s.label) + '</td><td class="k">' + arr.length + ' 名</td><td>'
        + (inIt ? '<button class="tiny" data-poolrm="' + esc(s.key) + '">移出</button>'
                : '<button class="tiny" data-pooladd="' + esc(s.key) + '">加入</button>')
        + '</td></tr>';
    }
    if (s.key === 'prototypes') {
      return Object.keys(work.backups.diy.prototypes || {}).sort().map((tier) => {
        const arr = work.backups.diy.prototypes[tier] || [];
        const inIt = arr.includes(charId);
        return '<tr><td>' + esc(s.label) + ' · ' + esc(tier) + ' 星</td><td class="k">' + arr.length + ' 名</td><td>'
          + (inIt ? '<button class="tiny" data-poolrm="prototypes.' + esc(tier) + '">移出</button>'
                  : '<button class="tiny" data-pooladd="prototypes.' + esc(tier) + '">加入</button>')
          + '</td></tr>';
      }).join('');
    }
    return Object.keys(work.backups.diy.locked || {}).sort().map((tier) => {
      const rec = work.backups.diy.locked[tier] && work.backups.diy.locked[tier][charId];
      return '<tr><td>' + esc(s.label) + ' · ' + esc(tier) + ' 星</td><td class="k">'
        + (rec ? '技能 ' + esc(rec.skillIndex ?? '—') + (rec.uniEquipId ? ' · ' + esc(rec.uniEquipId) : ' · 无模组') : '未锁定')
        + '</td><td>'
        + (rec ? '<button class="tiny" data-lockdel="' + esc(tier) + '">解除</button>'
               : '<button class="tiny" data-lockadd="' + esc(tier) + '">加入</button>')
        + '</td></tr>';
    }).join('');
  }).join('');

  return `<h2>${esc(name)}</h2>
    <div class="sub">${esc(charId)} · 自选（甄选干员）· ${esc(op.rarity || un.rarity || '?')}★ · ${esc(un.subProfessionName || op.profession || '')}</div>
    ${issHtml}
    <fieldset><legend>面板字段（backups.json → diy.operators）</legend><div class="grid">
      ${textField('backups', charId, P('op.name'), '名字 name', t[charId])}
      ${numField('backups', charId, P('op.rarity'), '星级 rarity', t[charId])}
      ${textField('backups', charId, P('op.profession'), '职业 profession', t[charId])}
      ${textField('backups', charId, P('op.subProfessionId'), '子职业 subProfessionId', t[charId])}
    </div>
    <p class="hint">这里只影响自选界面显示；战斗数值在下面的档位里。</p>
    </fieldset>
    <fieldset><legend>势力 powers / 盟约 bonds</legend>
      ${idList('backups', charId, P('op.powers'), `powers（势力，${(op.powers || []).length} 个）`, t[charId], null,
        '势力的汇总（官方数据里的 nationId 国家 / groupId 阵营组 / teamId 队伍）。'
        + '<b>引擎不读它</b>：它只是构建时用来推导 bonds 的输入，改它当前没有效果。常见值如 rhodes 罗德岛、sui 岁、yan 炎。')}
      ${idList('backups', charId, P('op.bonds'), `bonds（盟约，${(op.bonds || []).length} 个）`, t[charId], 'bonds',
        '<b>这才是引擎真正读的</b>（bondsMeta「Membership = the chess\'s own bonds」）：它决定这名干员算哪些盟约的成员。'
        + '改完保存、刷新页面即可看到新的盟约条。但注意：以后重建数据（build-data）会按 powers 把它重算回去，想长期保留请用「改动」页的补丁脚本。')}
      ${diyDeriveBlock(op.powers, op.bonds)}
    </fieldset>
    <fieldset><legend>名单与锁定（backups.json → diy.*）</legend>
      <table><thead><tr><th>名单</th><th>当前</th><th>操作</th></tr></thead><tbody>${poolRows}</tbody></table>
      <p class="hint">ownedPool = 可选的六星池；prototypes = 自选槽的原型池（按星级分档）；excluded = 排除；locked = 该槽位锁定的技能与模组。</p>
    </fieldset>
    ${formBlocks || '<fieldset><legend>战斗数值</legend><p class="hint">backups.json 的 units 里没有这名干员的记录，没有可编辑的数值。</p></fieldset>'}`;
}

/**
 * 刷新「壳」上的状态：标题、保存/补丁按钮上的计数、以及把当前定位存起来。
 * renderBadges 每次改动与渲染都会走一遍，所以这里就够，别在多处重复调用。

function refreshChrome() {
  try {

/* ---------- 三张新表共用的「左列表 + 右详情」引擎 ----------
 * 不做三份实现：同一份 UI 两份代码一定会分叉（recordForm 与 traitForm 就是前车之鉴）。
 * 每张表只提供：id 列表、搜索命中、行文本、详情 HTML。
 */
const LIST_TABS = {
  items: {
    ids: () => itemIds(),
    match: (id, q) => itemHay(id).includes(q),
    row: (id) => itemRow(id),
    detail: (id) => itemForm(id),
    empty: '从左侧选一件道具',
    noMatch: '没有匹配的道具',
    search: '搜 名字 / 文案 / 效果键 / bb 键 / 盟约 / effectId',
  },
  choices: {
    ids: () => cardIds(),
    match: (id, q) => cardHay(id).includes(q),
    row: (id) => cardRow(id),
    detail: (id) => cardForm(id),
    empty: '从左侧选一张卡',
    noMatch: '没有匹配的卡片',
    search: '搜 卡名 / 文案 / effectId / 敌人 id',
  },
  effects: {
    ids: () => effectIds(),
    match: (id, q) => effectHay(id).includes(q),
    row: (id) => effectRow(id),
    detail: (id) => effectForm(id),
    empty: '从左侧选一条效果',
    noMatch: '没有匹配的效果',
    search: '搜 effectId / 名字 / 文案 / 使用者 / 符文键',
  },
};

function renderListTab(main, key) {
  const cfg = LIST_TABS[key];
  main.innerHTML = [
    '<div class="list">',
      '<div class="tools">',
        '<span class="tabtitle">' + esc(TAB_TITLE[key] || key) + '</span>',
        '<span class="spacer"></span>',
        '<span id="qCount" class="numchip"></span>',
      '</div>',
      '<div class="tools row2">',
        '<input type="search" id="q" placeholder="' + esc(cfg.search) + '" value="' + esc(state.q) + '">',
      '</div>',
      '<div class="scroll" id="rows"></div>',
    '</div>',
    '<div class="detail" id="detail"></div>',
  ].join('');
  const qi = $('#q');
  qi.addEventListener('input', () => { state.q = qi.value; paintListTab(key); });
  qi.addEventListener('compositionstart', () => { state.composing = true; });
  qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintListTab(key); });
  qi.addEventListener('keydown', (e) => { if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintListTab(key); } });
  qi.focus();
  try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  paintListTab(key);
}

function paintListTab(key) {
  const cfg = LIST_TABS[key];
  resetDatalists();
  if (ROOT_KINDS.has(key)) pageCtx = { rootKind: true, id: selected[key] };
  const q = state.q.trim().toLowerCase();
  const all = cfg.ids();
  const ids = q ? all.filter((id) => cfg.match(id, q)) : all;
  if (!ids.includes(selected[key])) selected[key] = ids[0] || null;

  const rows = $('#rows');
  if (rows) {
    const keep = rows.scrollTop || 0;
    let lastGroup = null;
    rows.innerHTML = ids.length ? ids.map((id) => {
      const r = cfg.row(id);
      let head = '';
      if (r.group && r.group !== lastGroup) {
        lastGroup = r.group;
        head = '<div style="padding:8px 10px 4px;font:11px var(--mono);letter-spacing:.04em;color:var(--dim)">' + esc(r.group) + '</div>';
      }
      return head + '<div class="row ' + (id === selected[key] ? 'on' : '') + '" data-id="' + esc(id) + '">'
        + (touched(key, id) ? '<span class="dot" title="已修改"></span>' : '')
        + '<span class="t">' + esc(r.title)
        + (r.chip ? ' <span class="chip" style="font-size:10px">' + esc(r.chip) + '</span>' : '')
        + (r.level ? ' <span class="lvl-' + r.level + '">●</span>' : '') + '</span>'
        + '<span class="sub"' + (r.subTitle ? ' title="' + esc(r.subTitle) + '"' : '') + '>' + esc(r.sub || '') + '</span></div>';
    }).join('') : '<div class="hint" style="padding:10px">' + esc(cfg.noMatch) + '</div>';
    if (keep) rows.scrollTop = keep;
    for (const el of rows.querySelectorAll('[data-id]')) {
      el.addEventListener('click', () => { selected[key] = el.dataset.id; state.q = state.q; paintListTab(key); });
    }
  }
  const qc = $('#qCount');
  if (qc) qc.textContent = q ? ids.length + ' / ' + all.length : all.length + ' 条';

  const detail = $('#detail');
  if (!detail) return;
  const cur = selected[key];
  if (!cur) { detail.innerHTML = '<div class="empty">' + esc(cfg.empty) + '</div>'; return; }
  const same = detail.dataset.rec === cur;
  const keepD = same ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = cur;
  detail.innerHTML = cfg.detail(cur);
  wireForm(key, cur);
  detail.scrollTop = keepD;
  syncTitle();
}

const TAB_TITLE = {
  items: '道具', choices: '悬赏 · 战术卡', effects: '效果',
};

/* ---------- 效果实现（buffs[] + params）的共用编辑块 ---------- */

/** 把词典换成 enumPicker 要的形状：{key: [中文, 说明]}（说明里带上阶段与源码出处）。 */
const withWhy = (dict, fn) => Object.fromEntries(Object.entries(dict).map(([k, v]) => [k, fn(v)]));
const BUFF_KEY_VIEW = () => withWhy(BUFF_KEY_ZH, (v) => [v[0], (v[1] && v[1] !== '未知' ? '阶段：' + v[1] : '阶段：未知') + (v[2] ? ' · 出处 ' + v[2] : ' · 源码里没有处理者')]);
const RUNE_VIEW = () => withWhy(RUNE_ZH, (v) => [v[0], v[1] ? '出处 ' + v[1] : '（没找到出处）']);

/** 这条 buff 有没有问题：没处理者的 key、没认出来的符文、空的 bbStr.key。 */
function buffIssues(b) {
  const out = [];
  const key = String((b && b.key) || '');
  const rune = String((b && b.bbStr && b.bbStr.key) || '');
  if (!key) out.push({ lvl: 'warn', m: '没有 key：引擎不会处理这条 buff' });
  else if (!BUFF_KEY_ZH[key]) out.push({ lvl: 'bad', m: 'key「' + key + '」在源码里没有备战期处理者：写了也不会触发' });
  if (rune && !RUNE_ZH[rune]) out.push({ lvl: 'warn', m: 'bbStr.key「' + rune + '」不是已知的战斗符文键：战斗侧不会按它结算' });
  if (!rune && key && /gbuff|char_dynamic/.test(key)) out.push({ lvl: 'warn', m: '这类 buff 靠 bbStr.key 决定做什么，空的符文键等于没有效果' });
  return out;
}

/**
 * buffs[] 编辑块 —— 三张新表共用。
 *
 * 为什么按「一条 buff 一个框」摆：buffs 是数组，同一件道具常常有 2~3 条（属性一条、特殊效果一条），
 * 每条各有自己的 key / countType / 符文 / 数值。平铺成一张表就分不清哪个数值属于哪条。
 */
function buffEditor(kind, id, rec, opts = {}) {
  const buffs = Array.isArray(rec.buffs) ? rec.buffs : [];
  const blocks = buffs.map((b, i) => buffBlock(kind, id, rec, b, i));
  const notes = opts.notes ? '<p class="hint">' + opts.notes + '</p>' : '';
  return '<fieldset><legend>效果实现 buffs（' + buffs.length + ' 条）</legend>'
    + notes
    + (buffs.length ? blocks.join('') : '<p class="hint">这条记录没有任何 buff —— 引擎不会为它做任何事。</p>')
    + '<div class="addbox">'
    + '<button class="tiny" data-buffadd="1">＋ 新增一条 buff（先给个骨架，再逐项改）</button>'
    + '</div>'
    + '<p class="hint">真正跑起来的是这里：战斗侧按每条 buff 的 <b>bbStr.key</b> 找符文实现，数值取 <b>bb</b>；'
    + '备战侧内置效果按 <b>key</b> 找处理器、数值取下面的 <b>params</b>。</p>'
    + '</fieldset>';
}

function buffBlock(kind, id, rec, b, i) {
  const bb = (b && b.bb) || {};
  const bbStr = (b && b.bbStr) || {};
  const strKeys = Object.keys(bbStr).filter((k) => k !== 'key');
  const iss = buffIssues(b);
  const key = String((b && b.key) || '');
  const rune = String(bbStr.key || '');
  const head = 'buff #' + i + ' ｜ ' + buffKeyZh(key) + (rune ? ' × ' + rune.replace(/^(act\d[a-z]*autochess_|at[tr]ic_)/, '') : '');
  return '<fieldset style="margin:10px 0 0;background:rgba(127,127,127,.04)">'
    + '<legend title="' + esc(head) + '">' + esc(head) + '</legend>'
    + (iss.length ? '<ul class="issues" style="margin:0 0 6px">' + iss.map((x) => '<li class="lvl-' + x.lvl + '"><b>' + (x.lvl === 'bad' ? '错误' : '提醒') + '</b> ' + esc(x.m) + '</li>').join('') + '</ul>' : '')
    + '<div class="grid">'
    + enumPicker(kind, id, 'buffs.' + i + '.key', 'key —— 备战期处理器（决定备战期做什么）', rec, BUFF_KEY_VIEW())
    + enumPicker(kind, id, 'buffs.' + i + '.countType', 'countType —— 记不记次数', rec, COUNT_TYPE_ZH)
    + enumPicker(kind, id, 'buffs.' + i + '.bbStr.key', 'bbStr.key —— 战斗内符文（战斗侧按它找实现）', rec, RUNE_VIEW())
    + '</div>'
    + '<div class="grid" style="margin-top:6px">'
    + Object.keys(bb).map((k) => numField(kind, id, 'buffs.' + i + '.bb.' + k, 'bb.' + k, rec)).join('')
    + '</div>'
    + (strKeys.length ? '<div class="grid" style="margin-top:6px">'
      + strKeys.map((k) => textField(kind, id, 'buffs.' + i + '.bbStr.' + k,
        'bbStr.' + k + '（' + bbstrZh(k) + '）', rec)).join('') + '</div>' : '')
    + '<div class="addbox">'
    + '<input data-newkey="buffs.' + i + '.bb" placeholder="新数值键（如 max_cnt）" style="max-width:190px">'
    + '<button class="tiny" data-newkeybtn="buffs.' + i + '.bb">＋ 数值键</button>'
    + '<input data-newkey="buffs.' + i + '.bbStr" placeholder="新引用键（如 other_equip）" style="max-width:190px">'
    + '<button class="tiny" data-newkeybtn="buffs.' + i + '.bbStr">＋ 引用键</button>'
    + '<button class="tiny del" data-buffdel="' + i + '" title="删掉整条 buff">删除这条 buff</button>'
    + '</div>'
    + (key && BUFF_KEY_ZH[key] ? '<p class="hint">' + esc(BUFF_KEY_ZH[key][0]) + (buffKeySrc(key) ? '　<b>源码：</b><code>' + esc(buffKeySrc(key)) + '</code>' : '') + '</p>' : '')
    + '</fieldset>';
}

/**
 * buffs → 扁平 params。
 *
 * 口径必须与构建管线一致：tools/build-data.mjs 的 effectParams() 是 **first occurrence wins**
 * （`if (!(k in params)) params[k] = v`），所以这里也是「先出现者胜出」。写反了会让重建出来的
 * params 与官方管线不一致——例如蒸汽之心两条 buff 各有一个 attack_speed(30/35)，官方只留 30。
 */
function foldParams(buffs) {
  const flat = {};
  const dup = [];
  for (const b of Array.isArray(buffs) ? buffs : []) {
    for (const [k, v] of Object.entries({ ...(b && b.bb ? b.bb : {}), ...(b && b.bbStr ? b.bbStr : {}) })) {
      if (Object.prototype.hasOwnProperty.call(flat, k)) {
        if (JSON.stringify(flat[k]) !== JSON.stringify(v)) dup.push(k + '（留下 ' + fmt(flat[k]) + '，丢掉 ' + fmt(v) + '）');
        continue;                       // 先出现者胜：后面的同名键一律不覆盖
      }
      flat[k] = v;
    }
  }
  return { flat, dup: [...new Set(dup)] };
}

/**
 * params 同步块。
 *
 * 为什么必须有：同一件道具的数值有两份落地形态 ——
 *   buffs[].bb / .bbStr 是战斗侧（support.buffsOf）与内容覆盖实现读的；
 *   params 是**扁平表**，引擎内置的备战期效果（builtinMeta 的 rec.params）读它。
 * 只改一处就会出现「面板写着 +30%，实际还是 +15%」。而且扁平化会吞掉重名键（如两条都用 attack_speed）。
 */
function paramsSyncBlock(kind, id, rec) {
  const { flat, dup } = foldParams(rec.buffs);
  const cur = (rec.params && typeof rec.params === 'object') ? rec.params : {};
  const keys = [...new Set([...Object.keys(flat), ...Object.keys(cur)])].sort();
  const diff = keys.filter((k) => JSON.stringify(flat[k]) !== JSON.stringify(cur[k]));
  const rows = diff.map((k) => '<tr><td class="k">' + esc(k) + '</td><td>' + esc(fmt(cur[k])) + '</td><td><b>' + esc(fmt(flat[k])) + '</b></td></tr>').join('');
  return '<fieldset><legend>params（引擎内置备战效果的扁平数值表）</legend>'
    + '<p class="hint">params = 把所有 buff 的 bb 与 bbStr 按顺序摊平。改 buffs 不会自动改 params，'
    + '而「装备时销毁、给资金」这类内置效果读的正是 params —— 两边不一致时，面板与实际表现会不一样。</p>'
    + (diff.length
      ? '<table><thead><tr><th>键</th><th>现在的 params</th><th>按 buffs 算出来</th></tr></thead><tbody>' + rows + '</tbody></table>'
        + '<div class="addbox"><button class="tiny" data-paramsync="1">按 buffs 重建 params（' + diff.length + ' 处差异）</button></div>'
      : '<p class="hint">✅ 现在与 buffs 完全一致。</p>')
    + (dup.length ? '<p class="hint" style="color:#d29922">注意：这些键在 buffs 里出现了不止一次，官方管线摊平时<b>先出现者胜</b>（'
      + esc(dup.join('；')) + '）。战斗侧按每条 buff 分别读，所以战斗里不受影响；但内置备战效果只会看到留下的那个值。</p>' : '')
    + '</fieldset>';
}

/* ---------- 跨表引用：道具/卡/盟约 ↔ 效果记录 ---------- */

/** items.json / bands.json / bonds.json / 卡 里引用的效果记录。 */
const effectOf = (eid) => (eid && work.effects ? work.effects[eid] : null);

/** 一条效果被哪些记录的 effectId 引用（卡牌、道具、盟约，外加只读的策略）。 */
function effectOwners(eid) {
  const out = [];
  if (!eid) return out;
  const eq = (x) => x && x.effectId === eid;
  for (const [id, rec] of Object.entries(work.items || {})) if (eq(rec)) out.push({ tab: 'items', id, label: (rec.name || id) + '（' + id + '）', kind: '道具' });
  const cards = (work.choices && work.choices.cards) || {};
  for (const [list, arr] of Object.entries(cards)) {
    if (!Array.isArray(arr)) continue;
    arr.forEach((c, i) => { if (eq(c)) out.push({ tab: 'choices', id: list + '.' + i, label: (c.name || '(无名)') + ' · ' + (list === 'bounty' ? '悬赏' : '战术'), kind: '卡牌' }); });
  }
  for (const [id, rec] of Object.entries(work.bonds || {})) if (eq(rec)) out.push({ tab: 'bonds', id, label: (rec.name || id) + '（' + id + '）', kind: '盟约' });
  for (const [id, rec] of Object.entries(aux.bands || {})) if (eq(rec)) out.push({ tab: null, id, label: (rec.name || id) + '（' + id + '）', kind: '策略' });
  return out;
}

/** 「谁在用这条效果」区块（效果页用）。 */
function effectOwnersBlock(eid) {
  const own = effectOwners(eid);
  return '<fieldset><legend>谁在用这条效果（' + own.length + '）</legend>'
    + (own.length
      ? '<ul class="issues" style="margin:0">' + own.map((o) => '<li><b>' + esc(o.kind) + '</b> '
        + (o.tab ? '<a href="#" data-goto="' + esc(o.tab) + '" data-goto-id="' + esc(o.id) + '" style="color:var(--accent,#4aa3ff)">' + esc(o.label) + ' →</a>'
          : esc(o.label)) + '</li>').join('') + '</ul>'
      : '<p class="hint">没有任何记录引用它（可能是废弃条目，或只被数据管线使用）。</p>')
    + '</fieldset>';
}

/** 道具/卡牌一侧看到的「对应的效果记录」（1:1 镜像，运行时对道具不读它）。 */
function effectMirrorBlock(kind, id, rec) {
  const eid = rec.effectId;
  const eff = effectOf(eid);
  if (!eid) return '<fieldset><legend>对应的效果记录</legend><p class="hint">这条记录没有 effectId。</p></fieldset>';
  if (!eff) {
    return '<fieldset><legend>对应的效果记录</legend><p class="hint" style="color:#d29922">effectId「' + esc(eid)
      + '」在 effects.json 里找不到（如果只加载了部分文件就可能这样；否则是悬空引用）。</p></fieldset>';
  }
  const sameBuffs = JSON.stringify(eff.buffs) === JSON.stringify(rec.buffs);
  const sameParams = JSON.stringify(eff.params) === JSON.stringify(rec.params);
  const sameDesc = String(eff.descRaw || eff.desc || '') === String(rec.descRaw || rec.desc || '');
  return '<fieldset><legend>对应的效果记录 ' + esc(eid) + '</legend>'
    + '<p class="hint">这是 effects.json 里的 <b>' + esc(effectTypeZh(eff.effectType)) + '</b> 记录，与这条记录是 1:1 的镜像关系。'
    + '运行时：<b>道具</b>读自己这份 buffs / params；<b>悬赏卡与战术卡</b>的展示文案会回退到效果记录的 descRaw。</p>'
    + '<ul class="issues" style="margin:0 0 6px">'
    + '<li class="lvl-' + (sameBuffs ? 'ok' : 'warn') + '">buffs：' + (sameBuffs ? '与效果记录一致' : '与效果记录<b>不一致</b>') + '</li>'
    + '<li class="lvl-' + (sameParams ? 'ok' : 'warn') + '">params：' + (sameParams ? '一致' : '<b>不一致</b>') + '</li>'
    + '<li class="lvl-' + (sameDesc ? 'ok' : 'warn') + '">文案：' + (sameDesc ? '一致' : '<b>不一致</b>') + '</li>'
    + '</ul>'
    + '<div class="addbox">'
    + '<button class="tiny" data-goto="effects" data-goto-id="' + esc(eid) + '">去效果页看它 →</button>'
    + '<button class="tiny" data-pushmirror="1" title="把这条记录的 buffs / params / desc / descRaw 覆盖到效果记录">同步到效果记录 →</button>'
    + '<button class="tiny" data-pullmirror="1" title="反过来，把效果记录的这些字段拿回来">← 从效果记录拉回</button>'
  + '</div></fieldset>';
}

/* ---------- 道具页（data/items.json） ---------- */

const itemPairKey = (id) => String(id).replace(/_[ab]$/, '');
function itemVerLabel(id) {
  if (/_b$/.test(String(id))) return '精二（精锐）';
  if (/_a$/.test(String(id))) return '精一';
  return '单版';
}
function itemIds() {
  return Object.keys(work.items || {}).sort((a, b) => {
    const A = work.items[a] || {}, B = work.items[b] || {};
    return (A.tier || 0) - (B.tier || 0)
      || String(A.name || a).localeCompare(String(B.name || b), 'zh')
      || String(a).localeCompare(String(b));
  });
}
function itemHay(id) {
  const r = work.items[id] || {};
  const { dup } = foldParams(r.buffs);
  return [id, r.name, r.desc, r.descRaw, r.effectId, r.category, r.kind, r.giveBondId, r.requiresBondId,
    r.implFormula, r.note, r.flavor, Object.keys(dup).join(' '),
    (r.buffs || []).map((b) => (b.key || '') + ' ' + ((b.bbStr && b.bbStr.key) || '') + ' ' + Object.keys(b.bb || {}).join(',')).join(' '),
    Object.keys(r.params || {}).join(' ')].join(' ').toLowerCase();
}
function itemRow(id) {
  const r = work.items[id] || {};

  const vers = itemVerLabel(id);
  const cat = ITEM_CATEGORY_ZH[r.category] ? ITEM_CATEGORY_ZH[r.category][0] : (r.category || '');
