    title: (r.name || id) + ' 「' + String(r.desc || '').split('\n')[0].slice(0, 26) + '」',
    chip: vers || null,
    level: iss.length ? iss[0].lvl : null,

}

/* ---------- 悬赏 · 战术卡页（data/choices.json 的 cards.bounty / cards.tactic） ---------- */

/**
 * 卡牌记录在 choices.json 里的位置是**数组下标**：cards.bounty.3 / cards.tactic.12。
 * 所以 id 不是「键名」而是「从文档根出发的路径」（ROOT_KINDS 里的 root-rel 布局）。
 * 注意：数组插删会让后面的序位整体前移 —— 本编辑器**只改字段、不插删卡**，避免把你已有的序位打乱。
 */
function cardTable() {
  const cards = (work.choices && work.choices.cards) || {};

    bounty: Array.isArray(cards.bounty) ? cards.bounty : [],
    tactic: Array.isArray(cards.tactic) ? cards.tactic : [],

}
function cardIds() {
  const t = cardTable();
  return ['bounty', 'tactic'].flatMap((list) => t[list].map((_, i) => 'cards.' + list + '.' + i));
}
const cardListOf = (id) => String(id).split('.')[1];
const cardIndexOf = (id) => Number(String(id).split('.')[2]);
const cardPair = (id) => (cardListOf(id) === 'bounty' ? '悬赏' : '战术');
function cardHay(id) {
  const c = recordOf('choices', id) || {};
  return [id, c.name, c.desc, c.effectId, c.enemyKey, c.kind, c.payout, c.stageId,
    (c.adds || []).map((a) => a.enemyKey + ' ' + a.buffKey).join(' '),
    (effectOf(c.effectId) || {}).desc, (effectOf(c.effectId) || {}).name].join(' ').toLowerCase();
}
function cardRow(id) {

  return {
    title: String(c.name || '(无名卡)').slice(0, 30),

    level: iss.length ? iss[0].lvl : null,
    sub: (bounty ? '悬赏 · ' + (BOUNTY_PAYOUT_ZH[c.payout] ? BOUNTY_PAYOUT_ZH[c.payout][0] : c.payout || '') : '战术 · ' + (TACTIC_KIND_ZH[c.kind] ? TACTIC_KIND_ZH[c.kind][0] : c.kind || ''))
      + ' · #' + (mn ? mn[1] : '?') + ' · ' + c.effectId,
    subTitle: String(c.desc || ''),
    // 分组标题只在切换那一行渲染一次：所以这里不能用「每行都不同」的内容
    group: bounty ? '悬赏卡 cards.bounty（' + t.bounty.length + ' 张）' : '战术卡 cards.tactic（' + t.tactic.length + ' 张）',
  };
}

/**
 * 悬赏卡的两处真相对照：卡上的扁平字段 vs 效果记录里 buff 的黑板。
 *
 * 为什么值得单列：同一张悬赏的「给多少金、加几个敌人、持续几回合」在两个代码路径里各读一份
 * （match/choices.js 的 bountyCard 读卡，sim/content/choices.js 的 bountyOf 读效果的 buff 黑板）。
 * 两边对不上时，通过抽卡得到它与通过效果直接加敌人，表现会不一样。
 */
function bountyRuntimeDiff(card, eff) {
  const key = ['add_enemy_kill_gain_coin', 'add_enemy_selfbattle_win_gain_coin', 'next_battle_add_enemy_win_gain_coin'];
  const buff = (eff && Array.isArray(eff.buffs) ? eff.buffs : []).find((b) => b && key.includes(b.key) && b.bbStr && b.bbStr.enemy_id);
  if (!buff) {
    return '<p class="hint">这张卡对应的效果记录里没有「加敌人」的 buff 黑板（三个已知键：' + key.join(' / ') + '），'
      + '所以引擎不会按效果自己推赏金 —— 只走卡上那套字段。</p>';
  }
  const bb = buff.bb || {};
  const rows = [
    ['敌人 id', card.enemyKey, buff.bbStr.enemy_id],
    ['数量', card.count, bb.count],
    ['资金', card.coin, bb.coin != null ? bb.coin : eff.enemyPrice],
    ['持续回合', card.rounds, buff.key === 'next_battle_add_enemy_win_gain_coin' ? 1 : bb.round],
    ['结算条件', card.payout, buff.key === 'add_enemy_kill_gain_coin' ? 'kill' : 'perfect'],
  ].map(([k, a, b]) => {
    const same = String(a) === String(b);
    return '<tr><td class="k">' + esc(k) + '</td><td>' + esc(a ?? '') + '</td><td>' + esc(b ?? '') + '</td>'
      + '<td>' + (same ? '✅ 一致' : '<b style="color:#d29922">不一致</b>') + '</td></tr>';
  }).join('');
  return '<table style="margin-top:8px"><thead><tr><th>项</th><th>卡上</th><th>效果 buff 黑板</th><th></th></tr></thead><tbody>'
    + rows + '</tbody></table>'
    + '<p class="hint">左边是 choices.json 的卡字段，右边是 effects.json 的 <code>' + esc(buff.key) + '</code> buff。'
    + '不一致不一定会崩，但「抽到的赏金」与「效果直接加的赏金」会不一样。</p>';
}

/* ---------- 效果页（data/effects.json） ---------- */

/** effectType 在列表里的固定顺序：按「谁在用」排，方便对照着看。 */
const EFFECT_TYPE_ORDER = ['ENEMY_GAIN', 'BUFF_GAIN', 'BAND_INITIAL', 'EQUIP', 'BOND', 'ENEMY', 'CHAR_MAP'];
const effectTypeRank = (t) => {
  const i = EFFECT_TYPE_ORDER.indexOf(String(t));
  return i < 0 ? EFFECT_TYPE_ORDER.length : i;
};
function effectIds() {
  return Object.keys(work.effects || {}).sort((a, b) => {
    const A = work.effects[a] || {}, B = work.effects[b] || {};
    return effectTypeRank(A.effectType) - effectTypeRank(B.effectType)
      || String(A.name || '').localeCompare(String(B.name || ''), 'zh')
      || String(a).localeCompare(String(b));
  });
}
function effectHay(id) {
  const r = work.effects[id] || {};
  return [id, r.name, r.desc, r.descRaw, r.effectType,
    (r.buffs || []).map((b) => (b.key || '') + ' ' + ((b.bbStr && b.bbStr.key) || '')).join(' '),
    Object.keys(r.params || {}).join(' '),
    effectOwners(id).map((o) => o.label).join(' ')].join(' ').toLowerCase();
}
function effectRow(id) {
  const r = work.effects[id] || {};
  const own = effectOwners(id);
  const iss = issuesOf('effects', id);
  return {
    title: (r.name || id) + ' 「' + String(r.desc || '').split('\n')[0].slice(0, 24) + '」',
    chip: null,
    level: iss.length ? iss[0].lvl : null,
    sub: (own.length ? own.length + ' 处引用：' + own.map((o) => o.kind).join('/') : '无人引用') + ' · ' + id,
    subTitle: String(r.desc || ''),
    group: effectTypeZh(r.effectType) + '（' + Object.values(work.effects || {}).filter((x) => x.effectType === r.effectType).length + ' 条）',
  };
}

/*
 *  三张表怎么连起来的（照 data/ 与 server/ 的实际读法写，不是按字段名猜的）：
 *
 *   data/items.json     115 条道具（112 装备 + 3 法术），_a = 精一版、_b = 精二（精锐）版。
 *                       战斗侧读**记录自己的** buffs[].bb / bbStr（support.buffsOf），
 *                       备战侧内置效果读**扁平化的** params（builtinMeta 的 rec.params）——
 *                       两端都要改，只改一处会出现「文案说得对、打起来不一样」。见 paramsSyncBlock()。
 *                       它的 effectId 指向 data/effects.json 里的 EQUIP 记录：那是**数值镜像**，运行时没人读它。
 *
 *   data/choices.json   机变卡：cards.bounty 129 张悬赏、cards.tactic 43 张战术，
 *                       还有 events / pools / schedule 等开局与商店配置（本编辑器只做卡牌）。
 *                       卡的 effectId 指向 effects.json 的 ENEMY_GAIN / BUFF_GAIN 记录，**1:1 对齐**。
 *
 *   data/effects.json   361 条效果本体（buffs[] + params），按 effectType 归类：
 *                       ENEMY_GAIN 129 ←悬赏卡、BUFF_GAIN 43 ←战术卡、BAND_INITIAL 41 ←策略(bands.json)、
 *                       EQUIP 115 ←道具、BOND 23 ←盟约(bonds.json)、ENEMY 6、CHAR_MAP 4 ←练度倍率。
 */

/** itemType：道具大类（商店与装备逻辑会看）。 */
const ITEM_TYPE_ZH = {

/** category：功能分类，只影响商店分组与检索，不参与结算。 */

  ON_HIT: ['攻击触发', '攻击、造成伤害或命中的瞬间触发'],
  RECRUIT: ['招募买人', '给干员、刷新商店、特殊商店、改卡池'],
  SURVIVAL: ['生存', '护盾、免死、回血、复活、减伤'],
  BOND_SIGNATURE: ['盟约专属', '为某条盟约定制的装备（锤系等）'],
  ECONOMY: ['经济', '给资金、利息、资金结转'],
  SET: ['套装', '同一系列成套才生效'],
  MAGIC: ['法术', '魔法类道具'],
  BOND: ['盟约', '与盟约层数 / 成员资格相关'],
  SP: ['技力', '给技能 SP、加速技力回复'],

/** kind：结算方式——最要紧的一栏，「要不要销毁」全看它。 */
const ITEM_KIND_ZH = {
  passive: ['常驻被动', '装备后一直生效，不销毁'],

      '<div class="list">',
        '<div class="tools">',
          '<input type="search" id="q" placeholder="搜索 id / 名字 / 描述 / bb 键名" value="' + esc(state.q) + '">',
          '<span id="qCount" class="hint" style="margin:0;white-space:nowrap"></span>',
        '</div>',
        '<div class="scroll" id="rows"></div>',
      '</div>',
      '<div class="detail" id="detail"></div>',
    ].join('');
    const qi = $('#q');
    // 输入法安全：打字时只重绘内容，绝不动输入框本身
    qi.addEventListener('input', () => { state.q = qi.value; paintRows(); });
    qi.addEventListener('compositionstart', () => { state.composing = true; });
    qi.addEventListener('compositionend', () => { state.composing = false; state.q = qi.value; paintRows(); });
    qi.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { qi.value = ''; state.q = ''; paintRows(); }
    });
    qi.focus();
    try { qi.setSelectionRange(qi.value.length, qi.value.length); } catch (err) {}
  }
  paintRows();
}

/** 延到下一帧执行（浏览器用 rAF，避免焦点元素把容器滚动带偏）。 */
function defer(fn) {
  try {
    if (typeof requestAnimationFrame === 'function') return requestAnimationFrame(fn);
  } catch (e) { /* 非浏览器环境 */ }
  return fn();
}

/** 只重绘列表与详情（保持输入框存活，输入法不受影响）。 */
function paintRows() {
  const list = work[activeTab] || {};
  const q = state.q.trim().toLowerCase();
  const bbKeysOf = (id) => Object.keys(list[id].bb || {}).join(' ').toLowerCase();
  let ids = Object.keys(list);
  if (q) ids = ids.filter((id) => (id + ' ' + (list[id].name || '') + ' ' + (list[id].desc || '') + ' ' + bbKeysOf(id)).toLowerCase().includes(q));
  if (activeTab === 'chess') ids.sort((a, b) => (list[b].tier || 0) - (list[a].tier || 0) || a.localeCompare(b));
  if (!ids.includes(selected[activeTab])) selected[activeTab] = ids[0] || null;

  const rows = $('#rows');
  if (!rows) return;
  const cur = selected[activeTab];
  // 保存滚动位置：innerHTML 赋值会把它清零，表现为「一选就跳回最上面」
  const keepScroll = rows.scrollTop || 0;
  rows.innerHTML = ids.length ? ids.map((id) => {
    const m = meta(activeTab, id, list[id]);
    const iss = issuesOf(activeTab, id);
    return '<div class="row ' + (id === cur ? 'on' : '') + '" data-id="' + esc(id) + '">'
      + (touched(activeTab, id) ? '<span class="dot" title="已修改"></span>' : '')
      + '<span class="t">' + esc(m.name) + (iss.length ? ' <span class="lvl-' + iss[0].lvl + '">●</span>' : '') + (activeTab === 'chess' && list[id].isGolden ? ' <span class="chip gold" style="font-size:10px">精锐·精二</span>' : '') + '</span>'
      + '<span class="sub">' + esc(m.sub) + '</span></div>';
  }).join('') : '<div class="hint" style="padding:10px">没有匹配的记录</div>';
  if (keepScroll) rows.scrollTop = keepScroll;
  for (const el of rows.querySelectorAll ? (rows.querySelectorAll('.row') || []) : []) {
    el.addEventListener('click', () => { selected[activeTab] = el.dataset.id; paintRows(); });
  }
  const qcEl = $('#qCount');
  if (qcEl) qcEl.textContent = q ? '找到 ' + ids.length + ' 条' : '';

  const detail = $('#detail');
  if (!detail) return;
  if (!ids.length) {
    detail.innerHTML = '<div class="empty">没有匹配的记录。<br><span class="hint">可以试：角色名（如 余）、干员 id、盟约名（如 炎）、特质描述片段，或 bb 键名（如 base_time）。</span><br><br><button id="qClear">清空搜索</button></div>';
    const qcBtn = $('#qClear');
    if (qcBtn) qcBtn.addEventListener('click', () => { state.q = ''; const qi = $('#q'); if (qi) qi.value = ''; paintRows(); });
    return;
  }
  if (!cur || !list[cur]) { detail.innerHTML = '<div class="empty">从左侧选一条记录</div>'; return; }
  const sameRecord = detail.dataset.rec === cur;
  const keepDetail = sameRecord ? (detail.scrollTop || 0) : 0;
  detail.dataset.rec = cur;
  detail.innerHTML = recordForm(activeTab, cur);
  wireForm(activeTab, cur);
  detail.scrollTop = keepDetail;
}
/** 表单控件的真实位置标记：data-root="{kind}|{id}|{rel}"（键 id 与 rel 都用 JSON 编码，避免分隔符冲突）。 */
const rootAttr = (kind, id, rel) => ' data-root="' + esc(kind + '|' + JSON.stringify(id) + '|' + JSON.stringify(rel)) + '"';
const parseRootAttr = (v) => {
  const parts = String(v || '').split('|');
  if (parts.length < 3) return null;
  try {
    const rel = JSON.parse(parts.slice(2).join('|'));
    return { kind: parts[0], id: JSON.parse(parts[1]), rel };
  } catch { return null; }
};

function numField(kind, id, path, label, rec) {
  const cur = getPath(rec, path);
  const changed = log.some((e) => e.file === kind && e.id === id && e.field === path);
  // label 传 bb 键名时补中文含义与值解读
  const isBb = label.startsWith('bb.');
  const key = isBb ? label.slice(3) : label;
  const gl = isBb ? bbLabel(key, cur) : null;
  // 行内形式：键名（中文含义）  = 值解读
  const head = isBb
    ? `<span class="k">${esc(key)}<span class="cn">（${esc(gl.inline)}）</span>${gl.val ? ' <b class="val">' + esc(gl.val) + '</b>' : ''}</span>`
    : `<span>${esc(label)}</span>`;
  return `<label class="f${isBb ? ' bb' : ''}" title="${esc(path)}${isBb ? ' — ' + esc(gl.cn) : ''}">
    ${head}
    <input class="num ${changed ? 'changed' : ''}" data-path="${esc(path)}"${rootAttr(kind, id, path)} data-type="number" value="${esc(cur ?? '')}">
  </label>`;
}
function textField(kind, id, path, label, rec, opts = {}) {
  const cur = getPath(rec, path);
  const changed = log.some((e) => e.file === kind && e.id === id && e.field === path);
  return `<label class="f" ${opts.full ? 'style="grid-column:1/-1"' : ''}>
    <span>${esc(label)}</span>
    ${opts.area
      ? `<textarea class="${changed ? 'changed' : ''}" data-path="${esc(path)}"${rootAttr(kind, id, path)} data-type="string" rows="${opts.rows || 3}">${esc(cur ?? '')}</textarea>`
      : `<input class="${changed ? 'changed' : ''}" data-path="${esc(path)}"${rootAttr(kind, id, path)} data-type="string" value="${esc(cur ?? '')}">`}
  </label>`;
}
function selectField(kind, id, path, label, rec, options) {
  const cur = getPath(rec, path);
  return `<label class="f"><span>${esc(label)}</span><select data-path="${esc(path)}"${rootAttr(kind, id, path)} data-type="string">
    ${options.map((o) => `<option value="${esc(o)}" ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')}
  </select></label>`;
}
/** 布尔字段：下拉选 是/否（写进 JSON 的是真正的 true/false，不是字符串）。 */
function boolField(kind, id, path, label, rec, note = '') {
  const cur = getPath(rec, path);
  const changed = log.some((e) => e.file === kind && e.id === id && e.field === path);
  return '<label class="f" title="' + esc(path) + '"><span>' + esc(label) + '</span>'
    + '<select class="' + (changed ? 'changed' : '') + '" data-path="' + esc(path) + '"' + rootAttr(kind, id, path) + ' data-type="bool">'
    + [[true, '是'], [false, '否']].map(([v, zh]) => '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + zh + '（' + v + '）</option>').join('')
    + '</select>'
    + (note ? '<span class="hint" style="margin:2px 0 0">' + note + '</span>' : '')
    + '</label>';
}

/** 数字数组字段（如 thresholds）：逗号分隔的单行输入。 */
function arrayField(kind, id, path, label, rec) {
  const cur = getPath(rec, path);
  const changed = log.some((e) => e.file === kind && e.id === id && e.field === path);
  return `<label class="f" title="${esc(path)}">
    <span>${esc(label)}</span>
    <input class="num ${changed ? 'changed' : ''}" data-path="${esc(path)}"${rootAttr(kind, id, path)} data-type="array" value="${esc(Array.isArray(cur) ? cur.join(',') : '')}">
  </label>`;
}
/** 去掉官方富文本标记（<@ba.vup>…</>、<color=…>…</> 等）得到纯文本，与 build-data 的 stripRich 口径一致。 */
/** 去掉官方富文本标记（<@ba.vup>…</>、<color=…>…</>）得到纯文本。 */
function stripRich(raw) {
  return String(raw ?? '').replace(/<[^>]*>/g, '');
}

/**
 * 官方富文本 → 纯文本，口径与 build-data 的 stripRich 一致（docs/DATA.md §0）：
 * 真正的标记（<@ba.xxx> / </> / <color=…>）被删；而 <在场6名…>、<战斗中> 这类**触发标签不是标记**，
 * 只去掉包裹的尖括号、保留内容 —— 所以 desc 里 `<在场9名…>` 会变成 `在场9名…>`。
 */
function plainOf(raw) {
  return String(raw ?? '')
    // 官方标记只有两种形态：开标记 <@ba.xxx> / <@autochess.gray>，闭标记 </>。
    // 字面触发标签（如 <在场6名不同【炎】干员>）的 < 是裸的，不属于标记，会原样保留。
    .replace(/<@[^>]*>/g, '')
    .replace(/<\s*\/>/g, '')
    .replace(/[\uFF08(]\s*/g, '（')
    .replace(/\s*[\uFF09)]/g, '）')
    .replace(/\n/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * 纯文本 desc → 富文本 descRaw：把字面触发标签 <…> 包成 raw 标记 <@ba.vup>…</>，
 * 这样 plainOf(descRaw) 与 desc 完全一致，游戏界面也显示同样内容。
 */
function toRaw(desc) {
  return String(desc ?? '')
    // 字面触发标签 <战斗中> 在 raw 里必须是「裸 < + 带标记的内容 + 裸 >」，
    // 这样 plainOf(raw) 才能还原成同一个 <战斗中>（若把 < 也包进标记，渲染时尖括号会消失）。
    .replace(/<([^<>]+)>/g, '<$1\u0000>')
    .replace(/\u0000>/g, '>')
    .replace(/[\uFF08(]\s+/g, '（')
    .replace(/\s+[\uFF09)]/g, '）');
}
/**
 * 描述类字段成对同步。客户端渲染的是 <code>descRaw || desc</code> 那一份（detailPanel / bondStrip / shopBar…），
 * 所以只改 desc 会出现「效果变了、界面文字没变」。两组配对各自双向同步：
 *   改 desc        → descRaw = toRaw(desc)
 *   改 descRaw     → desc    = plainOf(descRaw)
 *   effectDesc 那一对同理。
 */
const DESC_PAIR = {
  desc: ['descRaw', 'raw'],
  descRaw: ['desc', 'plain'],
  effectDesc: ['effectDescRaw', 'raw'],
  effectDescRaw: ['effectDesc', 'plain'],
};
function syncDescPair(kind, id, path, value) {
  const pair = DESC_PAIR[path];
  if (!pair) return;
  // 内部写回时抑制再同步，避免两条记录互相来回触发
  suppressSync = true;
  setField(kind, id, pair[0], pair[1] === 'raw' ? toRaw(value) : plainOf(value));
  suppressSync = false;
}

/** 记录列表的排序名：干员名 / 盟约名 / 特质描述首行。 */
function displayNameOf(kind, rec, id) {
  if (kind === 'chess') return rec.name || id;
  if (kind === 'bonds') return rec.name || id;
  // 特质没有名字：整段描述就是它的标识。不能截断 —— _a/_b 两条的差异常在最后一个字（+1 / +2）
  return String(rec.desc || id).replace(/\s+/g, ' ').trim();
}

/** 每个池子按「id」和「名字」双向建立索引，用于名字 → id 解析。缓存避免每次输入都重建。 */
const _idxCache = new Map();
function indexOf(kind) {
  if (_idxCache.has(kind)) return _idxCache.get(kind);
  const byName = new Map(), byId = new Map(), list = [];
  for (const [id, rec] of Object.entries(work[kind] || {})) {
    const nm = displayNameOf(kind, rec, id);
    byId.set(id, id);
    const keys = kind === 'chess' ? [nm, nm + '·' + (rec.isGolden ? '精二' : '精一')] : [nm];
    for (const key of keys) {
      if (!byName.has(key)) byName.set(key, []);
      byName.get(key).push(id);
    }
    list.push({ id, name: nm });
  }
  const idx = { byName, byId, list };
  _idxCache.set(kind, idx);
  return idx;
}
/** 载入或还原数据后清空名字索引。 */
function clearIndexCache() { _idxCache.clear(); }

/**
 * 这段输入是否明显是「文案」而不是 id？
 *
 * id 里不可能出现空白、中文标点、尖括号或 @，也不可能很长。用户把整段特质描述粘进 id 输入框是常见误操作 ——
 * 一旦放行，解析器会把它当成名字去找记录，找不到就什么都不做，而用户会以为「文本被复制进了 garrisonIds」。
 */
function looksLikeProse(raw) {
  const t = String(raw ?? '');
  if (t.length > 48) return true;
  return /[\s，。、；：！？（）【】“”‘’<>@]/.test(t);
}

/** 把用户输入解析成真实 id：先按 id 精确匹配，再按名字（含去空格）。歧义时取第一个并回报候选数。 */
function resolveId(kind, raw) {
  const t = String(raw || '').trim();
  if (!t) return null;
  const idx = indexOf(kind);
  if (idx.byId.has(t)) return { id: t, how: 'id' };
  // 「名字 + 精一/精二」：直接锁定版本，避免同名时永远落到 _a
  const wantB = /精二|精锐/.test(t);
  const wantA = /精一|普通/.test(t);
  for (const suffix of ['a', 'b']) {
    if (suffix === 'b' && !wantB) continue;
    if (suffix === 'a' && !wantA) continue;
    const withSuffix = idx.byName.get(t + '·精' + (suffix === 'b' ? '二' : '一'));
    if (withSuffix && withSuffix.length) return { id: withSuffix[0], how: 'name+version' };
  }
  const direct = idx.byName.get(t);
  if (direct && direct.length === 1) return { id: direct[0], how: 'name' };
  if (direct && direct.length > 1) {
    // 同名多条（_a/_b 或同名不同阶）：不猜，交由调用方列出候选
    return { id: direct[0], how: 'ambiguous', candidates: direct, alts: direct.length - 1 };
  }
  // 模糊：忽略大小写与空格，允许「名字 + 少量后缀」
  const norm = (x) => String(x).toLowerCase().replace(/[\s·_\-]/g, '');
  const nt = norm(t);
  const hit = idx.list.find((e) => norm(e.name) === nt) || idx.list.find((e) => norm(e.name).includes(nt));
  if (hit) return { id: hit.id, how: 'fuzzy' };
  const byIdLike = idx.list.find((e) => e.id.toLowerCase().includes(nt));
  if (byIdLike) return { id: byIdLike.id, how: 'idfuzzy' };
  return null;
}
/**
 * 每轮渲染内，池子 → datalist 元素的登记表（见 idList）。
 *
 * 为什么需要：一个池子的候选清单（249 条特质约 37 KB）以前会被**每个**引用它的输入框
 * 内联一份；干员页有「精一/精二 × bonds/garrisonIds」四个列表，于是同一份清单渲染四遍，
 * 单页膨胀到 150 KB 以上。现在同一池子整页只渲染一份，其余输入框用 list= 指向它。
 */
const dlRegistry = new Map();
const resetDatalists = () => dlRegistry.clear();

function idList(kind, id, path, label, rec, poolKind, note = '') {
  const arr = getPath(rec, path) || [];
  // poolKind 为空表示「这个列表不指向某个可补全的池子」（例如 powers 势力），此时不做校验也不给补全
  const pool = poolKind ? (work[poolKind] || null) : null;
  const listId = 'dl_' + kind + '_' + id + '_' + path.replace(/[^a-z]/gi, '');
  /*
   * 标签：显示名字，副显示 id；未知 id 标红。
   * 这里刻意不用「三元里取 pool[v]」的写法——pool 为空（这个列表不指向可补全的池子，例如
   * powers 势力）时，那样写会在求值分支里撞上空对象。改成先判空、再取值，路径唯一。
   */
  const tags = arr.map((v, i) => {
    let name = null, verShort = '', broken = false;
    if (pool) {
      broken = !pool[v];
      name = broken ? '未知' : displayNameOf(poolKind, pool[v], v);
      verShort = verTagOf(poolKind, v);
    } else {
      name = String(v);                 // 没有池子可查：直接显示原始值，不标红、不给补全
      verShort = '';
    }
    const title = broken ? '不存在的 id' : esc(v);
    /*
     * 拖动标记：只有「干员的特质列表」需要（garrisonIds）。拖 tag 到别的 tag = 排顺序，
     * 拖到左侧名单里的干员 = 挂到他身上（见 wireDragAndDrop / applyDrag）。
     * 其他列表（盟约成员、owners…）不给拖，避免让人以为拖了会改干员。
     */
    const canDrag = path === 'garrisonIds' && kind === 'chess';
    const dragAttr = canDrag
      ? ' draggable="true" data-drag-id="' + esc(v) + '" data-drag-field="garrisonIds"'
        + ' data-drag-from="' + esc(id) + '" data-drag-index="' + i + '"' : '';
    return '<span class="tag' + (broken ? ' bad' : '') + '" title="' + title + '"' + dragAttr + '>'
      + (canDrag ? '<span class="grip" title="拖动：换顺序 / 挂到别的干员">⣿</span>' : '')
      + esc(name) + (broken ? ' ' + esc(v) : '')
      + '<span class="ver">' + esc(verShort) + '</span>'
      + ' <button class="del" data-rm="' + esc(path) + '" data-i="' + i + '" title="移除">×</button></span>';
  }).join('');
  /*
   * 补全：<option value> 必须是**英文 id** —— 浏览器会把 value 填进输入框，若填中文名就会出现
   * 「框里是中文、而 garrisonIds 要英文代码」的问题。中文名字放在 label 与文本里，用于搜索与辨识。
   *
   * 同一池子在整页只用一份 datalist（dlRegistry）：第一个用到它的输入框负责渲染清单，
   * 其余输入框复用同一个 id。这样既省体积，也不会出现「同一个 id 在页面里重复」的问题。
   */
  const dlKey = pool ? (poolKind + '|' + Object.keys(pool).length) : null;
  const dlId = pool ? ('dl_' + poolKind + '_' + Object.keys(pool).length) : null;
  let dlHtml = '';
  if (pool && !dlRegistry.has(dlKey)) {
    dlRegistry.set(dlKey, true);
    /*
     * 候选项要短：特质的「名字」就是整段描述（249 条 × 80 字 ≈ 20 KB，只在首页渲染也压手）。
     * 截到 48 字就够用——datalist 的匹配是子串匹配，打关键词照样能搜到；
     * 完整描述仍在左侧列表与详情里（那里才是判断依据）。
     */
    /*
     * 只写 value + 文本，**不写 label 属性**：label 和文本内容说的是同一件事，
     * 都写等于把描述存两份（每个 option 从 ~146 字降到 ~73 字）。
     *
     * 截断必须「保头又保尾」：一对 _a/_b 的差别常常就在结尾（【炎】层数+1 / +2），
     * 只截头会把唯一的分辨点裁掉，选中就会选错。所以超过上限时保留前 38 + 后 20 字。
     */
    const clip = (t, max = 60) => {
      const s2 = String(t);
      if (s2.length <= max) return s2;
      return s2.slice(0, max - 22) + '…' + s2.slice(-20);
    };
    const options = Object.keys(pool).slice(0, 4000).map((k) => {
      const plain = stripRich(displayNameOf(poolKind, pool[k], k)).replace(/\s+/g, ' ').trim();
      const ver = verTagOf(poolKind, k);
      const short = clip(plain) + (ver ? ' 【' + ver + '】' : '');
      return `<option value="${esc(k)}">${esc(short)} — ${esc(k)}</option>`;
    }).join('');
    dlHtml = `<datalist id="${esc(dlId)}">${options}</datalist>`;
  }
  return `<div style="grid-column:1/-1">
    <span style="color:var(--dim);font:11px var(--mono)">${esc(label)}</span>
    <div class="idlist">${tags} <span class="tag add">共 ${arr.length}</span></div>
    <div class="addbox">
      <input data-add="${esc(path)}" list="${esc(dlId || listId)}" placeholder="输入名字（如 余）或英文 id；下拉里选中会自动填英文 id">
      ${dlHtml}
      <button class="tiny" data-addbtn="${esc(path)}">添加</button>
    </div>
    ${note ? `<p class="hint">${note}</p>` : ''}
  </div>`;
}

function recordForm(kind, id) {
  const rec = work[kind][id];
  const iss = issuesOf(kind, id);
  const issHtml = iss.length ? `<fieldset><legend>本记录的问题</legend><ul class="issues">${iss.map((i) => `<li class="lvl-${i.lvl}"><b>${i.lvl === 'bad' ? '错误' : '提醒'}</b> ${esc(i.m)}</li>`).join('')}</ul></fieldset>` : '';

  if (kind === 'bonds') {
    const bbKeys = Object.keys(rec.bb || {});

    <fieldset><legend>基本信息</legend><div class="grid">

    </div></fieldset>
    <fieldset><legend>激活门槛</legend><div class="grid">
      ${arrayField(kind, id, 'thresholds', 'thresholds（逗号分隔，引擎用这个判定进阶）', rec)}
      ${numField(kind, id, 'bb.power_bond_char_cnt', 'bb.power_bond_char_cnt（进阶1 的展示/条件）', rec)}
      ${numField(kind, id, 'bb.ex_bond_char_cnt', 'bb.ex_bond_char_cnt（进阶2 的展示/条件）', rec)}
    </div>
    <div class="addbox"><button class="tiny" id="syncTh">按 thresholds 同步两个 bb 键</button></div>
    <p class="hint">引擎判定进阶用 thresholds，进阶效果的手写代码常读 bb 的两个键。只改一处会出现「面板与实效不符」。</p>
    </fieldset>
    <fieldset><legend>BB 数值（${bbKeys.length} 个 · 引擎通过 buffParams(record,key) 读取，改这里立刻生效）</legend>
      <div class="grid">${bbKeys.map((k) => numField(kind, id, 'bb.' + k, k, rec)).join('')}</div>
      <div class="addbox"><input data-addbb placeholder="新 bb 键名" style="max-width:220px"><button class="tiny" data-addbbbtn>加一个数值键</button></div>
    </fieldset>
    <fieldset><legend>描述文本（同步数字，否则面板显示旧值）</legend><div class="grid">
      ${textField(kind, id, 'desc', 'desc（纯文本，玩家看的面板）', rec, { area: true, full: true, rows: 3 })}
      ${textField(kind, id, 'effectDesc', 'effectDesc（效果描述）', rec, { area: true, full: true, rows: 3 })}
    </div>
    <div class="addbox"><button class="tiny" id="syncDesc">按 bb 自动改 desc 里的数字</button></div>
    <p class="hint"><b>注意：游戏界面显示的是 descRaw / effectDescRaw（富文本版）</b>——客户端是 <code>descRaw || desc</code> 的读法，所以只改 desc 不会改到画面。本编辑器已做自动同步：你改 desc，descRaw 会跟着变成无标记的纯文本；若你想保留官方的彩色标记（如 <code>&lt;@ba.vup&gt;+8&lt;/&gt;</code>），请直接编辑 descRaw。</p>
    </fieldset>
    <fieldset><legend>成员名单</legend>
      ${idList(kind, id, 'members', `members（${(rec.members || []).length} 名）`, rec, 'chess', '这两个数组是「干员侧反查」的结果。要真正改成员，请去「干员」页改它的 bonds；重跑 build-data 也会覆盖这里。')}
    </fieldset>
    <fieldset><legend>层数里程碑 layerMilestones（${(rec.layerMilestones || []).length}）</legend>
      ${(rec.layerMilestones || []).length ? `<table><thead><tr><th>#</th><th>mode</th><th>layer</th><th>effect</th><th></th></tr></thead><tbody>${msRows}</tbody></table>` : '<p class="hint">这条盟约没有层数里程碑。</p>'}
      <div class="addbox"><button class="tiny" data-addml>新增一条里程碑</button></div>
    </fieldset>`;
  }

  if (kind === 'chess') {
    const statKeys = [...new Set([...Object.keys(rec.stats || {}), ...NUMERIC_STAT_KEYS])].filter((k) => rec.stats && k in rec.stats);
    const golden = rec.isGolden;
    const pair = pairIdOf('chess', rec, id);
    const verChip = golden ? '<span class="chip gold">精锐（精二）</span>' : '<span class="chip">普通（精一）</span>';
    const pairBtn = pair ? '<button class="tiny" id="goPair">切到' + (golden ? CHESS_VER.a : CHESS_VER.b) + ' →</button>' : '<span class="hint">（这条没有成对的另一版本）</span>';
    return `<h2>${esc(rec.name || id)} ${verChip}${rec.isGolden ? '' : '<span class="chip">T' + esc(rec.tier) + '</span>'}</h2>
    <div class="sub">${esc(id)} · ${esc(chessTierLabel(rec))} · ${esc(rec.profession || '')}/${esc(rec.subProfessionName || '')} · ${rec.visible ? '可见（进卡池）' : '不可见 / DIY'}</div>
    <div class="addbox" style="margin:-4px 0 10px">
      <span class="hint" style="margin:0">同一条干员有两条记录（${rec.isGolden ? '精锐（精二）' : '普通（精一）'} 与另一版本），改盟约/特质时两条都要改：</span>

    <fieldset><legend>盟约与特质 —— 「角色专属盟约交互」的入口</legend>
      ${idList(kind, id, 'bonds', `bonds（所属盟约 ${(rec.bonds || []).length}）`, rec, 'bonds', '加入/移除盟约立刻影响：盟约人数、激活门槛、本局禁用判定、卡池。')}
      ${idList(kind, id, 'garrisonIds', `garrisonIds（特质 ${(rec.garrisonIds || []).length}）`, rec, 'garrisons', '「每层加属性」「加层条件」这类效果都在特质里。精锐要单独设一份。')}
      ${golden ? `<div class="addbox"><button class="tiny" id="syncFromBase">从本体 copy bonds / garrisonIds</button></div>` : ''}
    </fieldset>
    ${id.startsWith('chess_char_') ? textsBlock(kind, id, rec) : ''}
    <fieldset><legend>基础属性 stats（${Object.keys(rec.stats || {}).length} 个）</legend>
      <div class="grid">${statKeys.map((k) => numField(kind, id, 'stats.' + k, k, rec)).join('')}</div>
      <p class="hint">maxHp / atk / def 是战斗直接读取的数值；res 法术抗性，bat 攻击间隔（秒），aspd 攻速，cost 自动再部署费用。</p>
    </fieldset>
    <fieldset><legend>标量字段</legend><div class="grid">
      ${numField(kind, id, 'tier', 'tier（阶，影响刷新概率与解锁）', rec)}
      ${numField(kind, id, 'price', 'price（购买价）', rec)}
    </div></fieldset>`;
  }

  /*
   * 特质（garrisons）的详情只有一份实现：traitForm。
   *
   * 这里原本另写了一份「基本信息」表单，effectKey / effectType / eventType 用的是裸文本框，
   * 于是「效果实现」的中文下拉只在特质页生效、这条路径上仍是英文键名——同一份 UI 两份实现
   * 就一定会分叉。现在直接委托，再也不会有第二份。
   */
  return traitForm(id);
}

/** 点一下复制（详情里的记录 id 之类）。 */
function wireCopyButtons(scope) {
  for (const el of scope.querySelectorAll('[data-copy]')) el.addEventListener('click', async () => {
    const v = el.dataset.copy;
    try { await navigator.clipboard.writeText(v); toast('已复制：' + v, 2400); }
    catch { toast('复制失败：' + v, 3200); }
  });
}

/* ============================ 拖动：排版与搬家 ============================ */
/*
 *  两种拖动，都直接改数据（保存后生效）：
 *    1) 同一个干员内部左右拖 → 调整 garrisonIds 的**顺序**。
 *       有实际意义：棋盘详情面板只显示 garrisonIds[0]（detailPanel.js:410），编队页按顺序显示全部。
 *    2) 拖到左侧名单里的另一名干员 → 把特质**加**到他身上；按住 Ctrl 拖则从他身上**移除**。
 *
 *  拖动只做「目标明确」的事：不做自动复制、不自动配对（特质 _a/_b 该挂哪条由你决定），
 *  因为这些都会静默改到别的记录。落地前给确认提示。
 */
const DRAG_MIME = 'application/x-sp-tag';

/** 拖动负载：{ kind, fromId, field, index, id } */
let dragPayload = null;

/** 干员页的棋子记录 id（拖动只在这一页有意义）。 */
const opPageChessId = () => {
  const cur = pageCtx;
  if (cur && cur.kind === 'chess' && work.chess && work.chess[cur.id]) return cur.id;
  return null;
};

/** 记录当前拖动状态的提示条，让用户知道「现在往哪放」。 */
function showDropHint(text) {
  const list = $('.list');
  if (!list) return;
  let bar = list.querySelector('.dropbar');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'dropbar';
    list.insertBefore(bar, list.firstChild);
  }
  bar.textContent = text;
  list.classList.add('droppable');
}
function clearDropHint() {
  const list = $('.list');
  if (!list) return;
  list.classList.remove('droppable');
  const bar = list.querySelector('.dropbar');
  if (bar) bar.remove();
  for (const r of document.querySelectorAll('.row.droptarget')) r.classList.remove('droptarget');
}

/**
 * 处理一次落点。
 * @param {{kind:string, fromId:string, field:string, index:number, id:string}} from
 * @param {{opKey?:string, toIndex?:number|null, remove?:boolean}} target
 */
function applyDrag(from, target) {
  // 情形 1：同一干员内重排（按住 Ctrl 时不算重排，见情形 2 的移除）
  if (!target.remove && target.opKey === 'chess:' + from.fromId && from.field === 'garrisonIds') {
    const rec = work.chess[from.fromId];
    const arr = [...(rec.garrisonIds || [])];
    const to = target.toIndex == null ? arr.length - 1 : (target.toIndex > from.index ? target.toIndex - 1 : target.toIndex);
    if (to === from.index) return false;
    arr.splice(from.index, 1);
    arr.splice(to, 0, from.id);
    setField('chess', from.fromId, 'garrisonIds', arr);
    toast('已调整顺序：' + from.id + ' → 第 ' + (to + 1) + ' 位' + (to === 0 ? '（棋盘详情会显示它）' : ''), 4200);
    validate(); render();
    return true;
  }
  // 情形 2：搬到另一名干员身上
  if (!target.opKey || !target.opKey.startsWith('chess:')) {
    toast('这一页只能拖到「棋子干员」名单里的干员上。', 4200);
    return false;
  }
  const toId = target.opKey.slice('chess:'.length);
  const rec = work.chess[toId];
  if (!rec) return false;
  const arr = [...(rec.garrisonIds || [])];
  const has = arr.includes(from.id);
  if (target.remove) {
    if (!has) { toast(rec.name + ' 身上没有 ' + from.id, 3200); return false; }
    setField('chess', toId, 'garrisonIds', arr.filter((x) => x !== from.id));
    toast('已从 ' + (rec.name || toId) + ' 移除 ' + from.id, 3600);
  } else {
    if (has) { toast((rec.name || toId) + ' 已经有这个特质了', 3200); return false; }
    setField('chess', toId, 'garrisonIds', [...arr, from.id]);
    toast('已把 ' + from.id + ' 挂到 ' + (rec.name || toId) + '（还没从原干员移除）', 4800);
  }
  const owners = Array.isArray(work.garrisons[from.id] && work.garrisons[from.id].owners) ? work.garrisons[from.id].owners : [];
  if (owners.length > 1) {
    toast('注意：' + from.id + ' 是共用特质，改动会影响其他 ' + (owners.length - 1) + ' 名干员', 5200);
  }
  validate(); render();
  return true;
}

/** 给详情里的 tag 与左侧名单接线（每次 wireForm 调一次）。 */
function wireDragAndDrop(entry) {
  const detail = $('#detail');
  if (!detail) return;
  const chessId = entry && entry.kind === 'chess' ? entry.id : null;
  // 只有干员页 + 棋子记录才允许拖动（自选干员没有 garrisonIds 概念）
  if (!chessId) return;

  for (const tag of detail.querySelectorAll('[data-drag-id]')) {
    tag.setAttribute('draggable', 'true');
    tag.addEventListener('dragstart', (ev) => {
      dragPayload = {
        kind: 'trait',
        fromId: tag.dataset.dragFrom,
        field: tag.dataset.dragField,
        index: Number(tag.dataset.dragIndex),
        id: tag.dataset.dragId,
      };
      tag.classList.add('dragging');
      try { ev.dataTransfer.setData(DRAG_MIME, JSON.stringify(dragPayload)); } catch { /* 老浏览器 */ }
      ev.dataTransfer.effectAllowed = 'copyMove';
      showDropHint('拖动中：放到左侧的干员 = 加到他身上；按住 Ctrl 放 = 从他身上移除；放回本干员内 = 调整顺序');
    });
    tag.addEventListener('dragend', () => {
      tag.classList.remove('dragging');
      dragPayload = null;
      clearDropHint();
    });
    // 内部重排：拖到另一条 tag 上
    tag.addEventListener('dragover', (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; });
    tag.addEventListener('drop', (ev) => {
      ev.preventDefault();
      const p = dragPayload || safeParse(ev.dataTransfer.getData(DRAG_MIME));
      if (!p || p.fromId !== chessId) return;
      applyDrag(p, { opKey: 'chess:' + chessId, toIndex: p.index < Number(tag.dataset.dragIndex) ? Number(tag.dataset.dragIndex) + 1 : Number(tag.dataset.dragIndex) });
    });
  }

  // 名单里的干员行 = 落点
  const rows = $('#rows');
  if (!rows) return;
  for (const row of rows.querySelectorAll('[data-opkey]')) {
    if (!row.dataset.opkey.startsWith('chess:')) continue;
    row.addEventListener('dragover', (ev) => {
      if (!dragPayload) return;
      ev.preventDefault();
      ev.stopPropagation();
      ev.dataTransfer.dropEffect = ev.ctrlKey ? 'move' : 'copy';
      row.classList.add('droptarget');
    });
    row.addEventListener('dragleave', () => row.classList.remove('droptarget'));
    row.addEventListener('drop', (ev) => {
      if (!dragPayload) return;
      ev.preventDefault();
      ev.stopPropagation();
      row.classList.remove('droptarget');
      const p = dragPayload;
      applyDrag(p, { opKey: row.dataset.opkey, remove: ev.ctrlKey });
    });
  }
}
function safeParse(s) { try { return JSON.parse(s); } catch { return null; } }

/* ============================ 表单接线 ============================ */

/** @param {{rec: object}|object} [ctx] 合成记录（干员页）或上下文对象；见 wireForm 里的用法。 */
function wireForm(kind, id, ctx) {
  if (!id) return;
  // 干员页把当前这名干员记下来：addId / 删除按钮在模块级函数里，需要它来解析路径
  pageCtx = ctx && ctx.pageCtx ? ctx.pageCtx : (ctx || null);
  const recFor = ctx && ctx.rec ? ctx.rec : ctx;
  // backups 页签的记录是合成的（units 与 diy.operators 按 charId 合并），取不到就退回 DIY 台面
  const rec = recFor || recordOf(kind, id) || (kind === 'backups' && work.backups ? diyTab() : null);
  wireCopyButtons($('#detail'));
  wireDragAndDrop(recFor && recFor.kind ? recFor : null);
  /*
   * 干员页会在一张表单里混入三张表的字段（chess + bonds + garrisons），所以取值不能只看
   * (kind, id)：按字段名判断该去哪张表取。表单控件只带 data-path，这里统一解析。
   */
  const formGet = (path) => {
    const seg = splitPath(path);
    if (recFor) {
      if (seg[0] === 'stats' || seg[0] === 'bonds' || seg[0] === 'garrisonIds' || seg[0] === 'tier' || seg[0] === 'price' || seg[0] === 'name')
        return getPath(recFor.rec, path);
      if (/^(units|diy|char_)/.test(path)) return getPath(work.backups, path) ?? getPath(diyTab(), path);
    }
    const own = getPath(rec, path);
    return own !== undefined ? own : getPath(recordOf(kind, id), path);
  };
  const detail = $('#detail');

  for (const el of detail.querySelectorAll('[data-path]')) {
    const commit = () => {
      const path = el.dataset.path;
      // 跨界路径：干员页里直接编辑某条特质的文案（__garrison.<gid>.desc）
      const gm = /^__garrison\.([^.]+)\.([^.]+)$/.exec(path);
      if (gm) {
        const gid = gm[1], field = gm[2];
        setField('garrisons', gid, field, el.value);
        syncDescPair('garrisons', gid, field, el.value);
        const pair = DESC_PAIR[field];
        const pairEl = pair ? $('#detail').querySelector('[data-path="__garrison.' + gid + '.' + pair[0] + '"]') : null;
        if (pairEl && work.garrisons[gid]) pairEl.value = work.garrisons[gid][pair[0]] ?? '';
        validate();
        return;
      }
      let v = el.value;
      // 控件的真实位置优先（渲染时写在 data-root 上）：干员页一张表单混了四张表，
      // 像 bb.* 这种路径在盟约和特质里都合法，只凭字符串没法判断该写哪张表。
      const root = parseRootAttr(el.dataset.root) || formRoot(path);
      if (Array.isArray(formGet(root.rel))) {
        // thresholds 这类数字数组：逗号分隔输入
        v = String(v).split(',').map((s) => Number(s.trim())).filter((n) => Number.isFinite(n));
      } else if (el.dataset.type === 'number') {
        if (v.trim() === '') v = null;
        else {
          const n = Number(v);
          if (!Number.isFinite(n)) {
            const hostNow = hostOf(root.kind, root.id);
            toast(`「${root.rel}」要填数字`, 2600);
            el.value = getPath(hostNow, root.rel) ?? '';
            return;
          }
          v = n;
        }
      } else if (el.dataset.type === 'bool') {
        // 布尔字段写的是真正的 true / false，不能留成字符串（引擎会当字符串判断）
        v = el.value === 'true';
      }
      // 合成记录（自选干员）必须按真实位置写回（见 diySet）
      if (root.kind === 'backups') diySet(root.id, root.rel, v);
      else {
        setField(root.kind, root.id, root.rel, v);
        // 文案同步（同记录内 desc↔descRaw、特质页再同步到配对那条）由 setField 统一处理，
        // 这里不再重复调用：分开写会互相覆盖（见 setField 里的 suppressSync）。
      }
      el.classList.toggle('changed', log.some((e) => e.file === root.kind && e.id === root.id && e.field === root.rel));
      validate();
    };
    el.addEventListener('change', commit);
  }

  for (const b of detail.querySelectorAll('[data-rm]')) b.addEventListener('click', () => {
    const path = b.dataset.rm;
    const root = formRoot(path);
    const host = hostOf(root.kind, root.id);
    const arr = [...(getPath(host, root.rel) || [])];
    arr.splice(+b.dataset.i, 1);
    if (root.kind === 'backups') diySet(root.id, root.rel, arr);
    else setField(root.kind, root.id, root.rel, arr);
    validate(); render();
  });
  for (const b of detail.querySelectorAll('[data-addbtn]')) b.addEventListener('click', () => addId(kind, id, b.dataset.addbtn));
  for (const inp of detail.querySelectorAll('[data-add]')) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addId(kind, id, inp.dataset.add); });

  // 自选页签：名单增删（ownedPool / prototypes.<星级> / excluded）与解除锁定
  for (const b of detail.querySelectorAll('[data-pooladd]')) b.addEventListener('click', () => {
    const path = 'diy.' + b.dataset.pooladd;
    const arr = [...(getPath(work.backups, path) || [])];
    if (arr.includes(id)) { toast('已经在里面了', 2200); return; }
    arr.push(id);
    diySet(id, path, arr);
    validate(); render();
    toast('已加入 ' + path, 3200);
  });
  for (const b of detail.querySelectorAll('[data-poolrm]')) b.addEventListener('click', () => {
    const path = 'diy.' + b.dataset.poolrm;
    const arr = (getPath(work.backups, path) || []).filter((x) => x !== id);
    diySet(id, path, arr);
    validate(); render();
    toast('已从 ' + path + ' 移出', 3200);
  });
  for (const b of detail.querySelectorAll('[data-lockdel]')) b.addEventListener('click', () => {
    const tier = b.dataset.lockdel;
    deletePath('diy.locked.' + tier + '.' + id);
    validate(); render();
    toast('已解除 ' + tier + ' 星槽的锁定', 3200);
  });
  for (const b of detail.querySelectorAll('[data-lockadd]')) b.addEventListener('click', () => {
    const tier = b.dataset.lockadd;
    // 技能与模组留空表示「不锁定具体技能/模组」，可在别处细调
    diySet(id, 'diy.locked.' + tier + '.' + id, { skillIndex: null, uniEquipId: null, from: [] });
    validate(); render();
    toast('已加入 ' + tier + ' 星槽的锁定', 3200);
  });

  const bbBtn = detail.querySelector('[data-addbbbtn]');
  if (bbBtn) bbBtn.addEventListener('click', () => {
    const k = detail.querySelector('[data-addbb]').value.trim();
    if (!k) return;
    if (/[.\s]/.test(k)) { toast('键名不能含点或空格', 2600); return; }
    setField(kind, id, 'bb.' + k, 0);
    validate(); render();
  });

  const syncTh = $('#syncTh');
  if (syncTh) syncTh.addEventListener('click', () => {
    const th = (getPath(rec, 'thresholds') || []).slice();
    if (!th.length) { toast('先在上面的 thresholds 里填数字', 2600); return; }
    if (typeof rec.bb?.power_bond_char_cnt === 'number' && th[1] != null) setField(kind, id, 'bb.power_bond_char_cnt', th[1]);

/**
 * 道具 / 卡 / 效果三张新表专有的按钮接线。
 *
 * 为什么不塞进上面的通用规则：它们是「改数组结构」「跨记录推拉」「换页签」这三类动作，
 * 都需要知道当前记录是谁、往哪张表写；通用规则只看 data-path，判断不了。
 */
function wireExtra(kind, id) {
  const detail = $('#detail');
  if (!detail) return;
  const rec = () => recordOf(kind, id);

  /* 加键：input[data-newkey="路径"] 与 button[data-newkeybtn="同一个路径"] 配对 */
  for (const b of detail.querySelectorAll('[data-newkeybtn]')) b.addEventListener('click', () => {
    const path = b.dataset.newkeybtn;
    const inp = detail.querySelector('[data-newkey="' + path + '"]');
    const k = String((inp && inp.value) || '').trim();
    if (!k) { toast('先在那个框里填键名', 2800); if (inp) inp.focus(); return; }
    if (!/^[\w#$.[\]-]+$/.test(k)) { toast('键名里不该有空格或中文：' + k, 3600); return; }
    const r = rec();
    if (!r) return;
    if (getPath(r, path + '.' + k) !== undefined) { toast('这个键已经有了：' + k, 3000); return; }
    // bb 是数值 → 默认 0；bbStr 是引用 → 默认空串（校验页会提醒是空的）
    setField(kind, id, path + '.' + k, /\.bb$/.test(path) ? 0 : '');
    if (inp) inp.value = '';
    validate(); render();
    toast('已加 ' + path + '.' + k + '：数值请自己填对', 3600);
  });

  /* 新增 / 删除整条 buff */
  for (const b of detail.querySelectorAll('[data-buffadd]')) b.addEventListener('click', () => {
    const r = rec();
    if (!r) return;
    const buffs = clone(Array.isArray(r.buffs) ? r.buffs : []) || [];
    buffs.push({ key: 'env_gbuff_new_with_verify', countType: 'NONE', bb: {}, bbStr: { key: 'attr_common_global_buff' } });
    setField(kind, id, 'buffs', buffs);
    validate(); render();
    toast('已加一条骨架 buff：先挑 bbStr.key（战斗符文），再填数值；要不要销毁 key 决定', 6000);
  });
  for (const b of detail.querySelectorAll('[data-buffdel]')) b.addEventListener('click', () => {
    const r = rec();
    if (!r) return;
    const i = Number(b.dataset.buffdel);
    const buffs = clone(Array.isArray(r.buffs) ? r.buffs : []) || [];
    if (!confirm('删掉第 ' + i + ' 条 buff？这条 buff 的效果会一起消失。')) return;
    buffs.splice(i, 1);
    setField(kind, id, 'buffs', buffs);
    validate(); render();
  });

  /* params 一键按 buffs 重建 */
  for (const b of detail.querySelectorAll('[data-paramsync]')) b.addEventListener('click', () => {
    const r = rec();
    if (!r) return;
    const { flat, dup } = foldParams(r.buffs);
    setField(kind, id, 'params', flat);
    validate(); render();
    toast('已按 buffs 重建 params（' + Object.keys(flat).length + ' 个键）'
      + (dup.length ? '；重名键只留下了最后一个：' + dup.join('、') : ''), 6000);
  });

  /* 跳到别的页签看某条记录 */
  for (const b of detail.querySelectorAll('[data-goto]')) b.addEventListener('click', (ev) => {
    ev.preventDefault();
    const tab = b.dataset.goto;
    if (!$('#tabs').querySelector('[data-tab="' + tab + '"]')) { toast('没有这个页签：' + tab, 3200); return; }
    if (b.dataset.gotoId) selected[tab] = b.dataset.gotoId;
    state.q = '';
    activeTab = tab;
    for (const x of $('#tabs').querySelectorAll('button')) x.classList.toggle('on', x.dataset.tab === tab);
    render();
  });

  /* 道具 ↔ 效果记录：两个方向各一个按钮（镜像关系，运行时只读道具那份，但保持同步最省心） */
  for (const b of detail.querySelectorAll('[data-pushmirror]')) b.addEventListener('click', () => {
    const r = rec();
    const eid = r && r.effectId;
    const eff = effectOf(eid);
    if (!eff) { toast('effects.json 里找不到 ' + (eid || '（空 effectId）'), 4200); return; }
    if (!confirm('把这条记录的 buffs / params / 文案覆盖到效果记录 «' + eid + '»？')) return;
    suppressSync = true;
    setField('effects', eid, 'buffs', clone(r.buffs) || []);
    setField('effects', eid, 'params', clone(r.params) || {});
    setField('effects', eid, 'desc', r.desc ?? '');
    setField('effects', eid, 'descRaw', r.descRaw ?? '');
    suppressSync = false;
    validate(); render();
    toast('已同步到 ' + eid, 3600);
  });
  for (const b of detail.querySelectorAll('[data-pullmirror]')) b.addEventListener('click', () => {
    const r = rec();
    const eid = r && r.effectId;
    const eff = effectOf(eid);
    if (!eff) { toast('effects.json 里找不到 ' + (eid || '（空 effectId）'), 4200); return; }
    if (!confirm('用效果记录 «' + eid + '» 的 buffs / params / 文案覆盖这条记录？')) return;
    suppressSync = true;
    setField(kind, id, 'buffs', clone(eff.buffs) || []);
    setField(kind, id, 'params', clone(eff.params) || {});
    setField(kind, id, 'desc', eff.desc ?? '');
    setField(kind, id, 'descRaw', eff.descRaw ?? '');
    suppressSync = false;
    validate(); render();
    toast('已从效果记录拉回', 3600);
  });
}

/** 各 id 列表指向哪个池子（用于名字解析与补全）。 */
const POOL_OF = { members: 'chess', owners: 'chess', bonds: 'bonds', garrisonIds: 'garrisons' };

/**
 * 按 data-path 找出这条路径属于哪张表、哪条记录、相对路径是什么。
 * 干员页会把 chess / bonds / garrisons / backups 四张表的字段混在一张表单里，需要它来分流。
 */
function formRoot(path) {
  const cur = pageCtx;
  const seg = splitPath(path);
  // 特质页：整页都是特质字段（bb.* / desc 这类在盟约与特质里都合法，靠上下文区分）
  if (cur && cur.traitPage) return { kind: 'garrisons', id: cur.id, rel: path };
  if (cur && cur.kind === 'diy') {
    const cid = cur.id;
    /*
     * 自选干员的字段路径相对「合成记录」（t[charId]，键为 op / un），但真实位置在
     * backups.json 的 diy.operators[charId] 与 units[charId] 下，所以这里必须翻译：
     *   op.*  → diy.operators.<charId>.*      un.*  → units.<charId>.*
     * diySet 认识这两种真实路径（也接受 cid.op.* 的旧写法）。
     */
    if (seg[0] === 'diy' || seg[0] === 'units') return { kind: 'backups', id: cid, rel: path };
    if (seg[0] === 'op') return { kind: 'backups', id: cid, rel: 'diy.operators.' + cid + (seg.length > 1 ? '.' + seg.slice(1).join('.') : '') };
    if (seg[0] === 'un') return { kind: 'backups', id: cid, rel: 'units.' + cid + (seg.length > 1 ? '.' + seg.slice(1).join('.') : '') };
    if (seg[0] === cid) return { kind: 'backups', id: cid, rel: path };
  }
  if (cur && cur.kind === 'chess') {
    if (seg[0] === 'bonds' || seg[0] === 'garrisonIds' || seg[0] === 'stats' || seg[0] === 'tier' || seg[0] === 'price' || seg[0] === 'name')
      return { kind: 'chess', id: cur.id, rel: path };
  }
  const seg1 = seg[0];
  if (seg1 === 'bonds') return { kind: 'bonds', id: cur ? cur.id : null, rel: path };
  const gid = seg[0].replace(/^__garrison\./, '');
  if (seg[0].startsWith('__garrison.') || (work.garrisons && work.garrisons[gid]))
    return { kind: 'garrisons', id: gid, rel: seg[0].startsWith('__garrison.') ? seg.slice(1).join('.') : path };
  return { kind: seg1, id: seg[1] || null, rel: path };
}

function addId(kind, id, path) {
  const inp = $('#detail').querySelector(`[data-add="${path}"]`);
  const raw = inp.value.trim();
  if (!raw) return;
  if (looksLikeProse(raw)) {
    toast('这看起来是一段文案，不是 id。id 形如 garrison_70_a / chess_char_1_20_a。若想改这条特质的文字，请用上面的「文案」文本框。', 7000);
    inp.select();
    return;
  }
  const poolKind = POOL_OF[path.replace(/\[.*$/, '').replace(/^.*\./, '')];
  let value = raw;
  if (poolKind) {
    const r = resolveId(poolKind, raw);
    if (!r) { toast('找不到「' + raw + '」对应的 id。请检查名字，或直接粘贴 id。', 4200); inp.select(); return; }
    if (r.how === 'ambiguous' && r.candidates && r.candidates.length > 1) {
      // 同名多条（例如同一个特质的精一版与精二版）：不猜，列出来让用户点
      showCandidates(kind, id, path, poolKind, raw, r.candidates);
      return;
    }
    value = r.id;
    if (r.how !== 'id') toast('已按名字匹配：' + raw + ' → ' + value, 3600);
  }
  const root = formRoot(path);
  const host = hostOf(root.kind, root.id);
  const arr = [...(getPath(host, root.rel) || [])];
  if (arr.includes(value)) { toast('已存在：' + value, 2200); return; }
  arr.push(value);
  if (root.kind === 'backups') diySet(root.id, root.rel, arr);
  else setField(root.kind, root.id, root.rel, arr);
  validate(); render();
}

/**
 * 把一条特质复制成「某个干员专属」的副本，并把该干员的 garrisonIds 指过去。
 * 用途：特质文本是**多人共用**的（例如 garrison_107 同时被宴与雷蛇引用），
 * 直接改它会连带改到别人；复制一份后改文本就只影响这个干员。
 * 注意 bbStr.garrison_key 是回指自身的字段，必须一起改。
 */
function copyGarrisonForChess(chessId, gid) {
  const src = work.garrisons[gid];
  if (!src) { toast('找不到特质 ' + gid, 2600); return null; }
  const base = gid.replace(/_[ab]$/, '');
  let n = 1, nid = base + '_' + chessId.replace(/^chess_/, '') + '_a';
  while (work.garrisons[nid]) nid = base + '_' + chessId.replace(/^chess_/, '') + '_a' + n++;
  const copy = clone(src);
  copy.garrisonId = nid;
  if (copy.bbStr && typeof copy.bbStr.garrison_key === 'string') copy.bbStr.garrison_key = nid;
  copy.owners = [chessId];
  work.garrisons[nid] = copy;
  log.push({ file: 'garrisons', id: nid, field: '(整条新增)', from: null, to: clone(copy) });
  const rec = work.chess[chessId];
  const arr = (rec.garrisonIds || []).map((g) => (g === gid ? nid : g));
  if (!arr.includes(nid)) arr.push(nid);
  setField('chess', chessId, 'garrisonIds', arr);
  clearIndexCache();
  toast('已为该干员复制专属特质：' + nid + '。现在改它的文本不会影响其他干员。', 6400);
  return nid;
}

/** bb 键 → 中文口径（用于按数值生成文本）。 */
const BB_WORD = {
  bond_add_count: '层数',
  max_add_count_per_battle: '本场上限',
  count: '次数',
  layer: '层数',
  multi: '倍数',
  divide_num: '每N层',
  atk: '攻击力',
  max_hp: '生命值',
  def: '防御力',
  attack_speed: '攻击速度',
  sp_recovery_per_sec: '每秒技力',
  hp_recovery_per_sec: '每秒生命',
  price: '价格',
  duration: '持续',
};

/** 按当前 bb 数值改写一条文本：把 {key} 占位与常见关键字后的数字替换成真实值，并在末尾列出数值清单。 */
function numberizeText(text, bb) {
  let out = String(text ?? '');
  const bb2 = bb || {};
  out = out.replace(/\{([a-zA-Z_][\w@.]*):([^}]*)\}/g, (m, k) => (typeof bb2[k] === 'number' ? String(bb2[k]) : m));
  for (const [k, v] of Object.entries(bb2)) {
    if (typeof v !== 'number') continue;
    const word = BB_WORD[k];
    if (!word) continue;
    const re = new RegExp('(' + word + '[^0-9]{0,4})\\d+(\\.\\d+)?');
    if (re.test(out)) out = out.replace(re, '$1' + v);
  }
  return out;
}

/** 该干员所有特质的 bb 数值清单（给「按数值生成文本」用）。 */
function bbSummaryOf(g) {
  const bb = g && g.bb ? g.bb : {};
  const parts = Object.entries(bb).filter(([, v]) => typeof v === 'number').map(([k, v]) => (BB_WORD[k] || k) + '=' + v);
  return parts.join('，');
}

/**
 * 找出所有 desc/descRaw 不一致的记录。
 * 客户端渲染的是 <code>descRaw || desc</code>，所以 descRaw 才是「游戏里真实显示的那份」。
 */
function textMismatches() {
  const out = [];
  for (const [id, g] of Object.entries(work.garrisons)) {
    if (g.descRaw && plainOf(g.descRaw) !== String(g.desc ?? '').replace(/\s+/g, ' ').trim()) out.push({ kind: 'garrisons', id, pair: ['desc', 'descRaw'] });
  }
  for (const [id, r] of Object.entries(work.bonds)) {
    if (r.descRaw && plainOf(r.descRaw) !== String(r.desc ?? '').replace(/\s+/g, ' ').trim()) out.push({ kind: 'bonds', id, pair: ['desc', 'descRaw'] });
    if (r.effectDescRaw && plainOf(r.effectDescRaw) !== String(r.effectDesc ?? '').replace(/\s+/g, ' ').trim()) out.push({ kind: 'bonds', id, pair: ['effectDesc', 'effectDescRaw'] });
  }
  return out;
}

/** 把不一致的 desc 对齐到 descRaw（以游戏真实显示的那份为准）。 */
function normalizeTexts() {
  const list = textMismatches();
  for (const { kind, id, pair } of list) {
    const raw = work[kind][id][pair[1]];
    setField(kind, id, pair[0], plainOf(raw));
  }
  validate();
  return list.length;
}

/** 干员的「文案」区块：逐条特质给出文本框（已专属可直接改；共用则提供复制按钮）。 */
function textsBlock(kind, id, rec) {
  const gids = rec.garrisonIds || [];
  const rows = gids.map((gid, idx) => {
    const ord = (idx + 1) + '/' + gids.length;
    const g = work.garrisons[gid];
    if (!g) return '<div class="txrow"><div class="txhead"><b>' + esc(ord) + '</b><code>' + esc(gid) + '</code><span class="chip bad" style="font-size:10px">不存在</span></div></div>';
    const owners = Array.isArray(g.owners) ? g.owners : [];
    const mine = owners.length <= 1 && owners.includes(id);
    if (!mine) {
      const others = owners.filter((o) => o !== id).length;
      return '<div class="txrow">'
        + '<div class="txhead"><b>' + esc(ord) + '</b><code>' + esc(gid) + '</code>'
        + '<span class="chip warn" style="font-size:10px">与其他 ' + others + ' 名干员共用</span>'
        + '</div>'
        + '<textarea rows="3" readonly>' + esc(g.desc || '') + '</textarea>'
        + '<div class="hint">数值：' + esc(bbSummaryOf(g) || '（无）') + ' ｜ 这条特质有 ' + owners.length + ' 名拥有者，'
        + '共用的记录不能直接改文本（改了所有人看到的都变）。</div>'
        + '<div class="txfoot"><button class="tiny" data-copyg="' + esc(gid) + '">复制一份专属文本再改</button></div>'
        + '</div>';
    }
    const otherOwners = owners.filter((o) => o !== id);
    return '<div class="txrow">'
      + '<div class="txhead"><b>' + esc(ord) + '</b><code>' + esc(gid) + '</code>'
      + '<span class="chip ok" style="font-size:10px">该干员专属</span>'
      + (otherOwners.length ? '<span class="chip warn" style="font-size:10px">另有 ' + otherOwners.length + ' 名棋子里程碑引用</span>' : '')
      + '</div>'
      + '<textarea data-ov="' + esc(gid) + '" rows="3">' + esc(g.desc || '') + '</textarea>'
      + '<div class="hint">数值：' + esc(bbSummaryOf(g) || '（无）') + ' ｜ <b>改这里直接写进 garrisons.json</b>，'
      + 'desc 与 descRaw 会自动保持一致；保存后<b>刷新游戏页面</b>即可看到（数值类改动建议顺带重启服务器）。</div>'
      + '<div class="txfoot"><button class="tiny" data-numg="' + esc(gid) + '">按 bb 数值重写文本</button> '
      + '<button class="tiny" data-delg="' + esc(gid) + '">删除这份专属文本</button></div>'
      + '</div>';
  }).join('');
  return '<fieldset><legend>文案 —— 想让游戏里的字变，就在这里改</legend>'
    + '<p class="hint" style="margin:0 0 8px">游戏界面渲染的是特质的 <code>descRaw</code>，改 <code>desc</code> 会同步它。'
    + '0.2.3 起没有「文案覆盖表」了，文案必须写进 <code>garrisons.json</code> 才能生效。</p>'
    + (rows || '<p class="hint">这个干员没有特质。</p>')
    + '<p class="hint">特质记录是多人共用的：只有「该干员专属」的那条能直接改；标着「共用」的请先点「复制一份专属文本再改」，'
    + '编辑器会把这条特质复制成他自己的副本（数值一并带过来）并改指向，之后就能单独编辑，别人不受影响。</p>'
    + '</fieldset>';
}

/**
 * 改写一条特质的显示文本（游戏里看到的字）。
 *
 * 只写 desc / descRaw 两个字段：bb、bbStr、effectKey 等效果字段一律不动，所以改文案不会改数值。
 * 共用（owners 里有多名干员，或那条记录属于别人）直接拒绝——那会让别人也一起变；调用方应先让用户复制专属副本。
 * @param {string} [ownerId] 期望的唯一拥有者（棋子里程碑 id）。传入时要求 owners 恰好只有它。
 * @returns {{ok: true} | {ok: false, reason: string}} reason 供界面直接显示。
 */
function traitTextEdit(gid, text, ownerId) {
  const g = work.garrisons[gid];
  if (!g) return { ok: false, reason: '特质 ' + gid + ' 不存在' };
  const owners = Array.isArray(g.owners) ? g.owners : [];
  const mine = owners.length <= 1 && (!ownerId || owners.includes(ownerId));
  if (!mine) {
    const who = owners.length ? owners.slice(0, 3).join('、') + (owners.length > 3 ? '…' : '') : '其他干员';
    return { ok: false, reason: gid + ' 属于 ' + who + '，不能在这里改文本；请先复制一份专属副本' };
  }
  const plain = String(text == null ? '' : text).trim();
  if (!plain) return { ok: false, reason: '文本不能为空' };
  setField('garrisons', gid, 'desc', plain);
  // 游戏渲染的是 descRaw：保留官方彩色标记的那一份，必须跟着 desc 一起变。
  setField('garrisons', gid, 'descRaw', toRaw(plain));
  return { ok: true };
}

function showCandidates(kind, id, path, poolKind, raw, candidates) {
  const box = $('#detail').querySelector(`[data-add="${path}"]`);
  if (!box) return;
  const host = box.parentElement;
  const old = host.querySelector('.cand');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'cand';
  div.innerHTML = '<span class="hint" style="margin:0">「' + esc(raw) + '」匹配到 ' + candidates.length + ' 条，请点选：</span>' + candidates.map((c) => {
    const tag = poolKind === 'chess' ? chessShortTag(work.chess[c]) : (poolKind === 'garrisons' ? garrisonVerLabel(c) : '');
    const nm = displayNameOf(poolKind, work[poolKind][c], c);
    return '<button class="tiny candbtn" data-cand="' + esc(c) + '">' + esc(nm.slice(0, 28)) + (tag ? ' 【' + esc(tag) + '】' : '') + ' — ' + esc(c) + '</button>';
  }).join(' ');
  host.appendChild(div);
  for (const b of div.querySelectorAll('.candbtn')) {
    b.addEventListener('click', () => {
      const root = formRoot(path);
      const host0 = hostOf(root.kind, root.id);
      const arr = [...(getPath(host0, root.rel) || [])];
      if (arr.includes(b.dataset.cand)) { toast('已存在：' + b.dataset.cand, 2200); return; }
      arr.push(b.dataset.cand);
      if (root.kind === 'backups') diySet(root.id, root.rel, arr);
      else setField(root.kind, root.id, root.rel, arr);
      validate(); render();
    });
  }
}

/* ============================ 改动 / 补丁 ============================ */

function renderChanges(main) {
  const rows = log.map((e, i) => `<tr>
    <td class="k">${esc(e.file)}</td><td class="k">${esc(e.id)}</td><td class="k">${esc(e.field)}</td>
    <td class="old">${esc(fmt(e.from))}</td><td class="new">${esc(fmt(e.to))}</td>
    <td><button class="del" data-undo="${i}" title="撤销这一条">↺</button></td></tr>`).join('');
  main.innerHTML = `<div class="detail">
    <h2>改动 <span class="chip">${log.length}</span></h2>
    <div class="sub">改动只在内存里；点右上角「保存到 data/」才落盘（保存前自动备份原件）。</div>
    <div class="addbox" style="margin-bottom:10px">
      <button id="btnPatchPage" class="primary" ${log.length ? '' : 'disabled'} title="存成 tools/patch-my-data.mjs，重建数据/换版本后跑一次即恢复">生成可重放补丁脚本</button>
      <button id="btnUndoAll" ${log.length ? '' : 'disabled'}>撤销全部改动</button>
    </div>
    ${log.length ? `<table><thead><tr><th>文件</th><th>记录</th><th>字段</th><th>原值</th><th>新值</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">还没有改动。</div>'}
    <fieldset style="margin-top:14px"><legend>为什么还需要补丁脚本</legend>
      <p class="hint">data/*.json 是 <code>npm run build-data</code> 的产物。重跑构建或换版本会覆盖它们，手改就丢了。
      补丁脚本把「载入时的原值 → 你要的新值」固化成一段可反复执行的 Node 脚本：重建之后再跑一次即可复原。</p>
    </fieldset>
  </div>`;
  $('#btnPatchPage').addEventListener('click', showPatch);
  $('#btnUndoAll').addEventListener('click', revertAll);
  for (const b of main.querySelectorAll('[data-undo]')) b.addEventListener('click', () => {
    const e = log[+b.dataset.undo];
    // backups 的日志存的是真实路径（diy.operators.x / units.x），撤销也要走同一条写入通道
    if (e.file === 'backups') diySet(e.id, e.field, e.from, { logIt: false });
    else setField(e.file, e.id, e.field, e.from, { logIt: false });
    log.splice(+b.dataset.undo, 1);
    validate(); render();
  });
}

function buildPatchScript() {
  const byFile = {};
  for (const kind of Object.keys(FILES)) byFile[kind] = [];
  for (const e of log) if (byFile[e.file]) byFile[e.file].push(e);
  const NL = String.fromCharCode(10);
  const q = (v) => JSON.stringify(v);
  const edits = (list) => list.map((e) => '    apply(table, ' + q(e.id) + ', ' + q(e.field) + ', ' + q(e.to) + ', MODE);').join(NL);
  const out = [];
  out.push('// tools/patch-my-data.mjs - generated by the Stronghold bond editor');
  out.push('// usage: npm run build-data, then  node tools/patch-my-data.mjs, then restart the game server.');
  out.push("import { readFile, writeFile } from 'node:fs/promises';");
  out.push('');
  out.push('/** id -> record table of the file being patched (tolerates a wrapped layout). */');
  out.push('/** 取「id -> 记录」的表。根级布局（backups / choices）整份文档就是表，其余可能被包一层。 */');
  out.push('const pick = (t, file) => (/^(backups|choices)\\.json$/.test(file) ? t : (t.bonds ?? t.garrisons ?? t.chess ?? t.items ?? t.effects ?? t));');
  out.push('');
  out.push('/** value 为 null 表示「删除这个字段」（编辑器里解除锁定就是这么记的）。 */');
  out.push('function write(host, key, value) {');
  out.push('  if (value === null || value === undefined) delete host[key];');
  out.push('  else host[key] = value;');
  out.push('}');
  out.push('/** 按点号路径写值。三种记录布局，由 MODE 显式指定 —— 不去猜，猜错会把字段写到文档根上。');
  out.push(' *  flat      doc[id] 是记录，路径相对记录（bonds / chess / garrisons / items / effects）');
  out.push(' *  root-full id 是短键，路径本身是从文档根出发的完整路径（backups.json 的 diy.operators.x.xxx）');
  out.push(' *  root-rel  id 本身是从文档根出发的记录路径，字段路径相对记录（choices.json 的 cards.bounty.3）'); 
  out.push(' */');
  out.push('function walk(root, segs) {');
  out.push('  let o = root;');
  out.push('  for (let i = 0; i < segs.length - 1; i++) {');
  out.push("    if (o[segs[i]] == null || typeof o[segs[i]] !== 'object') return null;");
  out.push('    o = o[segs[i]];');
  out.push('  }');
  out.push('  return o;');
  out.push('}');
  out.push('function apply(table, id, path, value, mode) {');
  out.push('  // 与编辑器同样的切分：含 / 的段（档位键 2/1/4/0）保持完整');
  out.push("  const segs = String(path).split(/\\.(?!\\/)|(?<!\\/)\\./);");
  out.push('  const last = segs[segs.length - 1];');
  out.push('  // 候选都是「含 last 的完整路径」：walk 返回倒数第二层，也就是要写的那条记录');
  out.push("  const cands = mode === 'root-full' ? [segs]");
  out.push("    : mode === 'root-rel' ? [String(id).split('.').concat(segs)]");
  out.push('    : [[id].concat(segs), segs[0] === id ? segs : null].filter(Boolean);');
  out.push('  for (const full of cands) {');
  out.push('    const host = walk(table, full);');
  out.push('    if (host) { write(host, last, value); return; }');
  out.push('  }');
  out.push('  console.warn(' + q('skip: no such record') + ', id, path);');
  out.push('}');
  for (const kind of Object.keys(FILES)) {
    const list = byFile[kind];
    // 记录布局：backups 的日志把完整根路径存在 field 里；choices 用「根路径做 id、相对路径做 field」
    const mode = kind === 'backups' ? 'root-full' : ROOT_KINDS.has(kind) ? 'root-rel' : 'flat';
    out.push('');
    out.push('/** ' + FILES[kind] + ': ' + String(list.length) + ' change(s) */');
    out.push('{');
    out.push('  const url = new URL(' + q('../data/' + FILES[kind]) + ', import.meta.url);');
    out.push('  let raw;');
    out.push('  try { raw = JSON.parse(await readFile(url, ' + q('utf8') + ')); } catch { raw = null; }');
    out.push('  if (raw) {');
    out.push('    const table = pick(raw, ' + q(FILES[kind]) + ');');
    out.push('    const MODE = ' + q(mode) + ';');
    out.push(list.length ? edits(list) : '    // (no changes)');
    out.push('    await writeFile(url, JSON.stringify(raw));');
    out.push('    console.log(' + q('patched ') + ' + url.pathname.split(' + q('/') + ').pop());');
    out.push('  }');
    out.push('}');
  }
  out.push('');
  return out.join(NL);
}

function showPatch() {
  const text = buildPatchScript();
  $('#dlgTitle').textContent = '可重放补丁脚本';
  $('#dlgBody').innerHTML = `<p class="hint" style="margin-top:0">存成 <code>tools/patch-my-data.mjs</code>。以后每次重建数据，跑一次它就恢复你的改动。</p><pre>${esc(text)}</pre>`;
  $('#dlgCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast('已复制'); }
    catch { toast('复制失败，请手动选中', 3000); }
  };
  $('#dlg').showModal();
}

      另外 <code>data/*.json</code> 在服务器启动时读一次并冻结，改完要让服务器重启才生效。</p>

  });
}

function renderHelp(main) {
  main.innerHTML = [
    '<div class="detail">',
    '<h2>使用说明</h2>',
    '<div class="sub">一个单文件编辑器：读取 Stronghold-Protocol/data 里的 bonds.json / chess.json / garrisons.json / backups.json / items.json / choices.json / effects.json（外加只读参照 bands.json），改完写回。</div>',
    '<fieldset><legend>1. 打开与授权</legend>',
    '<p class="hint">用 <b>Chrome 或 Edge</b> 打开本文件（双击即可，不需要服务器）。点右上角「选择 data 目录」，选中你游戏的 <code>data</code> 文件夹并允许读写。</p>',
    '<p class="hint"><b>不用每次重选：</b>授权过的目录会被记住，下次打开顶栏会出现 <b>「继续用上次的目录（data）」</b>，点一下（Chrome 会再确认一次权限）就能接着改。</p>',
    '<p class="hint">其他浏览器不支持直接写盘：点「导入 JSON」或把 json 拖进来（缺哪张表就少一块功能，其余照常可用），改完点「保存到 data/」会下载文件，你自己覆盖过去。</p>',
    '</fieldset>',
    '<fieldset><legend>2. 快捷操作</legend>',
    '<p class="hint">'
    + '<code>Ctrl+S</code> 保存到 data/（浏览器默认的「保存网页」会被拦下）　·　'
    + '<code>F2</code> 跳到搜索框　·　<code>Esc</code> 关闭弹窗 / 清空搜索</p>',
    '<p class="hint">顶栏的 <b>保存到 data/</b> 会显示改动处数（<code>保存到 data/（12 处）</code>），变成黄框就说明有未保存的改动；'
    + '<b>补丁脚本</b>按钮在顶栏随时可用，不必先切到「改动」页。页面标题也会跟着变（<code>● 12 处改动 · 余 — …</code>），切到别的标签页也能看出改没改。</p>',
    '<p class="hint">详情里的记录 id（如 <code>chess_char_6_03_a</code>）<b>点一下即复制</b>。上次用的页签、名单、选中项与搜索词都会记住，重开接着改。</p>',
    '</fieldset>',
    '<fieldset><legend>3. 一名干员一页（主要用法）</legend>',
    '<p class="hint">界面<b>以干员为中心</b>：左侧选一名干员，右侧这一页就是他的全部内容，不用在数据类型之间来回跳。<br>',
    '· <b>棋子记录</b>：<b>精一 / 精二并排对照</b>，各自的盟约、特质、基础属性（maxHp / atk / def / bat / aspd / cost…）。两条记录要分别改，页面会提醒不同步。<br>',
    '· <b>盟约（每条一块）</b>：他牵扯到的每一条盟约的<b>完整内容</b>——名称、激活门槛 thresholds、countMode、weight、全部 bb 数值、desc，外加成员名单。改完即生效。<br>',
    '· <b>特质（每条一块）</b>：bb 数值、文案、effectKey（附中文说明），专属的可直接改文本，共用的点一下就能复制成专属副本。<br>',
    '· <b>自选六星</b>：左栏切到「自选六星」列表，这一页额外给出面版字段、势力、盟约、名单与锁定、各档位战斗数值。</p>',
    '<p class="hint">左侧列表可以搜<b>名字 / id / 盟约 / 特质</b>；右上角「棋子干员 / 自选六星」切换两个名单。</p>',
    '<p class="hint"><b>共用记录怎么处理：</b>一条盟约/特质通常被多名干员引用（例如炎盟约 11 名、很多特质是多人共用）。干员页里<b>允许直接改</b>，但每条会标出「还被其他 N 名干员引用（谁谁谁）」——改数值或文案会一起变，看清楚再动手。想只改一个人，就用特质上的「复制一份专属文本再改」。</p>',
    '<p class="hint">另外的页签：<b>改动</b>（diff 与撤销）、<b>校验</b>（保存前的检查）、<b>键名词典</b>（bb 键中文含义 + 出现在哪）。</p>',
    '</fieldset>',
    '<fieldset><legend>4. 特性修改页（按数据类型看）</legend>',
    '<p class="hint"><b>特性修改</b>是干员页的补充视角：这里列出<b>全部特质</b>（249 条），适合批量核对、找共用关系。搜索框支持 <b>id / 文案 / effectKey / bb 键 / 拥有者的干员 id</b>。</p>',
    '<p class="hint">右上角会显示这条特质被哪些棋子携带、effectKey 是否引擎有实现、本条 bb 数值、文案、owners。</p>',
    '<p class="hint"><b>配对（精一 ↔ 精二）怎么处理：</b>特质是 <code>garrison_N_a</code>（精一）与 <code>garrison_N_b</code>（精二）两条独立记录，页面会给出<b>并排对照表</b>（两版的 bb 键值 + 文案）。'
    + '注意：<b>官方数据里 124 对配对中有 109 对数值不同、117 对文案不同</b>——精一「+1」、精二「+2」是刻意的，所以这里<b>不做任何自动同步</b>。'
    + '想统一时才点「把这条的文案复制到配对」或「把整条（含 bb）复制到配对」。</p>',
    '<p class="hint"><b>只改了一条怎么办：</b>配对对照表里数值不同的键会标黄，一眼能看出两版差在哪；跟你要的效果对不上时再补改另一条。</p>',
    '</fieldset>',
    '<fieldset><legend>5. 各字段的含义</legend>',
    '<p class="hint"><b>盟约 bb</b>：引擎通过 <code>buffParams(record, key)</code> 读，改完保存、刷新页面即生效。<br>',
    '<b>特质</b>：<code>effectKey</code> 决定引擎用哪个实现，<code>bb</code> 是它的参数，<code>desc</code> / <code>descRaw</code> 是界面文案（游戏渲染 <code>descRaw</code>，改 <code>desc</code> 会自动同步）。<br>',
    '<b>棋子 stats</b>：战斗直接读的数值。</p>',
    '<p class="hint"><b>自选六星</b>（<code>backups.json</code>）：0.2.x 起的六星自选（甄选干员）<b>不在 chess.json 里</b>——chess 只留了 8 条通用占位。这里按干员合并两处来源：<code>diy.operators[id]</code> 是名字 / 星级 / 职业 / 势力 powers / <b>盟约 bonds</b>（自选界面与开局用），<code>units[id]</code> 是<b>战斗数值</b>（<code>forms["档位"].stats</code>，引擎与 <code>server/sim/content/kits/ops/</code> 里的专属 kit 读取）。同一个页面还能改名单：<code>ownedPool</code>（可选六星池）、<code>prototypes</code>（按星级的原型池）、<code>excluded</code>（排除）、<code>locked</code>（该槽位锁定的技能与模组）。列表里可直接搜中文名，例如「斩业星熊」。</p>',
    '<p class="hint"><b>战斗数值要谨慎：</b>那是真正进对局的攻防血费，改了会与专属 kit 注释里记录的「全潜」前提脱节。只想调强度的话优先改盟约或 bb。</p>',
    '<p class="hint"><b>想新增一条特质？</b>特质是靠 <code>effectKey</code> 找引擎里的处理器的（<code>registry.get(\'garrison:\' + effectKey)</code>）。引擎只认下面这 ' + Object.keys(EFFECT_KEYS).length + ' 个键，认不出就<b>默默不生效</b>——所以做法是「挑一个现成的键，改它的 bb 数值和文案」，凭空编键名不会有任何表现。复制给别的干员时记得<b>精一 <code>_a</code> / 精二 <code>_b</code> 两条都要复制</b>。</p>',
    '<ul class="issues">' + Object.entries(EFFECT_KEYS).map(([k, v]) =>
      `<li><span class="k">${esc(k)}</span> <span class="chip" style="font-size:10px">${v[0] === 'prep' ? '备战期' : '战斗中'}</span> ${esc(v[1])}</li>`).join('') + '</ul>',
    '<p class="hint">数值改动立刻生效（引擎通过 buffParams 读 bb）。<b>改了 bb 一定要同步 desc</b>，否则面板显示的仍是旧数字。</p>',
    '<p class="hint">每个 bb 数值的标签是<b>行内翻译</b>：<code>base_atk（干员攻击力加成 · 基础值） = +23%</code> —— 键名后面括号里就是它的中文含义，绿色 <code>= +23%</code> / <code>= ×1.5</code> / <code>= 6</code> 是当前值的可读形式。词典覆盖 data 里出现的全部 bb 键（盟约 85 个 + 特质 21 个），并在自测中校验覆盖完整性。</p>',
    '<p class="hint"><b>找不到某个键？</b>用「键名词典」页签：它列出全部 bb 键的中文含义、单位，以及<b>每个键出现在哪些记录里</b>（可一键跳转）。例如 <code>base_time</code> 只出现在盟约「萨尔贡」里，点一下就能跳过去。记录列表的搜索框也能直接搜 bb 键名。</p>',
    '<p class="hint"><b>添加时不用记 id：</b>盟约的「成员名单」和干员的「bonds / garrisonIds / owners」都可以<b>直接输入名字</b>——输入「余」回车即自动解析为 <code>chess_char_6_03_a</code>。输入框也带下拉补全（同时按名字和 id 匹配）。已添加的标签显示<b>名字</b>，鼠标悬停可看 id；特质没有名字，则显示描述首行，也可粘一段描述片段来匹配。</p>',
    '<p class="hint"><b>精一 / 精二怎么分：</b>每条干员在数据里有<b>两条记录</b>——<code>_a</code> 是普通（精一）、<code>_b</code> 是精锐（精二）。列表和标签上都标了 <code>T6·精一</code> / <code>T6·精二</code>（精锐带金色徽章，未进卡池的旧记录另标 <code>未进卡池</code>）；打开任一记录，标题右上角有「切到精锐（精二）→」按钮可一键跳到另一条。<b>特质也是成对的</b>（<code>garrison_N_a</code> = 精一版，<code>garrison_N_b</code> = 精二版，标签上标「精一 / 精二」）。改盟约或特质时，两条都要改。</p>',
    '</fieldset>',
    '<fieldset><legend>6. 效果实现的三个字段（都带中文对照）</legend>',
    '<p class="hint">特性修改页的「效果实现」不再是裸文本框，三个字段都是<b>带中文说明的下拉</b>：</p>',
    '<p class="hint"><b>effectKey</b>（43 种）—— <b>唯一决定行为的关键</b>。引擎按 <code>garrison:&lt;effectKey&gt;</code> 注册处理器，改它才会换实现。选一个引擎没实现的键，特质就<b>默默不生效</b>。</p>',
    '<p class="hint"><b>eventType</b>（7 种）—— <b>什么时候触发</b>。取自 <code>server/match/effectsMeta.js</code> 的 <code>GARRISON_HOOK</code>：<br>',
    '获得棋子时 <code>SERVER_GAIN</code>｜本轮备战开始 <code>SERVER_PREP_START</code>｜本轮备战结束 <code>SERVER_PREP_FIN</code>｜'
    + '卖出棋子时 <code>SERVER_CHESS_SOLD</code>｜计算棋子价格时 <code>SERVER_PRICE</code>｜刷新商店时 <code>SERVER_REFRESH_SHOP</code>｜'
    + '战斗中 <code>IN_BATTLE</code>（走战斗内的另一条结算路径）</p>',
    '<p class="hint"><b>effectType</b>（28 种）—— 分类标签，多数情况与 effectKey 同名；改它一般不改行为。</p>',
    '<p class="hint"><b>这两个字段是配对的</b>：同一族效果要在对应的触发时机下才成立（「获得时给盟约层数」= '
    + '<code>SERVER_GAIN</code> + <code>SERVER_ADD_BOND</code>）。乱搭配会「面板好看、实战不触发」。'
    + '所以页面下方有一张<b>搭配参考</b>表，列出官方数据里出现过的全部组合并高亮当前这条；自己配出一个新的组合，校验页会提醒你确认。</p>',
    '<p class="hint">特质自己的 <code>bb</code> 键也带中文含义了（例：<code>atk（攻击力倍率）</code>、<code>bond_add_count（每次触发增加的盟约层数）</code>），28 个键全覆盖。</p>',
    '</fieldset>',
    '<fieldset><legend>7. 混合特性页（把几条已有特质合成一条）</legend>',
    '<p class="hint">左侧点选 2 条以上特质（点一下选中、再点取消，顺序 = 标量冲突时的优先级），右侧实时给出结论。合成时<b>所有参数都取自原有特质</b>，编辑器不做任何猜测。</p>',
    '<p class="hint"><b>能合并</b>：两条的 <code>effectKey</code> 相同，且参数是列表形状（<code>bbStr.bond</code> / <code>bond_id</code> / <code>count</code> 逗号分隔）→ 结果是一条特质影响多条盟约。官方的 <code>SERVER_ADD_MULTIPLE_BOND</code> 就是这么做的。</p>',
    '<p class="hint"><b>只能保留一个</b>：参数是标量（<code>bb.atk</code> 这类）→ 同键出不了两个数，沿用排在前面的那条，被顶掉的会在结论区明确列出。</p>',
    '<p class="hint"><b>不能合并</b>：两条的 <code>effectKey</code> 不同。一条特质只能有一个实现（引擎按 <code>garrison:&lt;effectKey&gt;</code> 找处理器，不会把两个跑在一起）。'
    + '想让干员同时享受两种效果，正确做法是让他<b>同时带这两条特质</b>——页面会给一个「把它们都挂到同一名干员身上」的按钮。</p>',
    '<p class="hint">创建时撞 id 会自动加后缀（不会覆盖已有特质）；可以顺便勾选一名干员直接挂上。创建后照常保存、并在「校验」页确认没有新问题。</p>',
    '</fieldset>',
    '<fieldset><legend>8. 盟约修改页与「合成」</legend>',
    '<p class="hint"><b>盟约修改</b>列出全部盟约（核心在前），逐条改：名字、<code>thresholds</code> 激活门槛、<code>powerIdList</code> 势力名单、全部 <code>bb</code> 数值、文案、成员名单。搜索支持名字 / id / 描述 / 势力 / 成员 / <b>bb 键名</b>。</p>',
    '<p class="hint"><b>成员名单</b>是「干员侧反查」的结果，真正决定谁能吃盟约的是干员自己的 <code>bonds</code>。面板里有两个按钮：<b>加入成员</b>只改这张表；<b>按干员侧 bonds 自动重建</b>会扫描所有棋子、按构建管线同一口径重算（推荐改完干员后用它核对）。在这里改了成员但没改干员侧，重跑 <code>build-data</code> 会被覆盖。</p>',
    '<p class="hint"><b>合成新盟约</b>（详情页最下方）：以当前这条为模板生成一条新盟约，<b>继承它的效果参数与文案</b>，再改名字/数值/势力/成员。</p>',
    '<p class="hint"><b>⚠ 引擎限制（很重要）：</b>盟约的战斗效果在源码里是<b>按 id 写死</b>的——<code>server/sim/content/bonds/core.js</code> 的 <code>BUFF_KEYS</code> 只映射 8 条核心盟约，<code>addon/</code> 里另外 15 条也各按 id 分支。所以：<b>复制一条现有盟约</b> → 完整继承它的实现，改数值真实生效；<b>凭空造一个没人见过的 id</b> → 能进成员统计与层数计数，但<b>没有自己的战斗效果</b>（类似「远见 / 奇迹 / 投资人 / 调和」那类纯预备期盟约）。想有效果就复制。</p>',
    '</fieldset>',
    '<fieldset><legend>9. 道具 / 悬赏·战术卡 / 效果（三张新表）</legend>',
    '<p class="hint">这三个页签分别管 <code>data/items.json</code>（115 条道具，含 3 条法术）、<code>data/choices.json</code> 的 <code>cards.bounty</code> / <code>cards.tactic</code>（129 + 43 张机变卡）、<code>data/effects.json</code>（361 条效果本体）。引用关系是 1:1 的：道具 ↔ <code>EQUIP</code>、悬赏卡 ↔ <code>ENEMY_GAIN</code>、战术卡 ↔ <code>BUFF_GAIN</code>、盟约 ↔ <code>BOND</code>、策略（bands.json）↔ <code>BAND_INITIAL</code>。</p>',
    '<p class="hint"><b>⚠ 同一份数值落成两处，这是最容易改一半的地方：</b>战斗侧读记录自己的 <code>buffs[].bb</code> / <code>bbStr</code>；备战侧的内置效果读扁平化的 <code>params</code>。只改一处就会出现「面板写着 +30%、实际还是 +15%」。道具页与效果页都给出 <b>params 对照表</b>与「按 buffs 重建 params」按钮，口径与构建管线一致：<b>先出现者胜</b>，重名键被吞掉的值会明确标出来。</p>',
    '<p class="hint"><b>道具页</b>：名字 / 文案 / 商店与合成（<code>tier</code>、<code>price</code>、<code>mergeable</code>、<code>upgradeNum</code>、<code>upgradeChessId</code>）/ 分类与盟约 / 效果实现（buffs，逐条带中文：备战处理器键 + 战斗符文键 + 每个数值键的含义）/ params / 对应的效果记录（镜像，可一键互相同步）。</p>',
    '<p class="hint"><b>悬赏 · 战术卡页</b>：卡本体（<code>name</code>、<code>desc</code>、<code>tier</code>、<code>coin</code>、<code>count</code>、<code>rounds</code>、<code>payout</code>、<code>enemyKey</code>…）在 <code>choices.json</code>；卡的「效果」实体在 <code>effects.json</code>，所以卡片页里那块效果编辑器写的是 effects.json（控件上记着真实位置）。悬赏卡还会给出<b>两处真相对照表</b>：卡上字段 vs 效果 buff 黑板（<code>bb.coin</code> / <code>bb.count</code> / <code>bbStr.enemy_id</code>）。</p>',
    '<p class="hint"><b>效果页</b>：按 <code>effectType</code> 分组（悬赏 / 战术 / 策略 / 道具 / 盟约 / 敌人 / 练度），每条都能看到<b>谁在用这条效果</b>并一键跳过去，也能直接改它的 buffs 与 params。</p>',
    '<p class="hint"><b>危险字段</b>（改错会让功能失效）：道具的 <code>tier</code>（必须 1..6 的整数，否则会从所有商店池消失）、<code>price</code>（非负）、<code>mergeable</code> + <code>upgradeNum</code>（要成套：<code>mergeable=true</code> 且 <code>1&lt;upgradeNum&lt;100</code>）、<code>upgradeChessId</code>、<code>kind</code>、<code>buffs</code>、<code>params</code>；卡的 <code>effectId</code>、<code>payout</code>、<code>enemyKey</code>；效果的 <code>effectType</code>、<code>effectId</code>、<code>buffs</code>。</p>',
    '<p class="hint"><b>改了也不生效的字段</b>（纯元数据，已逐处核对源码）：道具的 <code>identifier</code> / <code>shopSortId</code> / <code>duration</code> / <code>effectId</code> / <code>effectName</code> / <code>implFormula</code> / <code>flavor</code>；效果的 <code>counterType</code> / <code>continuedRound</code>；悬赏卡的 <code>adds[]</code> 整块。其中 <code>items.json</code> 的 <code>effectId</code> 只是构建时的溯源链接——运行时读的是道具自己那份 buffs。</p>',
